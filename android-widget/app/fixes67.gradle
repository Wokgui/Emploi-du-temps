tasks.register('patchStableVisual67') {
    dependsOn tasks.named('patchCycleLunch66')
    doLast {
        // Do not destroy and recreate the cycle buttons: add only the missing choice.
        def finalFile = file('src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java')
        def src = finalFile.getText('UTF-8')
        def oldBlock = '''                  const wanted=[['1','1 seule'],['2','A / B'],['3','A / B / C'],['4','A / B / C / D']];
                  if(choices.querySelectorAll('.weekModeChoice').length!==4){
                    choices.innerHTML='';
                    wanted.forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.className='weekModeChoice';b.dataset.m=v;b.textContent=label;b.onclick=()=>chooseCycle(Number(v));choices.appendChild(b)});
                  }
'''
        def newBlock = '''                  const wanted=[['1','1 seule'],['2','A / B'],['3','A / B / C'],['4','A / B / C / D']];
                  const keep=new Set();
                  wanted.forEach(([v,label])=>{
                    let b=choices.querySelector('.weekModeChoice[data-m="'+v+'"]');
                    if(!b){b=document.createElement('button');b.type='button';b.className='weekModeChoice';b.dataset.m=v;choices.appendChild(b)}
                    b.textContent=label;b.onclick=()=>chooseCycle(Number(v));keep.add(b);
                  });
                  choices.querySelectorAll('.weekModeChoice').forEach(b=>{if(!keep.has(b))b.remove()});
'''
        if (src.contains(oldBlock)) src = src.replace(oldBlock, newBlock)
        src = src.replace("const APP_VERSION='6.5';", "const APP_VERSION='6.7';")
        src = src.replace("const APP_VERSION='6.6';", "const APP_VERSION='6.7';")
        finalFile.write(src, 'UTF-8')

        // Keep the older version label aligned too.
        def stabilityFile = file('src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java')
        def stability = stabilityFile.getText('UTF-8')
        stability = stability.replace("const APP_VERSION='6.5';", "const APP_VERSION='6.7';")
        stability = stability.replace("const APP_VERSION='6.6';", "const APP_VERSION='6.7';")
        stabilityFile.write(stability, 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStableVisual67')
}
