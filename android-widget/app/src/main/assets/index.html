<body>
<header class="header"><h1>Emploi du temps</h1></header>
<div class="contextBar">
  <button id="currentWeekBtn" class="currentWeek" type="button">Cette semaine : <b>A</b></button>
  <div id="weekTabs" class="weekTabs"><button class="weekTab" data-week="A">Semaine A</button><button class="weekTab" data-week="B">Semaine B</button></div>
</div>
<main class="wrap">
  <section id="viewToday" class="view active">
    <div class="dayTitle"><h2 id="todayTitle">Aujourd’hui</h2><div id="todayDate" class="date"></div></div>
    <section class="card timelineCard"><div class="timelineHead"><strong>Avancement</strong><span id="todayClock" class="timelineClock"></span></div><div class="timeline"><span id="todayProgress"></span></div><div class="timelineScale"><span id="scaleStart"></span><span id="scaleEnd"></span></div></section>
    <section id="todayList" class="card todayList"></section>
  </section>

  <section id="viewWeek" class="view">
    <div class="weekTop"><h2>Aperçu semaine <span id="weekTitleLetter" class="weekLetter">A</span></h2></div>
    <div class="weekScroller"><div id="weekGrid" class="weekGrid"></div></div>
  </section>

  <section id="viewEdit" class="view">
    <button id="importPhoto" class="importBtn" type="button">Importer une photo d’emploi du temps</button>
    <div id="importStatus" class="importStatus"></div>
    <div class="editTop"><div id="dayTabs" class="dayTabs"></div></div>
    <div class="sectionHead"><h2 id="editDayTitle">Jeudi</h2><span id="editCount" class="count"></span></div>
    <section id="editList" class="card editList"></section>
    <button id="addCourse" class="addBtn">＋ Ajouter un cours</button>
    <div class="sectionHead"><h3>Noms des interruptions</h3></div>
    <section class="card breakSettings">
      <div class="breakRow"><div class="breakName">Trou</div><input id="gapLabel" type="text" maxlength="35"><label class="badgeToggle"><input id="showGapBadge" type="checkbox">Badge</label></div>
      <div class="breakRow"><div class="breakName">Pause</div><input id="lunchLabel" type="text" maxlength="35"><label class="badgeToggle"><input id="showLunchBadge" type="checkbox">Badge</label></div>
    </section>
    <div class="sectionHead"><h3>Horaires des cours</h3></div>
    <section id="slotSettings" class="card slots"></section>
  </section>
</main>

<nav class="bottom">
  <button class="nav active" data-mode="today"><span>▣</span>Aujourd’hui</button>
  <button class="nav" data-mode="week"><span>▦</span>Semaine</button>
  <button class="nav" data-mode="edit"><span>✎</span>Modifier</button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true">
<form id="courseForm" class="sheet">
  <h3 id="modalTitle">Ajouter un cours</h3>
  <div class="field"><label>Heure de cours</label><select id="fSlot"></select></div>
  <div id="slotPreview" class="slotPreview"></div>
  <div id="courseWeekField" class="field"><label>Semaines concernées</label><div id="courseWeekChoices" class="courseWeekChoices"></div></div>
  <div class="field"><label>Classe</label><input id="fLabel" type="text" maxlength="80" required></div>
  <div class="field"><label>Salle</label><input id="fRoom" type="text" maxlength="20"></div>
  <div class="sheetActions"><button id="deleteCourse" type="button" class="btn danger" hidden>Supprimer</button><div class="rightActions"><button id="cancelEdit" type="button" class="btn">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></div>
</form>
</div>

<script>
const DAYS=[2,3,4,5,6],NAMES={2:'Lun',3:'Mar',4:'Mer',5:'Jeu',6:'Ven'},FULL={2:'Lundi',3:'Mardi',4:'Mercredi',5:'Jeudi',6:'Vendredi'};
const DEFAULT_SLOTS=[['08:00','09:00'],['09:00','10:00'],['10:00','11:00'],['11:00','12:00'],['13:00','14:00'],['14:00','15:00'],['16:00','17:00'],['17:00','18:00'],['18:00','19:00'],['19:00','20:00']].map((x,i)=>({n:i+1,start:x[0],end:x[1]}));
const DEFAULTS={
2:{enabled:true,courses:[['08:00','09:00','4G1 ALL · 4G2 ALL','217',1],['10:00','11:00','6G3BIL · 6G4BIL','217',3],['11:00','12:00','4G3 ALL · 4G4 ALL','217',4],['13:00','14:00','5G1-2-3 ALL','216',5]]},
3:{enabled:true,courses:[['08:00','09:00','5G4 ALL','217',1],['09:00','10:00','4G3 ALL · 4G4 ALL','217',2],['14:00','15:00','3G3 ALL · 3G4 ALL','216',6],['16:00','17:00','3G1 ALL · 3G2 ALL','216',7]]},
4:{enabled:true,courses:[]},
5:{enabled:true,courses:[['08:00','09:00','3G1 ALL · 3G2 ALL','216',1],['09:00','10:00','3G3 ALL · 3G4 ALL','216',2],['10:00','11:00','6G3BIL · 6G4BIL','216',3],['11:00','12:00','5G4 ALL','216',4],['13:00','14:00','6G3BIL · 6G4BIL','216',5],['14:00','15:00','4G1 ALL · 4G2 ALL','215',6],['16:00','17:00','5G1-2-3 ALL','217',7]]},
6:{enabled:true,courses:[['11:00','12:00','5G1-2-3 ALL','217',4],['13:00','14:00','5G4 ALL','217',5],['14:00','15:00','3G3 ALL · 3G4 ALL','217',6],['15:00','16:00','4G3 ALL · 4G4 ALL','217',0],['16:00','17:00','4G1 ALL · 4G2 ALL','217',7]]}
};
for(const d of DAYS)DEFAULTS[d].courses=DEFAULTS[d].courses.map(c=>({start:c[0],end:c[1],label:c[2],room:c[3],slot:c[4]}));
const clone=o=>JSON.parse(JSON.stringify(o));
const OPENING_DAY=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d+1:6})();
let weeks={A:clone(DEFAULTS),B:clone(DEFAULTS)},state=weeks.A,slots=clone(DEFAULT_SLOTS),slotConfigV2=true,breaks={gapLabel:'Trou',lunchLabel:'Pause de midi',showGapBadge:true,showLunchBadge:true},mode='today',selected=OPENING_DAY,editing=null,newPrefill=null,currentWeek='A',activeWeek='A',courseWeekSelection=new Set(['A']);
const $=id=>document.getElementById(id),min=t=>{const [h,m]=(t||'00:00').split(':').map(Number);return h*60+m},clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normalizeWeek(obj){
  for(const d of DAYS){
    if(!obj[d])obj[d]={enabled:true,courses:[]};obj[d].enabled=true;if(!Array.isArray(obj[d].courses))obj[d].courses=[];
    for(const c of obj[d].courses){c.slot=Number(c.slot||0);if(!c.slot){const match=slots.find(s=>s.start===c.start&&s.end===c.end);if(match)c.slot=match.n}}
    obj[d].courses.sort((a,b)=>min(a.start)-min(b.start));
  }
}
function normalize(){
  if(!Array.isArray(slots)||!slots.length)slots=clone(DEFAULT_SLOTS);
  const seenSlots=new Set();
  slots=slots.slice(0,10).map((s,i)=>{const n=Math.max(1,Math.min(10,Number(s?.n)||i+1)),fallback=DEFAULT_SLOTS.find(x=>x.n===n)||DEFAULT_SLOTS[Math.min(i,DEFAULT_SLOTS.length-1)];return {n,start:s?.start||fallback.start,end:s?.end||fallback.end}}).filter(s=>!seenSlots.has(s.n)&&(seenSlots.add(s.n),true));
  breaks.gapLabel=(breaks.gapLabel||'Trou').trim()||'Trou';breaks.lunchLabel=(breaks.lunchLabel||'Pause de midi').trim()||'Pause de midi';breaks.showGapBadge=breaks.showGapBadge!==false;breaks.showLunchBadge=breaks.showLunchBadge!==false;
  normalizeWeek(weeks.A);normalizeWeek(weeks.B);state=weeks[mode==='today'?currentWeek:activeWeek];
}
function load(){
  try{
    let raw=null;if(window.AndroidSchedule&&AndroidSchedule.loadSchedule)raw=AndroidSchedule.loadSchedule();else raw=localStorage.getItem('edt');
    if(raw){const root=JSON.parse(raw);slotConfigV2=root._slotConfigV2===true;if(root._slots)slots=root._slots.map((s,i)=>({n:Math.max(1,Math.min(10,Number(s.n)||i+1)),start:s.start,end:s.end}));if(!slotConfigV2&&slots.length===9){const last=slots[slots.length-1],start=last?.end||'19:00',end=clock(Math.min(1439,min(start)+60));slots.push({n:10,start,end});slotConfigV2=true}if(root._breaks)breaks={...breaks,...root._breaks};currentWeek=(root._currentWeek==='B')?'B':'A';activeWeek=currentWeek;
      if(root._weeks){for(const w of ['A','B'])if(root._weeks[w])for(const d of DAYS)if(root._weeks[w][d])weeks[w][d]=root._weeks[w][d]}
      else{const legacy=clone(DEFAULTS);for(const d of DAYS)if(root[d])legacy[d]=root[d];weeks.A=clone(legacy);weeks.B=clone(legacy)}
    }
  }catch(e){weeks={A:clone(DEFAULTS),B:clone(DEFAULTS)};slots=clone(DEFAULT_SLOTS);breaks={gapLabel:'Trou',lunchLabel:'Pause de midi',showGapBadge:true,showLunchBadge:true};currentWeek='A';activeWeek='A'}
  normalize();render();
}
window.reloadSchedule=load;
function exportState(){const root={_slots:slots.map(s=>({n:s.n,start:s.start,end:s.end})),_slotConfigV2:true,_breaks:{...breaks},_currentWeek:currentWeek,_weeks:{}};for(const w of ['A','B','C','D']){if(!weeks[w])continue;root._weeks[w]={};for(const d of DAYS)root._weeks[w][d]={enabled:true,courses:weeks[w][d]?.courses||[]}}const current=weeks[currentWeek];for(const d of DAYS)root[d]={enabled:true,courses:current[d].courses};return root}
function save(options){normalize();const raw=JSON.stringify(exportState());try{if(window.AndroidSchedule&&AndroidSchedule.saveSchedule)AndroidSchedule.saveSchedule(raw);else localStorage.setItem('edt',raw)}catch(e){}if(!(options&&options.render===false))render()}
function todayKey(){const d=new Date().getDay();return d>=1&&d<=5?d+1:6}
function currentCourse(day){const now=new Date(),m=now.getHours()*60+now.getMinutes();if(day!==now.getDay()+1)return null;return weeks[currentWeek][day].courses.find(c=>m>=min(c.start)&&m<min(c.end))||null}
function lunch(){if(slots.length<5)return null;const start=slots[3]?.end,end=slots[4]?.start;return start&&end&&min(end)>min(start)?{start,end}:null}
function gapSegments(list){const out=[],l=lunch(),ls=l?min(l.start):-1,le=l?min(l.end):-1;for(let i=0;i<list.length-1;i++){let a=min(list[i].end),b=min(list[i+1].start);if(b<=a)continue;if(!l||b<=ls||a>=le)out.push({start:a,end:b});else{if(a<ls)out.push({start:a,end:Math.min(b,ls)});if(b>le)out.push({start:Math.max(a,le),end:b})}}return out.filter(g=>g.end>g.start)}
function progressPercent(){const d=todayKey(),list=weeks[currentWeek][d].courses,now=new Date(),nowM=now.getHours()*60+now.getMinutes();let total=0,done=0;for(const c of list){const s=min(c.start),e=min(c.end),dur=Math.max(0,e-s);total+=dur;if(nowM>=e)done+=dur;else if(nowM>s)done+=Math.min(dur,nowM-s)}return total?Math.max(0,Math.min(100,done*100/total)):0}
function setMode(m){mode=m;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('view'+m[0].toUpperCase()+m.slice(1)).classList.add('active');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='today')activeWeek=currentWeek;render()}
window.setModeFromAndroid=setMode;
function setActiveWeek(w){activeWeek=w==='B'?'B':'A';render()}

<script>

  function cleanVacationTitle(){

    document.querySelectorAll('#advancedSettings85 .settingTitle,#advancedSettings85 .schoolTitle,#advancedSettings85 .edtDaysOffTitle696').forEach(el=>{

  function parseIcsDate(value){
    const m=String(value||'').match(/(\d{4})(\d{2})(\d{2})/);if(!m)return null;
    return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0,0);
  }
  function dateKey725(d){
    return String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function unfoldIcs(text){
    return String(text||'').replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/);
  }
  function parseSchoolIcs(text){
    const lines=unfoldIcs(text),events=[];let ev=null;
    for(const line of lines){
      if(line==='BEGIN:VEVENT'){ev={};continue}
      if(line==='END:VEVENT'){if(ev&&ev.start&&ev.end)events.push(ev);ev=null;continue}
      if(!ev)continue;
      if(line.startsWith('SUMMARY'))ev.summary=line.slice(line.indexOf(':')+1).replace(/\\,/g,',').replace(/\\;/g,';');
      else if(line.startsWith('DTSTART'))ev.start=line.slice(line.indexOf(':')+1);
      else if(line.startsWith('DTEND'))ev.end=line.slice(line.indexOf(':')+1);
    }
    const now=new Date();now.setHours(0,0,0,0);
    const unique=new Map();
    for(const item of events){
      const start=parseIcsDate(item.start),endExclusive=parseIcsDate(item.end);if(!start||!endExclusive)continue;
      const end=new Date(endExclusive);end.setDate(end.getDate()-1);
      if(end<now)continue;
      const summary=String(item.summary||'Vacances scolaires').replace(/^Vacances scolaires\s*[-–—:]?\s*/i,'').trim()||'Vacances scolaires';
      const key=dateKey725(start)+'|'+dateKey725(end)+'|'+summary;
      unique.set(key,{start:dateKey725(start),end:dateKey725(end),label:'Vacances scolaires · '+summary,source:'schoolCalendarAuto'});
    }
    return [...unique.values()].sort((a,b)=>a.start.localeCompare(b.start));
  }

  let schoolFetchBusy=false;
  async function fetchSchoolVacations725(force){
    if(schoolFetchBusy)return;
    const enabled=document.getElementById('schoolEnabled'),zone=document.getElementById('schoolZone'),status=document.getElementById('schoolAutoStatus725');
    if(!enabled||!zone)return;
    const a=readAdvanced();
    if(!enabled.checked){
      a.schoolVacationEnabled=false;
      if(Array.isArray(a.dayOffRanges))a.dayOffRanges=a.dayOffRanges.filter(r=>r&&r.source!=='schoolCalendar'&&r.source!=='schoolCalendarAuto');
      writeAdvanced(a);refreshAfterSettings();return;
    }
    if(!force){
      const last=Number(a.schoolVacationAutoUpdatedAt||0);
      if(last&&Date.now()-last<7*24*60*60*1000)return;
    }
    schoolFetchBusy=true;
    if(status)status.textContent='Recherche des vacances officielles…';
    const z=['A','B','C'].includes(zone.value)?zone.value:'B';
    const url='https://fr.ftp.opendatasoft.com/openscol/fr-en-calendrier-scolaire/Zone-'+z+'.ics';
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const ranges=parseSchoolIcs(await res.text());
      if(!ranges.length)throw new Error('Aucune période');
      const next=readAdvanced();
      if(!Array.isArray(next.dayOffRanges))next.dayOffRanges=[];
      next.dayOffRanges=next.dayOffRanges.filter(r=>r&&r.source!=='schoolCalendar'&&r.source!=='schoolCalendarAuto').concat(ranges);
      next.schoolVacationEnabled=true;next.schoolVacationZone=z;
      next.schoolVacationAutoUpdatedAt=Date.now();next.schoolVacationAutoCount=ranges.length;
      writeAdvanced(next);
      if(status)status.textContent=ranges.length+' périodes à venir chargées · zone '+z;
      refreshAfterSettings();
    }catch(err){
      if(status)status.textContent='Mise à jour impossible · données déjà enregistrées conservées';
      const next=readAdvanced();next.schoolVacationEnabled=true;next.schoolVacationZone=z;writeAdvanced(next);
    }finally{schoolFetchBusy=false}
  }

  function setupSchoolCalendar(){
    const enabled=document.getElementById('schoolEnabled'),zone=document.getElementById('schoolZone'),block=document.getElementById('schoolCalendarBlock');

    cleanVacationTitle();
    const enableLabel=document.getElementById('schoolEnableLabel');

    let button=document.getElementById('schoolAutoFetch725');

    if(!enabled.__edt725){
      enabled.__edt725=true;
      enabled.onchange=()=>{

        const a=readAdvanced();a.schoolVacationZone=zone.value;writeAdvanced(a);
        if(enabled.checked)fetchSchoolVacations725(true);
      };
    }
    button.onclick=()=>{enabled.checked=true;fetchSchoolVacations725(true)};
    const a=readAdvanced();
    if(a.schoolVacationEnabled===true)enabled.checked=true;

    if(enabled.checked){
      const last=Number(a.schoolVacationAutoUpdatedAt||0);
      if(!window.__schoolAutoLastTry725||Date.now()-window.__schoolAutoLastTry725>60000){
        window.__schoolAutoLastTry725=Date.now();
        if(!last||Date.now()-last>7*24*60*60*1000)setTimeout(()=>fetchSchoolVacations725(false),250);
      }
    }
  }

  function ensureProfileModal(){

    modal.innerHTML='<form id="profileForm725" class="sheet profileSheet725"><h3 id="profileTitle725">Nouveau profil</h3><div class="field"><label for="profileName725">Nom du profil</label><input id="profileName725" class="profileInput725" type="text" maxlength="40" autocomplete="off" required></div><label id="profileDupRow725" class="profileDup725"><input id="profileDuplicate725" type="checkbox" checked><span>Dupliquer le profil actuel</span></label><div class="advModalActions"><button id="profileCancel725" type="button" class="btn">Annuler</button><button id="profileSave725" type="submit" class="btn primary">Créer</button></div></form>';

    if(!root){
      root=document.createElement('div');root.id='appBaseControls725';
      root.innerHTML='<label class="appBaseToggle725"><input id="appShowRoom725" type="checkbox"><span>Salle</span></label><label class="appBaseToggle725"><input id="appShowCourse725" type="checkbox"><span>Cours</span></label><label class="appBaseToggle725"><input id="appShowTimes725" type="checkbox"><span>Heure</span></label><label class="appBaseToggle725"><input id="appShowProgress725" type="checkbox"><span>Progression du cours</span></label>';
      title.insertAdjacentElement('afterend',root);
    }
    const a=readAdvanced();
    const defs=[['appShowRoom725','appShowRoom'],['appShowCourse725','appShowCourse'],['appShowTimes725','appShowTimes'],['appShowProgress725','appShowCourseProgress']];
    defs.forEach(([id,key])=>{
      const input=document.getElementById(id);if(!input)return;
      let value=a[key];
      if(value===undefined&&key==='appShowRoom')value=a.showRoom!==false;

  }

  let queued=false;
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;apply()})}
  const sheet=document.getElementById('settingsSheet');
  if(sheet)new MutationObserver(schedule).observe(sheet,{childList:true,subtree:true});
  document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('#settingsBtn,#settingsSheet'))setTimeout(schedule,0)},true);
  document.addEventListener('change',e=>{if(e.target&&e.target.id==='languageSelect')setTimeout(()=>{fitLanguageSelect();cleanVacationTitle()},0)},true);
  apply();setTimeout(apply,120);setTimeout(apply,550);
})();
</script>
