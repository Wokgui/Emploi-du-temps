<!doctype html>
<html lang="fr">
<head>

<title>Emploi du temps</title>
<style>
:root{--blue:#0877f9;--blue2:#075fae;--teal:#087f8b;--ink:#111936;--muted:#68738a;--line:#dce3eb;--panel:#fff;--soft:#f2f8ff;--bg:#f6f8fb;--danger:#d93b59;--gap:#7254b5;--lunch:#9a6212}
*{box-sizing:border-box}

button,input,select{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.header{height:78px;padding-top:17px;background:linear-gradient(135deg,#0c86cf,#0668b5);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 10px #064a7a25}
.header h1{margin:0;text-align:center;font-size:1.45rem;line-height:1;font-weight:820}

.currentWeek{border:0;border-radius:999px;background:#e6f1ff;color:#075fae;padding:6px 10px;font-size:.78rem;font-weight:800;white-space:nowrap}.currentWeek b{color:var(--blue)}
.weekTabs{display:flex;gap:4px}.weekTab{border:1px solid #cdd9e7;background:#fff;color:#536078;border-radius:999px;padding:5px 10px;font-size:.76rem;font-weight:800}.weekTab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:8px 8px 66px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 5px #11233b0b}
.view{display:none}.view.active{display:block}
.dayTitle{text-align:center;margin:0 0 6px}.dayTitle h2{margin:0;font-size:1.05rem}.dayTitle .date{margin-top:1px;color:var(--muted);font-size:.76rem}
.timelineCard{padding:7px 10px;margin-bottom:7px}.timelineHead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem}.timelineHead strong{color:var(--teal)}.timelineClock{color:var(--muted);font-variant-numeric:tabular-nums}.timeline{height:7px;border-radius:999px;background:#e4e8ee;overflow:hidden;margin-top:5px}.timeline>span{height:100%;display:block;width:0;background:linear-gradient(90deg,#0877f9,#2994f0);border-radius:999px}.timelineScale{display:flex;justify-content:space-between;color:#8a93a3;font-size:.62rem;margin-top:2px}
.todayList{overflow:hidden}.todayCourse{display:grid;grid-template-columns:67px minmax(0,1fr) auto;align-items:center;gap:7px;min-height:44px;padding:5px 8px;border-top:1px solid #edf0f4;position:relative;cursor:pointer}.todayCourse:first-child{border-top:0}.todayCourse.current:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;background:var(--blue)}.todayCourse.gap{background:#faf8ff}.todayCourse.lunch{background:#fffaf1}.time{font-variant-numeric:tabular-nums;color:#56637a;font-size:.74rem;line-height:1.12}.label{font-weight:800;font-size:.88rem;line-height:1.1}.room{color:var(--muted);font-size:.70rem;margin-top:2px}.badge{font-size:.64rem;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:4px 6px}.badge.gap{background:#ede8ff;color:var(--gap)}.badge.lunch{background:#ffedca;color:var(--lunch)}
.empty{padding:20px 12px;text-align:center;color:var(--muted)}
.weekTop{display:flex;align-items:center;justify-content:center;margin:0 0 6px}.weekTop h2{margin:0;font-size:1rem}.weekTop .weekLetter{color:var(--blue);margin-left:5px}
.weekScroller{overflow:hidden}.weekGrid{display:grid;grid-template-columns:42px repeat(5,minmax(0,1fr));width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;overflow:hidden}
.wh,.wc{border-right:1px solid #e6ebf0;border-bottom:1px solid #e6ebf0;min-width:0;min-height:38px;padding:2px}.wh{background:linear-gradient(#f8fbff,#f1f7ff);font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;font-size:.65rem}.wh.day{color:#0b69c7}.wh.timecol{color:#657087;font-size:.58rem;line-height:1.08}.wc{background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}.wc.has{background:#fbfdff}.wc.has:active{background:#eaf5ff}.wc.gapCell{background:#faf8ff;color:var(--gap)}.wc.lunchCell{background:#fffaf1;color:var(--lunch)}.wc .cellLabel{font-weight:800;font-size:.60rem;line-height:1.02;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.wc .cellRoom{font-size:.52rem;color:var(--muted);margin-top:1px}.wc.emptyCell{color:#c5ccd5;font-size:.75rem}
.editTop{display:flex;justify-content:center;margin-bottom:6px}.dayTabs{display:flex;justify-content:center;gap:5px;overflow:auto;max-width:100%}.dayTab{min-width:48px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 9px;color:#4d5667;font-size:.82rem}.dayTab.active{background:linear-gradient(135deg,#1584ed,#0868c7);border-color:#1178e8;color:#fff}
.importBtn{width:100%;margin-bottom:7px;padding:8px 10px;border:1px solid #bad5f4;border-radius:7px;background:#edf6ff;color:#0867bd;font-size:.82rem;font-weight:800}.importBtn:disabled{opacity:.6}.importStatus{text-align:center;color:var(--muted);font-size:.70rem;margin:-3px 0 6px;min-height:1em}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 3px 5px}.sectionHead h2,.sectionHead h3{margin:0;font-size:.93rem}.count{color:var(--blue);font-weight:750;font-size:.78rem}
.editList{overflow:hidden}.editCourse{display:grid;grid-template-columns:66px minmax(0,1fr);gap:7px;align-items:center;min-height:45px;padding:6px 9px;border-top:1px solid #e9edf2;cursor:pointer}.editCourse:first-child{border-top:0}.editCourse:active{background:#eef6ff}
.addBtn{width:100%;margin-top:7px;padding:9px;border:1.5px dashed var(--blue);border-radius:7px;background:#fff;color:var(--blue);font-size:.84rem;font-weight:800}
.breakSettings{overflow:hidden}.breakRow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px 8px;border-top:1px solid #e9edf2}.breakRow:first-child{border-top:0}.breakName{font-size:.75rem;font-weight:800}.breakRow input[type=text]{min-width:0;width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;font-size:.76rem}.badgeToggle{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.68rem;white-space:nowrap}.badgeToggle input{width:16px;height:16px}
.slots{overflow:hidden}.slotRow{display:grid;grid-template-columns:92px 1fr 1fr;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid #e9edf2}.slotRow:first-child{border-top:0}.slotNum{font-weight:800;color:#0c71d2;font-size:.75rem}.slotRow input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 5px;font-size:.76rem;background:#fff;color:var(--ink)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#ffffffef;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:4px 7px calc(4px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.nav{border:0;background:transparent;color:#777;padding:5px 3px;font-size:.72rem}.nav span{display:block;font-size:1.05rem;margin-bottom:0}.nav.active{color:var(--blue);font-weight:800}
.modal{position:fixed;inset:0;z-index:30;background:#0b17384f;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:780px;margin:auto;background:#fff;padding:14px;border-radius:12px 12px 0 0;max-height:86vh;overflow:auto}.sheet h3{margin:0 0 10px;text-align:center}.field{margin-bottom:8px}.field label{display:block;color:var(--muted);font-size:.74rem;margin-bottom:3px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;background:#fff;color:var(--ink)}.slotPreview{background:var(--soft);border:1px solid #d9eaff;border-radius:7px;padding:8px 10px;margin-bottom:8px;color:#31516f;font-size:.80rem}.sheetActions{display:flex;justify-content:space-between;gap:7px;margin-top:7px}.rightActions{display:flex;gap:7px}.btn{padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:760}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--danger);border-color:#f0b9c4;background:#fff5f7}.btn[hidden]{display:none}
@media(max-width:560px){body{font-size:14px}.wrap{padding-left:6px;padding-right:6px}.header{height:78px;padding-top:17px}.header h1{font-size:1.38rem}.contextBar{height:37px;padding-left:7px;padding-right:7px}.todayCourse{min-height:42px}.weekGrid{grid-template-columns:39px repeat(5,minmax(0,1fr))}.wh,.wc{min-height:36px}.wc .cellLabel{font-size:.57rem}.wc .cellRoom{font-size:.50rem}}
</style>
</head>
<body>
<header class="header"><h1>Emploi du temps</h1></header>
<div class="contextBar">
  <button id="currentWeekBtn" class="currentWeek" type="button">Cette semaine : <b>A</b></button>
  <div id="weekTabs" class="weekTabs"><button class="weekTab" data-week="A">Semaine A</button><button class="weekTab" data-week="B">Semaine B</button></div>
</div>
<main class="wrap">
  <section id="viewToday" class="view">
    <div class="dayTitle"><h2 id="todayTitle">Aujourd’hui</h2><div id="todayDate" class="date"></div></div>
    <section class="card timelineCard"><div class="timelineHead"><strong>Avancement</strong><span id="todayClock" class="timelineClock"></span></div><div class="timeline"><span id="todayProgress"></span></div><div class="timelineScale"><span id="scaleStart"></span><span id="scaleEnd"></span></div></section>
    <section id="todayList" class="card todayList"></section>
  </section>

  <section id="viewWeek" class="view">
    <div class="weekTop"><h2>Aperçu semaine <span id="weekTitleLetter" class="weekLetter">A</span></h2></div>
    <div class="weekScroller"><div id="weekGrid" class="weekGrid"></div></div>
  </section>

  <section id="viewEdit" class="view active">
    <button id="importPhoto" class="importBtn" type="button">Importer une photo d’emploi du temps</button>
    <div id="importStatus" class="importStatus"></div>
    <div class="editTop"><div id="dayTabs" class="dayTabs"></div></div>
    <div class="sectionHead"><h2 id="editDayTitle">Jeudi</h2><span id="editCount" class="count"></span></div>
    <section id="editList" class="card editList"></section>
    <button id="addCourse" class="addBtn">＋ Ajouter un cours</button>
    <div class="sectionHead"><h3>Noms des interruptions</h3></div>
    <section class="card breakSettings">
      <div class="breakRow"><div class="breakName">Trou</div><input id="gapLabel" type="text" maxlength="35"><label class="badgeToggle"><input id="showGapBadge" type="checkbox">Badge</label></div>
      <div class="breakRow"><div class="breakName">Pause</div><input id="lunchLabel" type="text" maxlength="35"><label class="badgeToggle"><input id="showLunchBadge" type="checkbox">Badge</label></div>
    </section>
    <div class="sectionHead"><h3>Horaires des 9 heures</h3></div>
    <section id="slotSettings" class="card slots"></section>
  </section>
</main>

<nav class="bottom">
  <button class="nav" data-mode="today"><span>▣</span>Aujourd’hui</button>
  <button class="nav" data-mode="week"><span>▦</span>Semaine</button>
  <button class="nav active" data-mode="edit"><span>✎</span>Modifier</button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true">
<form id="courseForm" class="sheet">
  <h3 id="modalTitle">Ajouter un cours</h3>
  <div class="field"><label>Heure de cours</label><select id="fSlot"></select></div>
  <div id="slotPreview" class="slotPreview"></div>
  <div class="field"><label>Classe / groupe</label><input id="fLabel" type="text" maxlength="80" required></div>
  <div class="field"><label>Salle</label><input id="fRoom" type="text" maxlength="20"></div>
  <div class="sheetActions"><button id="deleteCourse" type="button" class="btn danger" hidden>Supprimer</button><div class="rightActions"><button id="cancelEdit" type="button" class="btn">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></div>
</form>
</div>

<script>
const DAYS=[2,3,4,5,6],NAMES={2:'Lun',3:'Mar',4:'Mer',5:'Jeu',6:'Ven'},FULL={2:'Lundi',3:'Mardi',4:'Mercredi',5:'Jeudi',6:'Vendredi'};
const DEFAULT_SLOTS=[['08:00','09:00'],['09:00','10:00'],['10:00','11:00'],['11:00','12:00'],['13:00','14:00'],['14:00','15:00'],['16:00','17:00'],['17:00','18:00'],['18:00','19:00']].map((x,i)=>({n:i+1,start:x[0],end:x[1]}));
const DEFAULTS={
2:{enabled:true,courses:[['08:00','09:00','4G1 ALL · 4G2 ALL','217',1],['10:00','11:00','6G3BIL · 6G4BIL','217',3],['11:00','12:00','4G3 ALL · 4G4 ALL','217',4],['13:00','14:00','5G1-2-3 ALL','216',5]]},
3:{enabled:true,courses:[['08:00','09:00','5G4 ALL','217',1],['09:00','10:00','4G3 ALL · 4G4 ALL','217',2],['14:00','15:00','3G3 ALL · 3G4 ALL','216',6],['16:00','17:00','3G1 ALL · 3G2 ALL','216',7]]},
4:{enabled:true,courses:[]},
5:{enabled:true,courses:[['08:00','09:00','3G1 ALL · 3G2 ALL','216',1],['09:00','10:00','3G3 ALL · 3G4 ALL','216',2],['10:00','11:00','6G3BIL · 6G4BIL','216',3],['11:00','12:00','5G4 ALL','216',4],['13:00','14:00','6G3BIL · 6G4BIL','216',5],['14:00','15:00','4G1 ALL · 4G2 ALL','215',6],['16:00','17:00','5G1-2-3 ALL','217',7]]},
6:{enabled:true,courses:[['11:00','12:00','5G1-2-3 ALL','217',4],['13:00','14:00','5G4 ALL','217',5],['14:00','15:00','3G3 ALL · 3G4 ALL','217',6],['15:00','16:00','4G3 ALL · 4G4 ALL','217',0],['16:00','17:00','4G1 ALL · 4G2 ALL','217',7]]}
};
for(const d of DAYS)DEFAULTS[d].courses=DEFAULTS[d].courses.map(c=>({start:c[0],end:c[1],label:c[2],room:c[3],slot:c[4]}));
const clone=o=>JSON.parse(JSON.stringify(o));
let weeks={A:clone(DEFAULTS),B:clone(DEFAULTS)},state=weeks.A,slots=clone(DEFAULT_SLOTS),breaks={gapLabel:'Trou',lunchLabel:'Pause de midi',showGapBadge:true,showLunchBadge:true},mode='edit',selected=5,editing=null,newPrefill=null,currentWeek='A',activeWeek='A';
const $=id=>document.getElementById(id),min=t=>{const [h,m]=(t||'00:00').split(':').map(Number);return h*60+m},clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normalizeWeek(obj){
  for(const d of DAYS){
    if(!obj[d])obj[d]={enabled:true,courses:[]};obj[d].enabled=true;if(!Array.isArray(obj[d].courses))obj[d].courses=[];
    for(const c of obj[d].courses){c.slot=Number(c.slot||0);if(!c.slot){const match=slots.find(s=>s.start===c.start&&s.end===c.end);if(match)c.slot=match.n}}
    obj[d].courses.sort((a,b)=>min(a.start)-min(b.start));
  }
}
function normalize(){
  if(!Array.isArray(slots)||slots.length!==9)slots=clone(DEFAULT_SLOTS);slots=slots.map((s,i)=>({n:i+1,start:s.start||DEFAULT_SLOTS[i].start,end:s.end||DEFAULT_SLOTS[i].end}));
  breaks.gapLabel=(breaks.gapLabel||'Trou').trim()||'Trou';breaks.lunchLabel=(breaks.lunchLabel||'Pause de midi').trim()||'Pause de midi';breaks.showGapBadge=breaks.showGapBadge!==false;breaks.showLunchBadge=breaks.showLunchBadge!==false;
  normalizeWeek(weeks.A);normalizeWeek(weeks.B);state=weeks[mode==='today'?currentWeek:activeWeek];
}
function load(){
  try{
    let raw=null;if(window.AndroidSchedule&&AndroidSchedule.loadSchedule)raw=AndroidSchedule.loadSchedule();else raw=localStorage.getItem('edt');
    if(raw){const root=JSON.parse(raw);if(root._slots)slots=root._slots.map((s,i)=>({n:i+1,start:s.start,end:s.end}));if(root._breaks)breaks={...breaks,...root._breaks};currentWeek=(root._currentWeek==='B')?'B':'A';activeWeek=currentWeek;
      if(root._weeks){for(const w of ['A','B'])if(root._weeks[w])for(const d of DAYS)if(root._weeks[w][d])weeks[w][d]=root._weeks[w][d]}
      else{const legacy=clone(DEFAULTS);for(const d of DAYS)if(root[d])legacy[d]=root[d];weeks.A=clone(legacy);weeks.B=clone(legacy)}
    }
  }catch(e){weeks={A:clone(DEFAULTS),B:clone(DEFAULTS)};slots=clone(DEFAULT_SLOTS);breaks={gapLabel:'Trou',lunchLabel:'Pause de midi',showGapBadge:true,showLunchBadge:true};currentWeek='A';activeWeek='A'}
  normalize();render();
}
window.reloadSchedule=load;
function exportState(){const root={_slots:slots.map(s=>({start:s.start,end:s.end})),_breaks:{...breaks},_currentWeek:currentWeek,_weeks:{A:{},B:{}}};for(const w of ['A','B','C','D'])for(const d of DAYS)root._weeks[w][d]={enabled:true,courses:weeks[w][d].courses};const current=weeks[currentWeek];for(const d of DAYS)root[d]={enabled:true,courses:current[d].courses};return root}
function save(){normalize();const raw=JSON.stringify(exportState());try{if(window.AndroidSchedule&&AndroidSchedule.saveSchedule)AndroidSchedule.saveSchedule(raw);else localStorage.setItem('edt',raw)}catch(e){}render()}
function todayKey(){const d=new Date().getDay();return d>=1&&d<=5?d+1:2}
function currentCourse(day){const now=new Date(),m=now.getHours()*60+now.getMinutes();if(day!==now.getDay()+1)return null;return weeks[currentWeek][day].courses.find(c=>m>=min(c.start)&&m<min(c.end))||null}
function lunch(){const start=slots[3].end,end=slots[4].start;return min(end)>min(start)?{start,end}:null}
function gapSegments(list){const out=[],l=lunch(),ls=l?min(l.start):-1,le=l?min(l.end):-1;for(let i=0;i<list.length-1;i++){let a=min(list[i].end),b=min(list[i+1].start);if(b<=a)continue;if(!l||b<=ls||a>=le)out.push({start:a,end:b});else{if(a<ls)out.push({start:a,end:Math.min(b,ls)});if(b>le)out.push({start:Math.max(a,le),end:b})}}return out.filter(g=>g.end>g.start)}
function progressPercent(){const d=todayKey(),list=weeks[currentWeek][d].courses,now=new Date(),nowM=now.getHours()*60+now.getMinutes();let total=0,done=0;for(const c of list){const s=min(c.start),e=min(c.end),dur=Math.max(0,e-s);total+=dur;if(nowM>=e)done+=dur;else if(nowM>s)done+=Math.min(dur,nowM-s)}return total?Math.max(0,Math.min(100,done*100/total)):0}
function setMode(m){mode=m;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('view'+m[0].toUpperCase()+m.slice(1)).classList.add('active');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='today')activeWeek=currentWeek;render()}
window.setModeFromAndroid=setMode;
function setActiveWeek(w){activeWeek=w==='B'?'B':'A';render()}
function toggleCurrentWeek(){currentWeek=currentWeek==='A'?'B':'A';activeWeek=currentWeek;save()}
function renderContext(){if(window.setCurrentWeekLabel70)window.setCurrentWeekLabel70(currentWeek);else $('currentWeekBtn').textContent='Cette semaine : '+currentWeek;document.querySelectorAll('.weekTab').forEach(b=>b.classList.toggle('active',b.dataset.week===(mode==='today'?currentWeek:activeWeek)))}
function render(){normalize();renderContext();if(mode==='today')renderToday();else if(mode==='week')renderWeek();else renderEdit()}
function renderToday(){
  state=weeks[currentWeek];const d=todayKey(),now=new Date(),list=state[d].courses,cur=currentCourse(d);$('todayTitle').textContent=FULL[d]+' · Semaine '+currentWeek;$('todayDate').textContent=now.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});$('todayClock').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});$('todayProgress').style.width=progressPercent()+'%';$('scaleStart').textContent=list[0]?.start||slots[0].start;$('scaleEnd').textContent=list[list.length-1]?.end||slots[slots.length-1].end;
  const box=$('todayList');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">Aucun cours aujourd’hui.</div>';return}
  const events=list.map(c=>({type:'course',start:min(c.start),end:min(c.end),course:c}));for(const g of gapSegments(list))events.push({type:'gap',start:g.start,end:g.end});const l=lunch();if(l&&list.some(c=>min(c.end)<=min(l.start))&&list.some(c=>min(c.start)>=min(l.end)))events.push({type:'lunch',start:min(l.start),end:min(l.end),l});events.sort((a,b)=>a.start-b.start||a.end-b.end);
  for(const ev of events){const row=document.createElement('div');
    if(ev.type==='course'){const c=ev.course;row.className='todayCourse'+(cur===c?' current':'');row.innerHTML=`<div class="time"><strong>${esc(c.start)}</strong><br>${esc(c.end)}</div><div><div class="label">${esc(c.label)}</div><div class="room">salle ${esc(c.room||'—')}${c.slot?` · ${c.slot===1?'1ère heure':c.slot+'ème heure'}`:''}</div></div>${cur===c?'<div class="badge">En cours</div>':''}`;row.onclick=()=>{activeWeek=currentWeek;selected=d;editing=state[d].courses.indexOf(c);openEditor(editing)}}
    else if(ev.type==='gap'){row.className='todayCourse gap';row.innerHTML=`<div class="time"><strong>${clock(ev.start)}</strong><br>${clock(ev.end)}</div><div><div class="label">${esc(breaks.gapLabel)}</div><div class="room">${durationLabel(ev.end-ev.start)} sans cours</div></div>${breaks.showGapBadge?'<div class="badge gap">Trou</div>':''}`}
    else{row.className='todayCourse lunch';row.innerHTML=`<div class="time"><strong>${esc(ev.l.start)}</strong><br>${esc(ev.l.end)}</div><div><div class="label">${esc(breaks.lunchLabel)}</div><div class="room">Reprise à ${esc(ev.l.end)}</div></div>${breaks.showLunchBadge?'<div class="badge lunch">Pause</div>':''}`}
    box.appendChild(row);
  }
}
function durationLabel(minutes){const h=Math.floor(minutes/60),m=minutes%60;if(h&&m)return h+' h '+m;if(h)return h+' h';return m+' min'}
function uniqueWeekTimes(){const map=new Map();for(const s of slots)map.set(s.start+'|'+s.end,{start:s.start,end:s.end,type:'slot'});for(const d of DAYS)for(const c of state[d].courses)map.set(c.start+'|'+c.end,{start:c.start,end:c.end,type:'course'});const l=lunch();if(l)map.set(l.start+'|'+l.end,{start:l.start,end:l.end,type:'lunch'});return [...map.values()].sort((a,b)=>min(a.start)-min(b.start)||min(a.end)-min(b.end))}
function renderWeek(){
  state=weeks[activeWeek];$('weekTitleLetter').textContent=activeWeek;const box=$('weekGrid'),times=uniqueWeekTimes();box.innerHTML='';const corner=document.createElement('div');corner.className='wh timecol';corner.textContent='H';box.appendChild(corner);for(const d of DAYS){const h=document.createElement('div');h.className='wh day';h.textContent=NAMES[d];box.appendChild(h)}const l=lunch();
  for(const t of times){const th=document.createElement('div');th.className='wh timecol';th.innerHTML=`${esc(t.start)}<br>${esc(t.end)}`;box.appendChild(th);for(const d of DAYS){const c=state[d].courses.find(x=>x.start===t.start&&x.end===t.end);const cell=document.createElement('div');if(c){cell.className='wc has';cell.innerHTML=`<div><div class="cellLabel">${esc(c.label)}</div><div class="cellRoom">${esc(c.room||'—')}</div></div>`;cell.onclick=()=>{selected=d;editing=state[d].courses.indexOf(c);openEditor(editing)}}else if(l&&t.type==='lunch'){cell.className='wc lunchCell';cell.innerHTML=`<div class="cellLabel">${esc(breaks.lunchLabel)}</div>`}else{const g=gapSegments(state[d].courses).find(x=>Math.min(min(t.end),x.end)>Math.max(min(t.start),x.start));if(g){cell.className='wc gapCell';cell.innerHTML=`<div class="cellLabel">${esc(breaks.gapLabel)}</div>`}else cell.className='wc emptyCell';cell.onclick=()=>{selected=d;newPrefill={start:t.start,end:t.end};openEditor(null)}}box.appendChild(cell)}}
}
function renderEdit(){state=weeks[activeWeek];renderDayTabs();$('editDayTitle').textContent=FULL[selected]+' · Semaine '+activeWeek;$('editCount').textContent=`${state[selected].courses.length} cours`;const box=$('editList');box.innerHTML='';if(!state[selected].courses.length)box.innerHTML='<div class="empty">Aucun cours ce jour.</div>';state[selected].courses.forEach((c,i)=>{const row=document.createElement('div');row.className='editCourse';row.innerHTML=`<div class="time"><strong>${esc(c.start)}</strong><br>${esc(c.end)}</div><div><div class="label">${esc(c.label)}</div><div class="room">salle ${esc(c.room||'—')}${c.slot?` · ${c.slot===1?'1ère heure':c.slot+'ème heure'}`:' · horaire libre'}</div></div>`;row.onclick=()=>openEditor(i);box.appendChild(row)});renderBreakSettings();renderSlots()}
function renderDayTabs(){const box=$('dayTabs');box.innerHTML='';for(const d of DAYS){const b=document.createElement('button');b.className='dayTab'+(selected===d?' active':'');b.textContent=NAMES[d];b.onclick=()=>{selected=d;renderEdit()};box.appendChild(b)}}
function renderBreakSettings(){$('gapLabel').value=breaks.gapLabel;$('lunchLabel').value=breaks.lunchLabel;$('showGapBadge').checked=breaks.showGapBadge;$('showLunchBadge').checked=breaks.showLunchBadge}
function applyBreakSettings(){breaks.gapLabel=$('gapLabel').value.trim()||'Trou';breaks.lunchLabel=$('lunchLabel').value.trim()||'Pause de midi';breaks.showGapBadge=$('showGapBadge').checked;breaks.showLunchBadge=$('showLunchBadge').checked;save()}
function renderSlots(){const box=$('slotSettings');box.innerHTML='';slots.forEach((s,i)=>{const row=document.createElement('div');row.className='slotRow';row.innerHTML=`<div class="slotNum">${i===0?'1ère heure':(i+1)+'ème heure'}</div><input type="time" value="${esc(s.start)}"><input type="time" value="${esc(s.end)}">`;const inputs=row.querySelectorAll('input');const apply=()=>{slots[i].start=inputs[0].value;slots[i].end=inputs[1].value;for(const w of ['A','B','C','D'])for(const d of DAYS)for(const c of weeks[w][d].courses)if(c.slot===i+1){c.start=slots[i].start;c.end=slots[i].end}save()};inputs[0].onchange=apply;inputs[1].onchange=apply;box.appendChild(row)})}
function firstFreeSlot(day){const used=new Set(state[day].courses.map(c=>c.slot).filter(Boolean));return slots.find(s=>!used.has(s.n))?.n||1}
function slotForTimes(start,end){return slots.find(s=>s.start===start&&s.end===end)?.n||0}
function fillSlotOptions(selectedSlot,allowCustom,start,end){const sel=$('fSlot');sel.innerHTML='';if(allowCustom&&start&&end){const o=document.createElement('option');o.value='0';o.textContent=`Horaire actuel (${start}–${end})`;sel.appendChild(o)}slots.forEach(s=>{const o=document.createElement('option');o.value=String(s.n);o.textContent=`${s.n===1?'1ère heure':s.n+'ème heure'} · ${s.start}–${s.end}`;sel.appendChild(o)});sel.value=String(selectedSlot);updateSlotPreview()}
function updateSlotPreview(){const n=Number($('fSlot').value);if(n===0){const c=editing!=null?state[selected].courses[editing]:newPrefill;$('slotPreview').textContent=c?`Horaire conservé : ${c.start}–${c.end}`:'Horaire personnalisé'}else{const s=slots[n-1];$('slotPreview').textContent=`Horaire appliqué : ${s.start}–${s.end}`}}
function openEditor(index){state=weeks[activeWeek];editing=index;const c=index!=null?state[selected].courses[index]:null;$('modalTitle').textContent=c?`Modifier · Semaine ${activeWeek}`:`Ajouter · Semaine ${activeWeek}`;$('fLabel').value=c?.label||'';$('fRoom').value=c?.room||'';$('deleteCourse').hidden=!c;let chosen;if(c)chosen=c.slot||slotForTimes(c.start,c.end)||0;else if(newPrefill)chosen=slotForTimes(newPrefill.start,newPrefill.end)||0;else chosen=firstFreeSlot(selected);fillSlotOptions(chosen,!!c||!!newPrefill,c?.start||newPrefill?.start,c?.end||newPrefill?.end);$('modal').classList.add('show')}
$('fSlot').onchange=updateSlotPreview;
$('cancelEdit').onclick=()=>{if(window.closeCoursePanel648)window.closeCoursePanel648();else $('modal').classList.remove('show');editing=null;newPrefill=null};
$('deleteCourse').onclick=()=>{if(editing!=null&&confirm('Supprimer ce cours ?')){state[selected].courses.splice(editing,1);if(window.closeCoursePanel648)window.closeCoursePanel648();else $('modal').classList.remove('show');editing=null;newPrefill=null;save()}};
$('modal').onclick=e=>{if(e.target===$('modal'))$('cancelEdit').click()};
$('courseForm').onsubmit=e=>{e.preventDefault();const slot=Number($('fSlot').value),old=editing!=null?state[selected].courses[editing]:null;let start,end;if(slot>0){start=slots[slot-1].start;end=slots[slot-1].end}else if(old){start=old.start;end=old.end}else if(newPrefill){start=newPrefill.start;end=newPrefill.end}else{return}const course={start,end,label:$('fLabel').value.trim(),room:$('fRoom').value.trim(),slot};if(editing!=null)state[selected].courses[editing]=course;else state[selected].courses.push(course);if(window.closeCoursePanel648)window.closeCoursePanel648();else $('modal').classList.remove('show');editing=null;newPrefill=null;save()};

function ocrDay(text){const s=text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/\blun(?:di)?\b/.test(s))return 2;if(/\bmar(?:di)?\b/.test(s))return 3;if(/\bmer(?:credi)?\b/.test(s))return 4;if(/\bjeu(?:di)?\b/.test(s))return 5;if(/\bven(?:dredi)?\b/.test(s))return 6;return null}
function ocrTimes(text){const s=String(text).replace(/(\d{1,2})\s*[hH.]\s*([0-5]\d)/g,'$1:$2');const out=[];const re=/\b([0-2]?\d):([0-5]\d)\b/g;let m;while((m=re.exec(s))){const h=Number(m[1]);if(h<24)out.push(String(h).padStart(2,'0')+':'+m[2])}return out}
function nearest(arr,value,key){let best=null,dist=Infinity;for(const x of arr){const d=Math.abs(key(x)-value);if(d<dist){dist=d;best=x}}return best}
function parseOcrSchedule(payload){
  const lines=(payload.lines||[]).map(x=>({...x,cx:(x.l+x.r)/2,cy:(x.t+x.b)/2,text:String(x.text||'').trim()})).filter(x=>x.text);
  if(!lines.length)return {error:'Aucun texte détecté sur la photo.'};
  const headers=[];for(const line of lines){const d=ocrDay(line.text);if(d)headers.push({d,x:line.cx,y:line.cy})}
  const byDay=new Map();for(const h of headers){const old=byDay.get(h.d);if(!old||h.y<old.y)byDay.set(h.d,h)}
  let dayPos=[...byDay.values()].sort((a,b)=>a.d-b.d);
  if(dayPos.length>=2){const first=dayPos[0],last=dayPos[dayPos.length-1],step=(last.x-first.x)/Math.max(1,last.d-first.d);dayPos=DAYS.map(d=>({d,x:first.x+(d-first.d)*step,y:first.y}))}
  else{const xs=lines.filter(l=>!ocrTimes(l.text).length).map(l=>l.cx);if(xs.length<5)return {error:'Je ne reconnais pas assez clairement les colonnes des jours.'};const lo=Math.min(...xs),hi=Math.max(...xs),step=(hi-lo)/4;dayPos=DAYS.map((d,i)=>({d,x:lo+i*step,y:0}))}
  const headerY=headers.length?Math.max(...headers.map(h=>h.y)):Math.min(...lines.map(l=>l.cy));
  let anchors=[];for(const line of lines){const ts=ocrTimes(line.text);if(!ts.length)continue;let start=ts[0],end=ts[1]||'';if(!end){const existing=slots.find(s=>s.start===start);end=existing?existing.end:''}if(end&&min(end)>min(start))anchors.push({start,end,y:line.cy})}
  anchors.sort((a,b)=>a.y-b.y);const clean=[];for(const a of anchors){if(!clean.some(x=>Math.abs(x.y-a.y)<8||x.start===a.start&&x.end===a.end))clean.push(a)}anchors=clean;
  const contentLines=lines.filter(l=>l.cy>headerY+4&&!ocrDay(l.text));
  if(anchors.length<2){const ys=contentLines.map(l=>l.cy);if(!ys.length)return {error:'Aucun cours exploitable détecté.'};const lo=Math.min(...ys),hi=Math.max(...ys),step=(hi-lo)/Math.max(1,slots.length-1);anchors=slots.map((s,i)=>({start:s.start,end:s.end,y:lo+i*step}))}
  const cells=new Map();
  for(const line of contentLines){if(ocrTimes(line.text).length)continue;let txt=line.text.replace(/\s+/g,' ').trim();const low=txt.toLowerCase();if(!txt||/emploi du temps|semaine|professeur|enseignant|classe/.test(low))continue;const d=nearest(dayPos,line.cx,x=>x.x);const a=nearest(anchors,line.cy,x=>x.y);if(!d||!a)continue;const key=d.d+'|'+a.start+'|'+a.end;if(!cells.has(key))cells.set(key,{day:d.d,start:a.start,end:a.end,parts:[],room:''});const cell=cells.get(key);
    const rm=txt.match(/(?:salle\s*)?([A-Za-z]?\d{2,4})\b/i);if(rm&&(/salle/i.test(txt)||txt.trim()===rm[1])){cell.room=rm[1];txt=txt.replace(rm[0],'').trim()}
    if(txt&&!/^[-–—|]+$/.test(txt))cell.parts.push(txt);
  }
  const parsed={2:[],3:[],4:[],5:[],6:[]};
  for(const cell of cells.values()){let label=[...new Set(cell.parts)].join(' · ').replace(/\s*·\s*·+/g,' · ').trim();if(!label)continue;if(label.length>80)label=label.slice(0,80);const slot=slotForTimes(cell.start,cell.end);parsed[cell.day].push({start:cell.start,end:cell.end,label,room:cell.room,slot})}
  let count=0;for(const d of DAYS){parsed[d].sort((a,b)=>min(a.start)-min(b.start));count+=parsed[d].length}if(!count)return {error:'Le texte a été lu, mais aucun cours n’a pu être converti automatiquement.'};return {parsed,count};
}
window.onPhotoImportStarted=()=>{$('importPhoto').disabled=true;$('importPhoto').textContent='Analyse de la photo…';$('importStatus').textContent='Lecture du texte et repérage des cases.'};
window.applyOcrError=msg=>{$('importPhoto').disabled=false;$('importPhoto').textContent='Importer une photo d’emploi du temps';$('importStatus').textContent='';alert(msg||'Impossible d’analyser cette photo.')};
window.applyOcrSchedule=raw=>{try{$('importPhoto').disabled=false;$('importPhoto').textContent='Importer une photo d’emploi du temps';const payload=typeof raw==='string'?JSON.parse(raw):raw;const result=parseOcrSchedule(payload);if(result.error){$('importStatus').textContent='';alert(result.error);return}const summary=DAYS.map(d=>FULL[d]+' : '+result.parsed[d].length).join('\n');if(confirm(result.count+' cours détectés pour la semaine '+activeWeek+'.\n\n'+summary+'\n\nRemplacer les jours détectés ? Tu pourras ensuite corriger chaque cours en appuyant dessus.')){for(const d of DAYS)if(result.parsed[d].length)weeks[activeWeek][d].courses=result.parsed[d];selected=DAYS.find(d=>result.parsed[d].length)||selected;$('importStatus').textContent=result.count+' cours importés. Vérifie les cases puis corrige si besoin.';save()}else $('importStatus').textContent='Import annulé.'}catch(e){window.applyOcrError('La photo a été lue mais la conversion a échoué.')}};
$('importPhoto').onclick=()=>{if(window.AndroidSchedule&&AndroidSchedule.pickTimetablePhoto){window.onPhotoImportStarted();AndroidSchedule.pickTimetablePhoto()}else alert('L’import photo est disponible dans l’application Android.')};
$('gapLabel').onchange=applyBreakSettings;$('lunchLabel').onchange=applyBreakSettings;$('showGapBadge').onchange=applyBreakSettings;$('showLunchBadge').onchange=applyBreakSettings;
$('addCourse').onclick=()=>{newPrefill=null;openEditor(null)};$('currentWeekBtn').onclick=toggleCurrentWeek;document.querySelectorAll('.weekTab').forEach(b=>b.onclick=()=>setActiveWeek(b.dataset.week));document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{const target=b.dataset.mode;if(mode===target)return;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const id='view'+target[0].toUpperCase()+target.slice(1),view=document.getElementById(id);if(view)view.classList.add('active');requestAnimationFrame(()=>setMode(target))});setInterval(()=>{if(mode==='today')renderToday()},30000);load();
</script>
