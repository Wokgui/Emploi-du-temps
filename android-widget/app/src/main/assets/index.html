<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087cc5"><title>Emploi du temps</title>
<style>
:root{--blue:#126fe5;--teal:#0aa6a6;--ink:#101936;--muted:#647087;--line:#dbe2ea;--panel:#fff;--soft:#eef7ff;--danger:#ff376f;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.header{background:linear-gradient(135deg,#087cc5,#0866b7);color:#fff;padding:22px 18px 18px}.header h1{margin:0;font-size:1.55rem;font-weight:650}.wrap{max-width:780px;margin:auto;padding:14px 14px 92px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.tab{min-width:58px;border:1px solid var(--line);background:#fff;color:#4d5565;border-radius:24px;padding:10px 14px;font-size:1rem}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.tab.off{opacity:.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 7px #18223812}.summary{padding:18px 18px 16px;border-left:5px solid var(--teal);margin-bottom:18px}.sumtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{color:var(--teal);font-weight:800}.sumtitle{font-size:1.55rem;font-weight:850;margin-top:7px;line-height:1.15}.meta{color:var(--muted);margin-top:7px}.remain{color:var(--teal);font-weight:750;margin-top:14px}.actions{display:flex;gap:8px}.iconbtn{width:46px;height:46px;border:1px solid var(--line);background:white;border-radius:7px;color:var(--teal);font-size:1.4rem}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:9px;max-width:560px}.progress span{display:block;height:100%;background:var(--teal);width:0}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 4px 8px}.sectionHead h2{font-size:1.08rem;margin:0}.count{color:var(--blue);font-weight:700}.disabledNote{display:none;background:#fff7e8;border:1px solid #f2d49b;padding:11px 12px;border-radius:7px;margin-bottom:9px;color:#70531e}.disabledNote.show{display:block}.list{overflow:hidden}.course{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 12px;border-top:1px solid #e8edf3;position:relative}.course:first-child{border-top:0}.course.current:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4px;background:var(--teal);border-radius:4px}.time{color:#536178;font-variant-numeric:tabular-nums}.label{font-weight:800;line-height:1.2}.room{color:var(--muted);font-size:.9rem;margin-top:3px}.editBtns{display:flex;gap:6px}.smallBtn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:1.05rem}.smallBtn.edit{color:var(--teal)}.smallBtn.del{color:var(--danger)}.add{width:100%;margin-top:12px;border:1.5px dashed var(--blue);background:#fff;color:var(--blue);border-radius:7px;padding:13px;font-size:1rem;font-weight:750}.manage{margin-top:22px}.manage h3{margin:0 0 10px;font-size:1.05rem}.dayManage{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.dayToggle{min-height:52px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--ink);font-weight:700}.dayToggle .sign{color:var(--danger);margin-left:4px}.dayToggle.off .sign{color:var(--blue)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.nav{border:0;background:transparent;color:#777;padding:8px 4px;font-size:.84rem}.nav span{display:block;font-size:1.25rem;margin-bottom:1px}.nav.active{color:var(--blue);font-weight:800}.modal{position:fixed;inset:0;background:#0d18384d;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:780px;margin:auto;padding:18px;border-radius:12px 12px 0 0}.sheet h3{margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}.field input{width:100%;font:inherit;border:1px solid var(--line);border-radius:7px;padding:12px;background:#fff}.sheetActions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.btn{border:1px solid var(--line);border-radius:7px;padding:11px 15px;background:#fff;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:520px){.course{grid-template-columns:74px minmax(0,1fr);gap:8px}.editBtns{grid-column:2;justify-content:flex-end}.sumtitle{font-size:1.35rem}.dayManage{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="header"><h1>Emploi du temps</h1></header>
<main class="wrap">
  <div id="tabs" class="tabs"></div>
  <section class="card summary">
    <div class="sumtop"><div><div id="summaryKind" class="eyebrow">Cours en cours</div><div id="summaryTitle" class="sumtitle">—</div><div id="summaryMeta" class="meta"></div><div id="summaryRemain" class="remain"></div></div><div class="actions"><button id="refresh" class="iconbtn" aria-label="Actualiser">↻</button><button id="editNow" class="iconbtn" aria-label="Modifier">✎</button></div></div>
    <div class="progress"><span id="progressFill"></span></div>
  </section>
  <div class="sectionHead"><h2 id="sectionTitle">Aujourd’hui</h2><div id="courseCount" class="count"></div></div>
  <div id="disabledNote" class="disabledNote">Ce jour est désactivé. Réactive-le dans « Gérer les jours » pour l’afficher dans le widget.</div>
  <section id="courseList" class="card list"></section>
  <button id="addCourse" class="add">＋ Ajouter un cours</button>
  <section id="manage" class="manage"><h3>Gérer les jours</h3><div id="dayManage" class="dayManage"></div></section>
</main>
<nav class="bottom"><button class="nav" data-mode="today"><span>▣</span>Aujourd’hui</button><button class="nav" data-mode="week"><span>▦</span>Semaine</button><button class="nav active" data-mode="edit"><span>✎</span>Modifier</button></nav>
<div id="modal" class="modal" role="dialog" aria-modal="true"><form id="courseForm" class="sheet"><h3 id="modalTitle">Ajouter un cours</h3><div class="grid2"><div class="field"><label>Début</label><input id="fStart" type="time" required></div><div class="field"><label>Fin</label><input id="fEnd" type="time" required></div></div><div class="field"><label>Classe / groupe</label><input id="fLabel" type="text" maxlength="80" required></div><div class="field"><label>Salle</label><input id="fRoom" type="text" maxlength="20"></div><div class="sheetActions"><button id="cancelEdit" type="button" class="btn">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form></div>
<script>
const names={2:'Lun',3:'Mar',4:'Mer',5:'Jeu',6:'Ven'},full={2:'Lundi',3:'Mardi',4:'Mercredi',5:'Jeudi',6:'Vendredi'};
const defaults={2:{enabled:true,courses:[{start:'08:00',end:'09:00',label:'4G1 ALL · 4G2 ALL',room:'217'},{start:'10:00',end:'11:00',label:'6G3BIL · 6G4BIL',room:'217'},{start:'11:00',end:'12:00',label:'4G3 ALL · 4G4 ALL',room:'217'},{start:'13:00',end:'14:00',label:'5G1-2-3 ALL',room:'216'}]},3:{enabled:true,courses:[{start:'08:00',end:'09:00',label:'5G4 ALL',room:'217'},{start:'09:00',end:'10:00',label:'4G3 ALL · 4G4 ALL',room:'217'},{start:'14:00',end:'15:00',label:'3G3 ALL · 3G4 ALL',room:'216'},{start:'16:00',end:'17:00',label:'3G1 ALL · 3G2 ALL',room:'216'}]},4:{enabled:true,courses:[]},5:{enabled:true,courses:[{start:'08:00',end:'09:00',label:'3G1 ALL · 3G2 ALL',room:'216'},{start:'09:00',end:'10:00',label:'3G3 ALL · 3G4 ALL',room:'216'},{start:'10:00',end:'11:00',label:'6G3BIL · 6G4BIL',room:'216'},{start:'11:00',end:'12:00',label:'5G4 ALL',room:'216'},{start:'13:00',end:'14:00',label:'6G3BIL · 6G4BIL',room:'216'},{start:'14:00',end:'15:00',label:'4G1 ALL · 4G2 ALL',room:'215'},{start:'16:00',end:'17:00',label:'5G1-2-3 ALL',room:'217'}]},6:{enabled:true,courses:[{start:'11:00',end:'12:00',label:'5G1-2-3 ALL',room:'217'},{start:'13:00',end:'14:00',label:'5G4 ALL',room:'217'},{start:'14:00',end:'15:00',label:'3G3 ALL · 3G4 ALL',room:'217'},{start:'15:00',end:'16:00',label:'4G3 ALL · 4G4 ALL',room:'217'},{start:'16:00',end:'17:00',label:'4G1 ALL · 4G2 ALL',room:'217'}]}};
let state=JSON.parse(JSON.stringify(defaults)),mode='edit',selected=5,editing=null;
const $=id=>document.getElementById(id),min=t=>{const p=(t||'00:00').split(':').map(Number);return p[0]*60+p[1]},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{if(window.AndroidSchedule&&AndroidSchedule.loadSchedule){const raw=AndroidSchedule.loadSchedule();if(raw)state=JSON.parse(raw)}else{const raw=localStorage.getItem('edt');if(raw)state=JSON.parse(raw)}}catch(e){state=JSON.parse(JSON.stringify(defaults))}normalize();render()}
window.reloadSchedule=load;
function normalize(){for(let d=2;d<=6;d++){if(!state[d])state[d]={enabled:true,courses:[]};if(!Array.isArray(state[d].courses))state[d].courses=[];state[d].courses.sort((a,b)=>min(a.start)-min(b.start))}}
function save(){normalize();const raw=JSON.stringify(state);try{if(window.AndroidSchedule&&AndroidSchedule.saveSchedule)AndroidSchedule.saveSchedule(raw);else localStorage.setItem('edt',raw)}catch(e){}render()}
function todayKey(){const d=new Date().getDay();return d>=1&&d<=5?d+1:2}
function render(){renderTabs();renderSummary();renderList();renderManage();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('manage').style.display=mode==='edit'?'block':'none';$('addCourse').style.display=mode==='edit'?'block':'none';}
function renderTabs(){const box=$('tabs');box.innerHTML='';for(let d=2;d<=6;d++){const b=document.createElement('button');b.className='tab'+(d===selected?' active':'')+(!state[d].enabled?' off':'');b.textContent=names[d];b.onclick=()=>{selected=d;render()};box.appendChild(b)}}
function findCurrentAndNext(){const now=new Date(),today=now.getDay()+1,nowMin=now.getHours()*60+now.getMinutes();let current=null,next=null,nextDate=null;if(today>=2&&today<=6&&state[today]?.enabled){for(const c of state[today].courses){if(nowMin>=min(c.start)&&nowMin<min(c.end)){current={...c,day:today};break}}}for(let add=0;add<8&&!next;add++){const dt=new Date(now);dt.setDate(now.getDate()+add);const d=dt.getDay()+1;if(d<2||d>6||!state[d]?.enabled)continue;for(const c of state[d].courses){if(add===0&&min(c.start)<=nowMin)continue;next={...c,day:d};nextDate=dt;break}}return{current,next,nextDate,nowMin}}
function renderSummary(){const x=findCurrentAndNext(),fill=$('progressFill');if(x.current){const c=x.current,p=Math.max(0,Math.min(100,(x.nowMin-min(c.start))*100/(min(c.end)-min(c.start))));$('summaryKind').textContent='Cours en cours';$('summaryTitle').textContent=c.label;$('summaryMeta').textContent=`En cours · jusqu’à ${c.end} · salle ${c.room||'—'}`;$('summaryRemain').textContent=`Encore ${Math.max(1,min(c.end)-x.nowMin)} min`;fill.style.width=p+'%';$('editNow').onclick=()=>{selected=c.day;mode='edit';const i=state[c.day].courses.findIndex(v=>v.start===c.start&&v.end===c.end&&v.label===c.label);openEditor(i)}}else if(x.next){const c=x.next;$('summaryKind').textContent='Prochain cours';$('summaryTitle').textContent=c.label;$('summaryMeta').textContent=`${full[c.day]} ${c.start} · salle ${c.room||'—'}`;$('summaryRemain').textContent='';fill.style.width='0%';$('editNow').onclick=()=>{selected=c.day;mode='edit';const i=state[c.day].courses.findIndex(v=>v.start===c.start&&v.end===c.end&&v.label===c.label);openEditor(i)}}else{$('summaryKind').textContent='Emploi du temps';$('summaryTitle').textContent='Aucun cours programmé';$('summaryMeta').textContent='Ajoute un cours depuis l’onglet Modifier';$('summaryRemain').textContent='';fill.style.width='0%';$('editNow').onclick=()=>{mode='edit';render()}}}
function renderList(){if(mode==='today')selected=todayKey();const day=state[selected],list=day.courses,now=new Date(),isToday=(selected===now.getDay()+1),nowMin=now.getHours()*60+now.getMinutes();$('sectionTitle').textContent=mode==='today'?'Aujourd’hui':full[selected];$('courseCount').textContent=list.length?`${list.length} cours`:'';$('disabledNote').classList.toggle('show',!day.enabled);const box=$('courseList');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">Aucun cours sur ce jour.</div>';return}list.forEach((c,i)=>{const row=document.createElement('div');row.className='course'+(isToday&&nowMin>=min(c.start)&&nowMin<min(c.end)?' current':'');const edit=mode==='edit'?`<div class="editBtns"><button class="smallBtn edit" data-edit="${i}" aria-label="Modifier">✎</button><button class="smallBtn del" data-del="${i}" aria-label="Supprimer">▢</button></div>`:'';row.innerHTML=`<div class="time">${esc(c.start)}–${esc(c.end)}</div><div><div class="label">${esc(c.label)}</div><div class="room">salle ${esc(c.room||'—')}</div></div>${edit}`;box.appendChild(row)});if(mode==='edit'){box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.edit)));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce cours ?')){state[selected].courses.splice(Number(b.dataset.del),1);save()}})}}
function renderManage(){const box=$('dayManage');box.innerHTML='';for(let d=2;d<=6;d++){const b=document.createElement('button');b.className='dayToggle'+(state[d].enabled?'':' off');b.innerHTML=`${names[d]} <span class="sign">${state[d].enabled?'⊖':'⊕'}</span>`;b.onclick=()=>{state[d].enabled=!state[d].enabled;save()};box.appendChild(b)}}
function openEditor(index){editing=index;const c=index==null?{start:'08:00',end:'09:00',label:'',room:''}:state[selected].courses[index];$('modalTitle').textContent=index==null?'Ajouter un cours':'Modifier le cours';$('fStart').value=c.start;$('fEnd').value=c.end;$('fLabel').value=c.label;$('fRoom').value=c.room;$('modal').classList.add('show');setTimeout(()=>$('fLabel').focus(),50)}
$('courseForm').onsubmit=e=>{e.preventDefault();const c={start:$('fStart').value,end:$('fEnd').value,label:$('fLabel').value.trim(),room:$('fRoom').value.trim()};if(!c.label||min(c.end)<=min(c.start)){alert('Vérifie le nom et les horaires du cours.');return}state[selected].enabled=true;if(editing==null)state[selected].courses.push(c);else state[selected].courses[editing]=c;$('modal').classList.remove('show');save()};$('cancelEdit').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('addCourse').onclick=()=>openEditor(null);$('refresh').onclick=load;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='today')selected=todayKey();render()});selected=todayKey();load();setInterval(renderSummary,30000);
</script>
</body></html>
