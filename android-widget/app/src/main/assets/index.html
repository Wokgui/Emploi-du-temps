<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emploi du temps</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.clock{font-size:1.8rem;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}.muted{color:var(--muted)}.status{font-size:1.08rem;font-weight:800;margin-top:4px}.bar{height:14px;border-radius:999px;background:#e5e7eb;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.fill.ok{background:var(--ok)}.tabs{display:flex;gap:6px;overflow:auto;margin-top:12px}.tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px}.tabs .sel{background:var(--accent);color:#fff}.course{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.course:first-child{border-top:0}.course.active{background:#dcfce7;border:2px solid var(--ok);border-radius:14px;padding:10px}.room{font-weight:800;border:1px solid var(--line);border-radius:9px;padding:5px 8px}.label{font-weight:750}.small{font-size:.75rem;color:var(--muted)}
</style>
</head>
<body><main class="app">
<div class="top"><div><h1 style="margin:0;font-size:1.35rem">Emploi du temps</h1><div id="date" class="muted"></div></div><div id="clock" class="clock">--:--</div></div>
<div class="card"><div class="muted">Maintenant</div><div id="status" class="status">Calcul…</div><div id="sub" class="muted"></div></div>
<div class="card"><div class="small">Progression de la journée</div><div class="bar"><div id="dayFill" class="fill"></div></div><div style="height:10px"></div><div class="small">Cours effectués</div><div class="bar"><div id="courseFill" class="fill ok"></div></div></div>
<div id="tabs" class="tabs"></div><div id="list" class="card"></div>
</main><script>
const S={1:[['08:00','09:00','4G1 ALL · 4G2 ALL','217'],['10:00','11:00','6G3BIL · 6G4BIL','217'],['11:00','12:00','4G3 ALL · 4G4 ALL','217'],['13:00','14:00','5G1-2-3 ALL','216']],2:[['08:00','09:00','5G4 ALL','217'],['09:00','10:00','4G3 ALL · 4G4 ALL','217'],['14:00','15:00','3G3 ALL · 3G4 ALL','216'],['16:00','17:00','3G1 ALL · 3G2 ALL','216']],3:[],4:[['08:00','09:00','3G1 ALL · 3G2 ALL','216'],['09:00','10:00','3G3 ALL · 3G4 ALL','216'],['10:00','11:00','6G3BIL · 6G4BIL','216'],['11:00','12:00','5G4 ALL','216'],['13:00','14:00','6G3BIL · 6G4BIL','216'],['14:00','15:00','4G1 ALL · 4G2 ALL','215'],['16:00','17:00','5G1-2-3 ALL','217']],5:[['11:00','12:00','5G1-2-3 ALL','217'],['13:00','14:00','5G4 ALL','217'],['14:00','15:00','3G3 ALL · 3G4 ALL','217'],['15:00','16:00','4G3 ALL · 4G4 ALL','217'],['16:00','17:00','4G1 ALL · 4G2 ALL','217']]};
const N=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];let selected=null;const m=x=>{let[a,b]=x.split(':').map(Number);return a*60+b};
function renderDay(d,now){let list=S[d]||[],box=document.getElementById('list'),min=now.getHours()*60+now.getMinutes();box.innerHTML='';if(!list.length){box.innerHTML='<div class="muted">Aucun cours prévu.</div>';return}for(const c of list){let row=document.createElement('div');row.className='course'+(d===now.getDay()&&min>=m(c[0])&&min<m(c[1])?' active':'');row.innerHTML=`<div><b>${c[0]}</b><br><span class="small">${c[1]}</span></div><div><div class="label">${c[2]}</div><div class="small">ALLEMAND</div></div><div class="room">${c[3]}</div>`;box.appendChild(row)}}
function tabs(now){let box=document.getElementById('tabs');box.innerHTML='';for(let d=1;d<=5;d++){let b=document.createElement('button');b.textContent=N[d];if(d===selected)b.className='sel';b.onclick=()=>{selected=d;tabs(now);renderDay(d,now)};box.appendChild(b)}}
function tick(){let now=new Date(),d=now.getDay(),min=now.getHours()*60+now.getMinutes(),list=S[d]||[];document.getElementById('clock').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});let dayPct=Math.max(0,Math.min(100,(min-480)/600*100));document.getElementById('dayFill').style.width=dayPct+'%';let units=0,current=null,next=null;for(const c of list){let a=m(c[0]),b=m(c[1]);if(min>=b)units++;else if(min>=a&&min<b){current=c;units+=(min-a)/(b-a)}else if(!next)next=c}document.getElementById('courseFill').style.width=(list.length?units/list.length*100:0)+'%';if(current){document.getElementById('status').textContent=current[2]+' · salle '+current[3];document.getElementById('sub').textContent='Cours en cours · fin à '+current[1]}else if(next){document.getElementById('status').textContent='Prochain : '+next[2]+' · salle '+next[3];document.getElementById('sub').textContent='À '+next[0]}else{document.getElementById('status').textContent=list.length?'Cours terminés pour aujourd’hui':'Pas de cours aujourd’hui';document.getElementById('sub').textContent=''}if(selected===null)selected=(d>=1&&d<=5?d:1);tabs(now);renderDay(selected,now)}tick();setInterval(tick,30000);
</script></body></html>
