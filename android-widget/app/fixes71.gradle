tasks.register('patchStability71') {
    dependsOn tasks.named('patchStability70')
    doLast {
        // Stability71 must run after Stability70 so its layout decisions are the final ones seen by the WebView.
        def mainFile = file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main = mainFile.getText('UTF-8')

        if (!main.contains('import android.webkit.WebChromeClient;')) {
            main = main.replace('import android.webkit.WebView;\n', 'import android.webkit.WebView;\nimport android.webkit.WebChromeClient;\n')
        }
        if (!main.contains('webView.setWebChromeClient(new WebChromeClient());')) {
            def chromeNeedle = '''        settings.setDomStorageEnabled(true);
'''
            if (!main.contains(chromeNeedle)) throw new GradleException('6.11: WebView settings insertion target not found')
            main = main.replace(chromeNeedle, chromeNeedle + '        webView.setWebChromeClient(new WebChromeClient());\n')
        }

        if (!main.contains('Stability71Ui.script()')) {
            def stabilityCall = 'webView.evaluateJavascript(Stability70Ui.script(), null);'
            if (!main.contains(stabilityCall)) throw new GradleException('6.11: Stability70 final call not found')
            main = main.replace(stabilityCall,
                    'webView.evaluateJavascript(Stability70Ui.script(), value11 -> webView.evaluateJavascript(Stability71Ui.script(), null));')
        }
        mainFile.write(main, 'UTF-8')

        // Align every older visible version label with the APK after the previous patch tasks have run.
        for (def path : [
                'src/main/java/com/wokgui/schedulewidget/Stability70Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability69Ui.java',
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java',
                'src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f = file(path)
            if (!f.exists()) continue
            def txt = f.getText('UTF-8')
            ['6.10','6.9','6.8','6.7','6.6','6.5'].each { old ->
                txt = txt.replace("const APP_VERSION='${old}';", "const APP_VERSION='6.11';")
            }
            f.write(txt, 'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStability71')
}
