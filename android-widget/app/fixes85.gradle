tasks.register('patchStability85') {
    dependsOn tasks.named('patchStability84')
    doLast {
        def mainFile=file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main=mainFile.getText('UTF-8')

        // Workflow85 is the single final interaction layer: undo, duplicate, advanced-settings
        // grouping and immediate press feedback. It runs after localisation/stability is settled.
        if(!main.contains('Workflow85Ui.script()')) {
            def old='''                                                        webView.evaluateJavascript(Stability81Ui.script(), value23 -> {
                                                            if (!forceWeekOpening) revealWebViewStable();
                                                        });
'''
            def repl='''                                                        webView.evaluateJavascript(Stability81Ui.script(), value23 ->
                                                                webView.evaluateJavascript(Workflow85Ui.script(), value24 -> {
                                                                    if (!forceWeekOpening) revealWebViewStable();
                                                                }));
'''
            if(!main.contains(old)) throw new GradleException('6.25: final Stability81 injection point not found')
            main=main.replace(old,repl)
        }

        // 6.22 stopped using the native language-reload bridge. Remove that dead bridge instead
        // of carrying an unused reload path in every APK.
        def deadBridge='''        @JavascriptInterface public void setLanguageAndReload81(String code) {
            runOnUiThread(() -> {
                try {
                    JSONObject ui = new JSONObject(UiSettingsStore.exportJson(MainActivity.this));
                    ui.put("language", code == null || code.trim().isEmpty() ? "fr" : code.trim());
                    UiSettingsStore.importJson(MainActivity.this, ui.toString());
                } catch (Exception ignored) {}
                reloadForLanguageUi();
            });
        }
'''
        if(main.contains(deadBridge))main=main.replace(deadBridge,'')
        mainFile.write(main,'UTF-8')

        // PersonalizationUi2 used to wrap every render. Since 6.22 that wrapper had become a
        // pass-through, so remove the useless function indirection completely.
        def settingsFile=file('src/main/java/com/wokgui/schedulewidget/PersonalizationUi2.java')
        def settings=settingsFile.getText('UTF-8')
        def pass='''function wrap(name){const original=window[name];if(typeof original!=='function'||original.__settingsWrapped)return;const wrapped=function(){return original.apply(this,arguments)};wrapped.__settingsWrapped=true;window[name]=wrapped}'''
        if(settings.contains(pass))settings=settings.replace(pass,'''function wrap(name){}''')
        settingsFile.write(settings,'UTF-8')

        // LayoutLanguage77 still had a second language-change listener after Stability81 took
        // ownership of language changes. Remove that duplicate full localisation pass.
        def layoutFile=file('src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java')
        def layout=layoutFile.getText('UTF-8')
        def duplicateListener='''                  select.addEventListener('change',()=>{
                    /* PersonalizationUi persists first; then force the complete translation pass. */
                    try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(e){};refresh();
                  });
'''
        if(layout.contains(duplicateListener))layout=layout.replace(duplicateListener,'')
        layoutFile.write(layout,'UTF-8')

        // Advanced-settings work is deliberately deferred a fraction after the pressed state is
        // painted. This keeps buttons responsive while preserving the same state updates.
        def advFile=file('src/main/java/com/wokgui/schedulewidget/AdvancedFeaturesUi.java')
        def adv=advFile.getText('UTF-8').replace('setTimeout(refreshAdvancedFeatures,0)','setTimeout(refreshAdvancedFeatures,18)')
        advFile.write(adv,'UTF-8')

        // Keep visible version labels coherent with the APK.
        for(def path:[
                'src/main/java/com/wokgui/schedulewidget/Workflow85Ui.java','src/main/java/com/wokgui/schedulewidget/Stability81Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability80Ui.java','src/main/java/com/wokgui/schedulewidget/Stability79Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability78Ui.java','src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Localization75Ui.java','src/main/java/com/wokgui/schedulewidget/Stability74Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability73Ui.java','src/main/java/com/wokgui/schedulewidget/Stability72Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability71Ui.java','src/main/java/com/wokgui/schedulewidget/Stability70Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability69Ui.java','src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java',
                'src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java','src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path);if(!f.exists())continue
            def txt=f.getText('UTF-8').replaceAll(/const APP_VERSION='6\.[0-9]+';/,"const APP_VERSION='6.25';")
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStability85')
}
