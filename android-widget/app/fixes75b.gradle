tasks.register('patchLocalization75Escapes') {
    dependsOn tasks.named('patchLocalization75')
    doLast {
        def f=file('src/main/java/com/wokgui/schedulewidget/Localization75Ui.java')
        def txt=f.getText('UTF-8')
        // Java text blocks interpret \\s themselves and reject a bare \\d. Use JS regexes
        // that need no backslash escapes so the generated Java source is stable.
        txt=txt.replace('^Cette semaine\\s*:\\s*([A-D])$', '^Cette semaine *: *([A-D])$')
        txt=txt.replace('^(?:Semaine|Week|Woche)\\s+([A-D])$', '^(?:Semaine|Week|Woche) +([A-D])$')
        txt=txt.replace('^Aperçu semaine\\s*([A-D])?$', '^Aperçu semaine *([A-D])?$')
        txt=txt.replace(')\\s*·\\s*(?:Semaine|Week|Woche)\\s+([A-D])$', ') *· *(?:Semaine|Week|Woche) +([A-D])$')
        txt=txt.replace('^(\\d+)\\s+cours$', '^([0-9]+) +cours$')
        txt=txt.replace('^(\\d+)(?:ère|e) heure$', '^([0-9]+)(?:ère|e) heure$')
        f.write(txt,'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchLocalization75Escapes')
}
