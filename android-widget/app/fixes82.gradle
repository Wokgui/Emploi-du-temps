tasks.register('patchStability82') {
    dependsOn tasks.named('patchStability81')
    doLast {
        // 6.21 translated the whole page again after every render.  That made every tap wait
        // behind a complete localisation pass.  Keep the full pass only for a real language
        // change and make ordinary renders translate just the newly rendered root.
        def locFile=file('src/main/java/com/wokgui/schedulewidget/Localization75Ui.java')
        def loc=locFile.getText('UTF-8')
        def oldWrap='''const w=function(){const r=old.apply(this,arguments);schedule(rootFor(name));return r};w.__loc75=true;window[name]=w;try{eval(name+'=w')}catch(e){}'''
        def newWrap='''const w=function(){const r=old.apply(this,arguments);const rr=rootFor(name);if(rr)pendingRoots.add(rr);translateOnly();return r};w.__loc75=true;window[name]=w;try{eval(name+'=w')}catch(e){}'''
        if(!loc.contains(oldWrap)) throw new GradleException('6.22: localisation render wrapper not found')
        loc=loc.replace(oldWrap,newWrap)
        locFile.write(loc,'UTF-8')

        // Personalization duplicated a complete localise/theme/font refresh after every render.
        // Theme and font are global already, and Localization75 owns dynamic translation, so this
        // per-render refresh is unnecessary and was another source of sluggish navigation.
        def settingsFile=file('src/main/java/com/wokgui/schedulewidget/PersonalizationUi2.java')
        def settings=settingsFile.getText('UTF-8')
        def oldSettings='''const wrapped=function(){const result=original.apply(this,arguments);refresh();return result};wrapped.__settingsWrapped=true;window[name]=wrapped'''
        def newSettings='''const wrapped=function(){return original.apply(this,arguments)};wrapped.__settingsWrapped=true;window[name]=wrapped'''
        if(!settings.contains(oldSettings)) throw new GradleException('6.22: personalization render wrapper not found')
        settings=settings.replace(oldSettings,newSettings)
        settingsFile.write(settings,'UTF-8')

        def uiFile=file('src/main/java/com/wokgui/schedulewidget/Stability81Ui.java')
        def ui=uiFile.getText('UTF-8')

        // Ordinary tabs/classes/settings must never trigger a full localisation refresh.
        def oldApply='''                    try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(e){}
                    fixPeriodLabels81();translateExtras81(document.body);'''
        def newApply='''                    fixPeriodLabels81();translateExtras81(document.body);'''
        if(!ui.contains(oldApply)) throw new GradleException('6.22: Stability81 full refresh call not found')
        ui=ui.replace(oldApply,newApply)

        // Change language in place.  Save immediately so the selector visibly reacts, translate
        // the few final dynamic strings immediately, then do one complete localisation on the next
        // frame.  No WebView/page reload is needed.
        def oldLanguage='''                      try{if(AndroidSchedule.setLanguageAndReload81){AndroidSchedule.setLanguageAndReload81(code);return}}catch(ex){}
                      try{const ui=loadUi81();ui.language=code;AndroidSchedule.saveUiSettings(JSON.stringify(ui));location.reload()}catch(ex){}'''
        def newLanguage='''                      try{
                        const next=loadUi81();next.language=code;AndroidSchedule.saveUiSettings(JSON.stringify(next));
                        applyTranslation81();
                        requestAnimationFrame(()=>{try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(ex){};applyTranslation81()});
                      }catch(ex){}'''
        if(!ui.contains(oldLanguage)) throw new GradleException('6.22: language reload handler not found')
        ui=ui.replace(oldLanguage,newLanguage)

        def oldDownloaded='''                    if(pack&&pack.code){try{AndroidSchedule.setLanguageAndReload81(String(pack.code));return}catch(e){}}'''
        def newDownloaded='''                    if(pack&&pack.code){
                      try{
                        const next=loadUi81();next.language=String(pack.code);AndroidSchedule.saveUiSettings(JSON.stringify(next));
                        applyTranslation81();
                        requestAnimationFrame(()=>{try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(e){};applyTranslation81();ensureLanguageSelect81()});
                        return;
                      }catch(e){}
                    }'''
        if(!ui.contains(oldDownloaded)) throw new GradleException('6.22: downloaded-language reload handler not found')
        ui=ui.replace(oldDownloaded,newDownloaded)

        // Translate the dynamic strings that are created by the timetable renderer itself before
        // the browser can paint a French frame: "Jeudi · Semaine A", "1 h sans cours", etc.
        def marker='''                  const m=map81();if(m[trim])return raw.replace(trim,m[trim]);
                  for(let n=1;n<=9;n++){'''
        def replacement='''                  const m=map81();if(m[trim])return raw.replace(trim,m[trim]);
                  const lang=language81();
                  let dyn=trim.match(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi|Samedi|Dimanche|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag) *· *(?:Semaine|Week|Woche) +([A-D])$/i);
                  if(dyn){
                    const canon={Lundi:'Lundi',Mardi:'Mardi',Mercredi:'Mercredi',Jeudi:'Jeudi',Vendredi:'Vendredi',Samedi:'Samedi',Dimanche:'Dimanche',Monday:'Lundi',Tuesday:'Mardi',Wednesday:'Mercredi',Thursday:'Jeudi',Friday:'Vendredi',Saturday:'Samedi',Sunday:'Dimanche',Montag:'Lundi',Dienstag:'Mardi',Mittwoch:'Mercredi',Donnerstag:'Jeudi',Freitag:'Vendredi',Samstag:'Samedi',Sonntag:'Dimanche'};
                    const fr=canon[dyn[1]]||dyn[1];
                    const daysEn={Lundi:'Monday',Mardi:'Tuesday',Mercredi:'Wednesday',Jeudi:'Thursday',Vendredi:'Friday',Samedi:'Saturday',Dimanche:'Sunday'};
                    const daysDe={Lundi:'Montag',Mardi:'Dienstag',Mercredi:'Mittwoch',Jeudi:'Donnerstag',Vendredi:'Freitag',Samedi:'Samstag',Dimanche:'Sonntag'};
                    const day=lang==='en'?daysEn[fr]:(lang==='de'?daysDe[fr]:(lang==='fr'?fr:(m[fr]||fr)));
                    const week=lang==='en'?'Week':(lang==='de'?'Woche':(lang==='fr'?'Semaine':(m['Semaine']||'Semaine')));
                    return raw.replace(trim,day+' · '+week+' '+dyn[2].toUpperCase());
                  }
                  dyn=trim.match(/^([0-9]+ *h(?: *[0-9]+)?|[0-9]+ *min) *sans cours$/i);
                  if(dyn){
                    const tail=lang==='en'?'with no class':(lang==='de'?'ohne Unterricht':(lang==='fr'?'sans cours':(m['sans cours']||'sans cours')));
                    return raw.replace(trim,dyn[1]+' '+tail);
                  }
                  dyn=trim.match(/^Reprise à +(.*)$/i);
                  if(dyn){
                    const lead=lang==='en'?'Back at':(lang==='de'?'Weiter um':(lang==='fr'?'Reprise à':(m['Reprise à']||'Reprise à')));
                    return raw.replace(trim,lead+' '+dyn[1]);
                  }
                  for(let n=1;n<=9;n++){'''
        if(!ui.contains(marker)) throw new GradleException('6.22: dynamic translation insertion point not found')
        ui=ui.replace(marker,replacement)
        ui=ui.replace("const APP_VERSION='6.21';","const APP_VERSION='6.22';")
        uiFile.write(ui,'UTF-8')

        // Future downloaded languages also know these renderer-generated phrases.
        def templateFile=file('src/main/assets/language_template_fr.json')
        if(templateFile.exists()) {
            def template=new groovy.json.JsonSlurper().parseText(templateFile.getText('UTF-8'))
            if(!(template.strings instanceof Map)) template.strings=[:]
            ['Semaine','sans cours','Reprise à'].each { k -> template.strings[k]=k }
            templateFile.setText(groovy.json.JsonOutput.toJson(template),'UTF-8')
        }

        // Keep all visible version labels coherent.
        for(def path:[
                'src/main/java/com/wokgui/schedulewidget/Stability81Ui.java','src/main/java/com/wokgui/schedulewidget/Stability80Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability79Ui.java','src/main/java/com/wokgui/schedulewidget/Stability78Ui.java',
                'src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java','src/main/java/com/wokgui/schedulewidget/Localization75Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability74Ui.java','src/main/java/com/wokgui/schedulewidget/Stability73Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability72Ui.java','src/main/java/com/wokgui/schedulewidget/Stability71Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability70Ui.java','src/main/java/com/wokgui/schedulewidget/Stability69Ui.java',
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java','src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path);if(!f.exists())continue
            def txt=f.getText('UTF-8').replaceAll(/const APP_VERSION='6\.[0-9]+';/,"const APP_VERSION='6.22';")
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStability82')
}
