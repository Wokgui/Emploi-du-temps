plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wokgui.schedulewidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.schedulewidget'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 101
        versionName '6.19'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply from: 'patches.gradle'

tasks.register('patchLateFinalPolish') {
    doLast {
        def f = file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def src = f.getText('UTF-8')
        def needle = '''    private void injectPersonalizationUi() {
        if (webView == null) return;
'''
        if (!src.contains('FinalPolishLateUi.script()')) {
            if (!src.contains(needle)) throw new GradleException('Unable to locate injectPersonalizationUi for late polish')
            src = src.replace(needle, needle + '        webView.evaluateJavascript(FinalPolishLateUi.script(), null);\n')
            f.write(src, 'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchLateFinalPolish')
}

apply from: 'fixes66.gradle'
