plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wokgui.schedulewidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.schedulewidget'
        minSdk 26
        targetSdk 35
        versionCode 648001
        versionName '6.48'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
}

// 6.48: keep the two heavy sheets mounted and prepared as well as the three main views.
