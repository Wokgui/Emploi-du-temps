plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wokgui.schedulewidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.schedulewidget'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 100
        versionName '3.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
