plugins {
    id 'com.android.application'
}

def launcherIconBase64 = ''''''
def generatedLauncherResDir = file("$buildDir/generated/launcherIcon/res")

android {
    namespace 'com.wokgui.schedulewidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wokgui.schedulewidget'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 100
        versionName '5.7'
    }

    sourceSets {
        main {
            res.srcDir generatedLauncherResDir
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('generateLauncherIcon') {
    def outFile = file("$generatedLauncherResDir/drawable-nodpi/ic_launcher_final.webp")
    outputs.file(outFile)
    doLast {
        outFile.parentFile.mkdirs()
        outFile.bytes = java.util.Base64.decoder.decode(launcherIconBase64.replaceAll('\\s',''))
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateLauncherIcon')
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
