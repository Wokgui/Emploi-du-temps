tasks.register('patchLocalization75') {
    dependsOn tasks.named('patchStability74')
    doLast {
        def mainFile=file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main=mainFile.getText('UTF-8')

        if(!main.contains('Localization75Ui.script()')) {
            def call='webView.evaluateJavascript(Stability74Ui.script(), null)'
            if(!main.contains(call)) throw new GradleException('6.15: Stability74 final call not found')
            main=main.replace(call,'webView.evaluateJavascript(Stability74Ui.script(), value15 -> webView.evaluateJavascript(Localization75Ui.script(), null))')
        }

        def bridgeNeedle='''        @JavascriptInterface public String loadUiSettings() { return UiSettingsStore.exportJson(MainActivity.this); }
        @JavascriptInterface public void saveUiSettings(String json) { UiSettingsStore.importJson(MainActivity.this, json); }
'''
        if(!main.contains('loadLanguagePacks()')) {
            if(!main.contains(bridgeNeedle)) throw new GradleException('6.15: UI settings bridge target not found')
            main=main.replace(bridgeNeedle,bridgeNeedle+'''        @JavascriptInterface public String loadLanguagePacks() { return LanguagePackStore.listJson(MainActivity.this); }
        @JavascriptInterface public String loadLanguagePack(String code) { return LanguagePackStore.get(MainActivity.this, code); }
        @JavascriptInterface public boolean saveLanguagePack(String json) { return LanguagePackStore.save(MainActivity.this, json); }
''')
        }

        def primeOld='''        String language = UiSettingsStore.language(this);
        String label = "de".equals(language) ? "Einzelwoche" : ("en".equals(language) ? "Single week" : "Semaine unique");
'''
        if(main.contains(primeOld)) {
            main=main.replace(primeOld,'''        String language = UiSettingsStore.language(this);
        String label = LanguagePackStore.widgetText(this, language, "singleWeek");
        if (label == null) label = "de".equals(language) ? "Einzelwoche" : ("en".equals(language) ? "Single week" : "Semaine unique");
''')
        }
        mainFile.write(main,'UTF-8')

        def manifest=file('src/main/AndroidManifest.xml')
        def man=manifest.getText('UTF-8')
        if(!man.contains('android.permission.INTERNET')) {
            man=man.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
            manifest.write(man,'UTF-8')
        }

        def uiFile=file('src/main/java/com/wokgui/schedulewidget/UiSettingsStore.java')
        def ui=uiFile.getText('UTF-8')
        def langOld='''    static String language(Context context) {
        String value = prefs(context).getString(LANGUAGE, "fr");
        if ("de".equals(value) || "en".equals(value)) return value;
        return "fr";
    }
'''
        def langNew='''    static String language(Context context) {
        String value = prefs(context).getString(LANGUAGE, "fr");
        if ("fr".equals(value) || "de".equals(value) || "en".equals(value) || LanguagePackStore.has(context, value)) return value;
        return "fr";
    }
'''
        if(ui.contains(langOld)) ui=ui.replace(langOld,langNew)

        ui=ui.replace('''            if (!"de".equals(lang) && !"en".equals(lang)) lang = "fr";
''','''            if (!"fr".equals(lang) && !"de".equals(lang) && !"en".equals(lang) && !LanguagePackStore.has(context, lang)) lang = "fr";
''')

        def localeOld='''    static Locale locale(Context context) {
        switch (language(context)) {
            case "de": return Locale.GERMANY;
            case "en": return Locale.UK;
            default: return Locale.FRANCE;
        }
    }
'''
        def localeNew='''    static Locale locale(Context context) {
        String lang = language(context);
        if ("de".equals(lang)) return Locale.GERMANY;
        if ("en".equals(lang)) return Locale.UK;
        if ("fr".equals(lang)) return Locale.FRANCE;
        Locale locale = Locale.forLanguageTag(lang.replace('_', '-'));
        return locale.getLanguage().isEmpty() ? Locale.FRANCE : locale;
    }
'''
        if(ui.contains(localeOld)) ui=ui.replace(localeOld,localeNew)

        def tOld='''    static String t(Context context, String key) {
        return t(language(context), key);
    }
'''
        def tNew='''    static String t(Context context, String key) {
        String lang = language(context);
        String downloaded = LanguagePackStore.widgetText(context, lang, key);
        return downloaded != null ? downloaded : t(lang, key);
    }
'''
        if(ui.contains(tOld)) ui=ui.replace(tOld,tNew)
        uiFile.write(ui,'UTF-8')

        for(def path:[
                'src/main/java/com/wokgui/schedulewidget/Localization75Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability74Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability73Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability72Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability71Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability70Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability69Ui.java',
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java',
                'src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path);if(!f.exists())continue
            def txt=f.getText('UTF-8')
            ['6.14','6.13','6.12','6.11','6.10','6.9','6.8','6.7','6.6','6.5'].each { old ->
                txt=txt.replace("const APP_VERSION='${old}';","const APP_VERSION='6.15';")
            }
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchLocalization75')
}
