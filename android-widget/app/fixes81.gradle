tasks.register('patchStability81') {
    dependsOn tasks.named('patchOcrEscapes80')
    doLast {
        def mainFile=file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main=mainFile.getText('UTF-8')

        // Persist the selected language natively before doing one hidden WebView reload.
        if(!main.contains('setLanguageAndReload81')) {
            def bridge='''        @JavascriptInterface public void reloadForLanguage() { runOnUiThread(MainActivity.this::reloadForLanguageUi); }
'''
            if(!main.contains(bridge)) throw new GradleException('6.21: reloadForLanguage bridge not found')
            main=main.replace(bridge,bridge+'''        @JavascriptInterface public void setLanguageAndReload81(String code) {
            runOnUiThread(() -> {
                try {
                    JSONObject ui = new JSONObject(UiSettingsStore.exportJson(MainActivity.this));
                    ui.put("language", code == null || code.trim().isEmpty() ? "fr" : code.trim());
                    UiSettingsStore.importJson(MainActivity.this, ui.toString());
                } catch (Exception ignored) {}
                reloadForLanguageUi();
            });
        }
''')
        }

        // Final 6.21 pass runs after OCR and before the WebView is revealed.
        if(!main.contains('Stability81Ui.script()')) {
            def reveal='''                                                        if (!forceWeekOpening) revealWebViewStable();
'''
            if(!main.contains(reveal)) throw new GradleException('6.21: final reveal callback not found')
            main=main.replace(reveal,'''                                                        webView.evaluateJavascript(Stability81Ui.script(), value23 -> {
                                                            if (!forceWeekOpening) revealWebViewStable();
                                                        });
''')
        }
        mainFile.write(main,'UTF-8')

        // The old settings layer translated one event-loop turn after rendering, which exposed
        // a French frame when switching tabs. Translate synchronously instead.
        def settingsFile=file('src/main/java/com/wokgui/schedulewidget/PersonalizationUi2.java')
        def settings=settingsFile.getText('UTF-8')
        settings=settings.replace(
                'const wrapped=function(){const result=original.apply(this,arguments);setTimeout(refresh,0);return result}',
                'const wrapped=function(){const result=original.apply(this,arguments);refresh();return result}')
        settingsFile.write(settings,'UTF-8')

        // fixes76 changed Localization75 to a root-based rAF scheduler. Convert that scheduler to
        // an immediate pass and remove its mutation-observer loop; final render wrappers cover the
        // DOM without painting an untranslated intermediate frame.
        def locFile=file('src/main/java/com/wokgui/schedulewidget/Localization75Ui.java')
        def loc=locFile.getText('UTF-8')
        def cascade="""                    ['refreshSettingsV3','refreshAdvancedFeatures','refreshUiPolishSchool','refreshCoursePaletteV4','refreshFineTuneUi','refreshLunchBreakUi','refreshDoubleLunchUi','refreshWeekendUi','refreshStability70','refreshStability71','refreshStability72','refreshStability73','refreshStability74'].forEach(n=>{try{if(typeof window[n]==='function')window[n]()}catch(e){}});\n"""
        if(loc.contains(cascade))loc=loc.replace(cascade,"""                    try{if(typeof window.refreshSettingsV3==='function')window.refreshSettingsV3()}catch(e){}\n""")
        loc=loc.replace(
                'if(queued||translating)return;queued=true;requestAnimationFrame(translateOnly);',
                'if(translating)return;queued=false;translateOnly();')

        def obsStart=loc.indexOf('                localizationObserver=new MutationObserver(')
        if(obsStart>=0) {
            def obsEnd=loc.indexOf('                fullRefresh();setTimeout(()=>schedule(document.body),120);',obsStart)
            if(obsEnd>=0) {
                def tail='''                localizationObserver=null;
                fullRefresh();
'''
                def oldEnd='                fullRefresh();setTimeout(()=>schedule(document.body),120);'.length()
                loc=loc.substring(0,obsStart)+tail+loc.substring(obsEnd+oldEnd)
            }
        }
        loc=loc.replace('fullRefresh();setTimeout(()=>schedule(document.body),120);','fullRefresh();')
        locFile.write(loc,'UTF-8')

        // LayoutLanguage77 had its own timeout/rAF passes. Keep the layout work, make it immediate.
        def layoutFile=file('src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java')
        def layout=layoutFile.getText('UTF-8')
        layout=layout.replace(
                "setTimeout(()=>{try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(e){};refresh()},0);",
                "try{if(window.refreshLocalization75)window.refreshLocalization75()}catch(e){};refresh();")
        layout=layout.replace(
                'const w=function(){const r=old.apply(this,arguments);requestAnimationFrame(refresh);return r}',
                'const w=function(){const r=old.apply(this,arguments);refresh();return r}')
        layout=layout.replace('refresh();requestAnimationFrame(refresh);setTimeout(refresh,120);','refresh();')
        layoutFile.write(layout,'UTF-8')

        // Full ordinal names under “Horaires des 9 heures”.
        def asset=file('src/main/assets/index.html')
        def html=asset.getText('UTF-8')
        html=html.replace('grid-template-columns:62px 1fr 1fr','grid-template-columns:92px 1fr 1fr')
        html=html.replace('''${i+1}e h''','''${i===0?'1ère heure':(i+1)+'ème heure'}''')
        html=html.replace('''${s.n}e heure · ${s.start}–${s.end}''','''${s.n===1?'1ère heure':s.n+'ème heure'} · ${s.start}–${s.end}''')
        html=html.replace(''' · heure ${c.slot}''',''' · ${c.slot===1?'1ère heure':c.slot+'ème heure'}''')
        asset.write(html,'UTF-8')

        // New downloadable languages receive the recent labels too, not only the original catalog.
        def templateFile=file('src/main/assets/language_template_fr.json')
        if(templateFile.exists()) {
            def template=new groovy.json.JsonSlurper().parseText(templateFile.getText('UTF-8'))
            if(!(template.strings instanceof Map)) template.strings=[:]
            [
                    '1ère heure','2ème heure','3ème heure','4ème heure','5ème heure','6ème heure','7ème heure','8ème heure','9ème heure',
                    'Horaire actuel','Horaire conservé','Horaire personnalisé','Horaire appliqué','salle','heure',
                    'Télécharger une langue','Toutes les langues disponibles sont déjà installées.',
                    'Téléchargement du modèle de langue et traduction de toute l’interface…','Langue téléchargée. Application en cours…',
                    'La langue a été téléchargée mais n’a pas pu être appliquée.'
            ].each { k -> template.strings[k]=k }
            templateFile.setText(groovy.json.JsonOutput.toJson(template),'UTF-8')
        }

        // Keep every visible version label coherent with the APK.
        for(def path:[
                'src/main/java/com/wokgui/schedulewidget/Stability81Ui.java','src/main/java/com/wokgui/schedulewidget/Stability80Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability79Ui.java','src/main/java/com/wokgui/schedulewidget/Stability78Ui.java',
                'src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java','src/main/java/com/wokgui/schedulewidget/Localization75Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability74Ui.java','src/main/java/com/wokgui/schedulewidget/Stability73Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability72Ui.java','src/main/java/com/wokgui/schedulewidget/Stability71Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability70Ui.java','src/main/java/com/wokgui/schedulewidget/Stability69Ui.java',
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java','src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path);if(!f.exists())continue
            def txt=f.getText('UTF-8').replaceAll(/const APP_VERSION='6\.[0-9]+';/,"const APP_VERSION='6.21';")
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStability81')
}
