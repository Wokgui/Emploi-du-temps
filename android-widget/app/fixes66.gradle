tasks.register('patchCycleLunch66') {
    dependsOn tasks.named('patchTimetableCompatibility')
    doLast {
        // Run the 6.6 UI fixer only after all older UI layers have finished their first refresh.
        def mainFile = file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main = mainFile.getText('UTF-8')
        def lateNeedle = '''webView.evaluateJavascript(FineTuneUi.script(), value10 -> {
                                                                                            primeWeekBadge();'''
        if (!main.contains('webView.evaluateJavascript(CycleLunchFixUi.script(), null);')) {
            if (main.contains(lateNeedle)) {
                main = main.replace(lateNeedle, '''webView.evaluateJavascript(FineTuneUi.script(), value10 -> {
                                                                                            webView.evaluateJavascript(CycleLunchFixUi.script(), null);
                                                                                            primeWeekBadge();''')
            } else {
                def earlyNeedle = '''    private void injectPersonalizationUi() {
        if (webView == null) return;
'''
                if (!main.contains(earlyNeedle)) throw new GradleException('Unable to inject CycleLunchFixUi')
                main = main.replace(earlyNeedle, earlyNeedle + '        webView.evaluateJavascript(CycleLunchFixUi.script(), null);\n')
            }
            mainFile.write(main, 'UTF-8')
        }

        // A real single-week schedule must always resolve to week A, including the widget.
        def storeFile = file('src/main/java/com/wokgui/schedulewidget/ScheduleStore.java')
        def store = storeFile.getText('UTF-8')
        def weekNeedle = '''    static String getWeekLetter(Context context, Calendar date) {
        ensureInitialized(context);
        int length = AdvancedSettingsStore.cycleLength(context);'''
        if (store.contains(weekNeedle)) {
            store = store.replace(weekNeedle, '''    static String getWeekLetter(Context context, Calendar date) {
        ensureInitialized(context);
        if (AdvancedSettingsStore.json(context).optBoolean("singleWeek", false)) return "A";
        int length = AdvancedSettingsStore.cycleLength(context);''')
        }
        def setNeedle = '''    static void setCurrentWeekLetter(Context context, String letter) {
        ensureInitialized(context);
        int length = AdvancedSettingsStore.cycleLength(context);'''
        if (store.contains(setNeedle)) {
            store = store.replace(setNeedle, '''    static void setCurrentWeekLetter(Context context, String letter) {
        ensureInitialized(context);
        if (AdvancedSettingsStore.json(context).optBoolean("singleWeek", false)) letter = "A";
        int length = AdvancedSettingsStore.cycleLength(context);''')
        }
        storeFile.write(store, 'UTF-8')

        // Make singleWeek an explicit persisted setting instead of an accidental extra JSON key.
        def advFile = file('src/main/java/com/wokgui/schedulewidget/AdvancedSettingsStore.java')
        def adv = advFile.getText('UTF-8')
        if (!adv.contains('o.put("singleWeek", false);')) {
            adv = adv.replace('            o.put("cycleLength", 2);', '            o.put("cycleLength", 2);\n            o.put("singleWeek", false);')
        }
        advFile.write(adv, 'UTF-8')

        // Keep every in-app version label aligned with the APK.
        for (def path : [
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path), txt=f.getText('UTF-8')
            txt=txt.replace("const APP_VERSION='6.5';", "const APP_VERSION='6.6';")
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchCycleLunch66')
}
