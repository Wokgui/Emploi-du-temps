tasks.register('patchStability78') {
    dependsOn tasks.named('patchLanguageLayout77')
    doLast {
        def mainFile=file('src/main/java/com/wokgui/schedulewidget/MainActivity.java')
        def main=mainFile.getText('UTF-8')

        // Hide the WebView on every cold launch, not only when launched from the widget.
        // The final UI layer reveals it once all legacy/injected layers have settled.
        main=main.replace('        if (forceWeekOpening) hideWebViewUntilWeekIsReady();', '        hideWebViewUntilWeekIsReady();')

        if(!main.contains('private void revealWebViewStable()')) {
            def needle='''    private void hideWebViewUntilWeekIsReady() {
        if (webView == null) return;
        webView.setAlpha(0f);
        webView.setVisibility(View.INVISIBLE);
    }
'''
            if(!main.contains(needle)) throw new GradleException('6.18: hide WebView method not found')
            main=main.replace(needle,needle+'''
    private void revealWebViewStable() {
        if (webView == null) return;
        webView.postDelayed(() -> {
            if (webView == null) return;
            webView.setAlpha(1f);
            webView.setVisibility(View.VISIBLE);
        }, 70);
    }
''')
        }

        if(!main.contains('Stability78Ui.script()')) {
            def target='webView.evaluateJavascript(LayoutLanguage77Ui.script(), null)'
            if(!main.contains(target)) throw new GradleException('6.18: final 6.17 UI injection target not found')
            main=main.replace(target,'''webView.evaluateJavascript(LayoutLanguage77Ui.script(), value17 ->
                                        webView.evaluateJavascript(Stability78Ui.script(), value18 -> {
                                            if (!forceWeekOpening) revealWebViewStable();
                                        }))''')
        }
        mainFile.write(main,'UTF-8')

        // Keep every old visible version label aligned with the APK.
        for(def path:[
                'src/main/java/com/wokgui/schedulewidget/Stability78Ui.java',
                'src/main/java/com/wokgui/schedulewidget/LayoutLanguage77Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Localization75Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability74Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability73Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability72Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability71Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability70Ui.java',
                'src/main/java/com/wokgui/schedulewidget/Stability69Ui.java',
                'src/main/java/com/wokgui/schedulewidget/FinalPolishUi.java',
                'src/main/java/com/wokgui/schedulewidget/CycleLunchFixUi.java',
                'src/main/java/com/wokgui/schedulewidget/WeekViewStabilityUi.java']) {
            def f=file(path);if(!f.exists())continue
            def txt=f.getText('UTF-8').replace("const APP_VERSION='6.17';","const APP_VERSION='6.18';")
            f.write(txt,'UTF-8')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('patchStability78')
}
