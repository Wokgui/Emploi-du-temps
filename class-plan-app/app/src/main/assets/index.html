<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Plan de classe – 3G34 ALL</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#d7dde3;--ink:#1f2937;--muted:#6b7280;--accent:#0f766e;--accent2:#ccfbf1;--desk:#e8eef3;--selected:#fef3c7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px}h1{font-size:18px;margin:0 0 8px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;font-weight:650}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.note{font-size:12px;color:var(--muted);width:100%}.wrap{padding:8px;overflow:auto}.plan{min-width:760px;max-width:1100px;margin:0 auto;background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.board{width:58%;margin:0 auto 22px;text-align:center;background:#1f2937;color:white;border-radius:8px;padding:10px;font-weight:800;letter-spacing:.04em}.row{display:grid;align-items:stretch;justify-content:center;gap:18px;margin:13px 0}.row.two{grid-template-columns:repeat(2,minmax(250px,300px))}.row.four{grid-template-columns:repeat(4,minmax(145px,1fr));gap:10px}.row-label{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:700;text-align:left;margin-bottom:-6px}.table{background:var(--desk);border:2px solid #c5ced7;border-radius:10px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:7px;min-height:64px}.seat{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:48px;display:flex;align-items:center;justify-content:center;padding:6px;font-size:14px;font-weight:750;text-align:center;user-select:none;touch-action:none}.seat.empty{color:#9ca3af;font-weight:500}.seat.selected{background:var(--selected);outline:2px solid #f59e0b}.seat.drag-source{opacity:.35}.seat.drop-target{outline:3px solid var(--accent);background:var(--accent2)}.legend{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);padding:8px 12px;background:white;border:2px solid var(--accent);border-radius:9px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
</style>
</head>
<body>
<header><h1>Plan de classe – 3G34 ALL</h1><div class="controls"><button class="primary" id="shuffleBtn">Mélanger</button><button id="resetBtn">Réinitialiser</button><span class="note">Glisse un prénom sur une autre place pour les échanger. Tu peux aussi toucher deux places successivement.</span></div></header>
<div class="wrap"><main class="plan"><div class="board">TABLEAU</div><div id="rows"></div><div class="legend">Janelt retirée. Ermin est initialement à gauche du 2e rang. Les changements restent enregistrés sur le téléphone.</div></main></div><div class="ghost" id="ghost"></div>
<script>
const INITIAL=["Seynabou","Victoire","Tristan","Victor","Ermin","Manuela","Théo","Naim","Léon","Louay","Aurélian","Lina","Arthur","","Adam","Lamine","Zoé","Azra","Roufaida","Mathilde","Anaïs","Hidaya","Matias","","Elynna","Evan","","Timéo","Mila","Janna","","Maëlys","Nina","Rosie","Abigail","Redouane"];
const STORAGE_KEY="plan-classe-3g34-all-v1",rowTables=[2,2,2,2,2,4,4];let seats=loadState(),selected=null,drag=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(s)&&s.length===36)return s}catch(e){}return[...INITIAL]}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(seats))}
function render(){const rows=document.getElementById("rows");rows.innerHTML="";let idx=0;rowTables.forEach((count,r)=>{const row=document.createElement("section");row.className="row "+(count===2?"two":"four");const lab=document.createElement("div");lab.className="row-label";lab.textContent="Rang "+(r+1);row.appendChild(lab);for(let t=0;t<count;t++){const table=document.createElement("div");table.className="table";for(let s=0;s<2;s++){const seat=document.createElement("div");seat.className="seat"+(seats[idx]?"":" empty");seat.dataset.index=idx;seat.textContent=seats[idx]||"Libre";if(selected===idx)seat.classList.add("selected");seat.addEventListener("pointerdown",onPointerDown);seat.addEventListener("click",onSeatClick);table.appendChild(seat);idx++}row.appendChild(table)}rows.appendChild(row)})}
function swap(a,b){[seats[a],seats[b]]=[seats[b],seats[a]];selected=null;save();render()}
function onSeatClick(e){if(drag&&drag.moved)return;const i=Number(e.currentTarget.dataset.index);if(selected===null){selected=i;render()}else if(selected===i){selected=null;render()}else swap(selected,i)}
function onPointerDown(e){if(e.button!==undefined&&e.button!==0)return;const source=e.currentTarget,index=Number(source.dataset.index);drag={index,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,target:null};source.setPointerCapture?.(e.pointerId);source.addEventListener("pointermove",onPointerMove);source.addEventListener("pointerup",onPointerUp,{once:true});source.addEventListener("pointercancel",onPointerUp,{once:true})}
function onPointerMove(e){if(!drag||e.pointerId!==drag.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(!drag.moved&&Math.hypot(dx,dy)<7)return;drag.moved=true;e.preventDefault();document.querySelector(`.seat[data-index="${drag.index}"]`)?.classList.add("drag-source");const ghost=document.getElementById("ghost");ghost.style.display="block";ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";ghost.textContent=seats[drag.index]||"Libre";document.querySelectorAll(".seat.drop-target").forEach(x=>x.classList.remove("drop-target"));const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".seat");if(el){drag.target=Number(el.dataset.index);if(drag.target!==drag.index)el.classList.add("drop-target")}else drag.target=null}
function onPointerUp(e){const current=drag;if(!current)return;e.currentTarget.removeEventListener("pointermove",onPointerMove);document.getElementById("ghost").style.display="none";document.querySelectorAll(".seat").forEach(x=>x.classList.remove("drag-source","drop-target"));drag=null;if(current.moved&&current.target!==null&&current.target!==current.index)swap(current.index,current.target)}
document.getElementById("resetBtn").onclick=()=>{seats=[...INITIAL];selected=null;save();render()};document.getElementById("shuffleBtn").onclick=()=>{const fixedIndex=4,vals=seats.filter((_,i)=>i!==fixedIndex).filter(v=>v!=="Ermin");if(seats[fixedIndex]&&seats[fixedIndex]!=="Ermin")vals.push(seats[fixedIndex]);while(vals.length<35)vals.push("");for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}seats=new Array(36).fill("");seats[fixedIndex]="Ermin";let k=0;for(let i=0;i<36;i++)if(i!==fixedIndex)seats[i]=vals[k++]||"";selected=null;save();render()};render();
</script>
</body></html>
