ize:8px;font-weight:850;display:flex;align-items:center;justify-content:center}.tablegroups{display:flex;align-items:stretch;justify-content:space-between;gap:clamp(5px,2vw,13px);height:88%;min-width:0}.tgroup{display:grid;gap:2px;min-width:0}.desk{min-width:0;background:var(--table);border:1px solid var(--tl);border-radius:5px;padding:1px;display:grid;grid-template-columns:1fr 1fr;gap:1px;height:100%}.seat{min-width:0;min-height:15px;border:1px solid #bbc6cb;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;gap:2px;padding:1px 2px;font-size:clamp(6px,2.2vw,9px);font-weight:780;touch-action:none;user-select:none;overflow:hidden}.seat.boy{background:var(--boy);border-color:var(--boyb)}.seat.girl{background:var(--girl);border-color:var(--girlb)}.seat.empty{color:#a4abb0;font-weight:500}.seat.pick{outline:2px solid #d7a106}.seat.src{opacity:.35}.seat.target{outline:2px solid var(--g)}.seatname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.seaticons{display:flex;gap:1px;flex:0 0 auto}.miniicon{width:9px;height:9px;display:inline-flex;align-items:center;justify-content:center}.miniicon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.miniicon[data-tag="perturbateur"]{color:#d17a00}.miniicon[data-tag="bavard"]{color:#3e6ed8}.miniicon[data-tag="problematique"]{color:#c33}.miniicon[data-tag="silencieux"]{color:#607d6c}.miniicon[data-tag="handicap"]{color:#6a55b5}.landslot{flex:0 0 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;align-items:center;transition:min-height .12s,background .12s,border .12s}.landslot.has{flex-basis:23px;min-height:23px}.landcell{display:flex;justify-content:center;align-items:center;gap:3px;min-width:0}.land{height:20px;max-width:100%;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 5px;font-size:9px;font-weight:850;touch-action:none;user-select:none}.land.board{back <div id="app"><header class="top"><div class="brand"><img src="app_icon.png" alt=""><div class="bt">Plan de classe</div></div><div class="classbar"><div class="selwrap"><small>Classe</small><select id="classSel" class="sel"></select></div><button id="newC" class="ib" title="Nouvelle classe">＋</button><button id="dupC" class="ib" title="Dupliquer">⧉</button><button id="renC" class="ib" title="Renommer">✎</button><button id="delC" class="ib del" title="Supprimer">⌫</button></div></header><main class="main"><section id="v-plan" class="view on"><div class="card plan"><div id="room" class="room"></div><div class="tools"><button id="undo" class="b">↶</button><button id="redo" class="b">↷</button><button id="mix" class="b">Mélanger</button></div></div></section><section id="v-students" class="view scroll"><div class="card section"><h2>Élèves — <span id="cname"></span></h2><div class="form"><input id="newS" class="inp" placeholder="Nom"><div class="genderpick"><button id="newBoy" class="gbtn boy">Garçon</button><button id="newGirl" class="gbtn girl">Fille</button></div><button id="addS" class="pb">Ajouter</button></div><div id="students" class="students"></div></div></section><section id="v-config" class="view scroll"><div class="card section"><h2>Disposition</h2><div class="cfg"><b>Nombre de rangées</b><div class="step"><button id="rmRow">−</button><span id="rowN"></span><button id="addRow">＋</button></div></div><div id="rowCfg"></div></div><div class="card section"><h2>Tableau et bureau</h2><p>Dans le plan, glisse le Tableau ou le Bureau à l’endroit voulu. × permet de le supprimer.</p><div id="objButtons" class="objbuttons"></div></div><div class="card section"><h2>Icônes élèves</h2><div id="statusLegend" class="statuslegend"></div></div></section></main><footer class="foot"><button class="nav on" data-v="plan"><span>⌂</span>Plan</button><button class="nav" data-v="students"><span>👥</span>Élèves</button><button class="nav" data-v="config"><span>⚙</span>Réglages</button></footer></div><div id="ghost" class="ghost"></div><div id="toast" class="toast"></div><div id="modalbg" class="modalbg"><div class="modal"><h3 id="mt"></h3><input id="mi" class="inp" style="width:100%"><div class="mb"><button id="mc" class="ob">Annuler</button><button id="mo" class="pb">Valider</button></div></div></div>
<script>
const NAMES=["Seynabou","Victoire","Tristan","Victor","Ermin","Manuela","Théo","Naim","Léon","Louay","Aurélian","Lina","Arthur","Adam","Lamine","Zoé","Azra","Roufaida","Mathilde","Anaïs","Hidaya","Matias","Elynna","Evan","Timéo","Mila","Janna","Maëlys","Nina","Rosie","Abigail","Redouane"];const INIT_ROWS=[[2],[2],[2],[2],[2],[4],[4]],KEY='plan-classe-v4';const TAGS=[['perturbateur','Perturbateur'],['bavard','Bavard'],['problematique','Problématique'],['silencieux','Silencieux'],['handicap','Handicap']];const SVG={perturbateur:'<svg viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 9-13h-6z"/></svg>',bavard:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',problematique:'<svg viewBox="0 0 24 24"><path d="M12 3 22 20H2z"/><path d="M12 9v5M12 17h.01"/></svg>',silencieux:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>',handicap:'<svg viewBox="0 0 24 24"><circle cx="10" cy="4" r="2"/><path d="M9 8v6h6l3 6M9 11h5M9 14a5 5 0 1 0 4 5"/></svg>'};let S=load(),pick=null,seatDrag=null,landDrag=null,H=[],F=[],resolver=null,newGender='';function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function mkStudent(name,gender=''){return{id:uid(),name,gender,tags:[]}}function defaultClass(){let students=NAMES.map(n=>mkStudent(n)),seats=[],capacity=INIT_ROWS.flat().reduce((a,b)=>a+b,0)*2;for(let i=0;i<capacity;i++)seats.push(students[i]?.id||null);return{id:uid(),name:'3G34 ALL',rows:INIT_ROWS.map(x=>[...x]),students,seats,landmarks:{tableau:{visible:true,slot:0,align:'center'},bureau:{visible:true,slot:0,align:'right'}}}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.classes?.length)return x}catch(e){}return{cur:null,classes:[defaultClass()]}}if(!S.cur)S.cur=S.classes[0].id;function save(){localStorage.setItem(KEY,JSON.stringify(S))}function C(){return S.classes.find(x=>x.id===S.cur)||S.classes[0]}function rowTables(row){return row.reduce((a,b)=>a+b,0)}function cap(c=C()){return c.rows.reduce((a,r)=>a+rowTables(r)*2,0)}function norm(c=C()){let n=cap(c);if(c.seats.length<n)while(c.seats.length<n)c.seats.push(null);else if(c.seats.length>n)c.seats.length=n;if(!c.landmarks)c.landmarks={tableau:{visible:true,slot:0,align:'center'},bureau:{visible:true,slot:0,align:'right'}};['tableau','bureau'].forEach(k=>{if(!c.landmarks[k])c.landmarks[k]={visible:true,slot:0,align:k==='tableau'?'center':'right'};c.landmarks[k].slot=Math.max(0,Math.min(c.rows.length,c.landmarks[k].slot||0))})}function snap(){H.push(JSON.stringify(S));if(H.length>50)H.shift();F=[]}function restore(s){S=JSON.parse(s);save();render()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1300)}function studentById(id,c=C()){return c.students.find(s=>s.id===id)}function unseated(c=C()){let used=new Set(c.seats.filter(Boolean));return c.students.filter(s=>!used.has(s.id))}function render(){norm();renderClasses();renderPlan();renderStudents();renderCfg();save()}function renderClasses(){let s=document.getElementById('classSel');s.innerHTML='';S.classes.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;s.appendChild(o)});s.value=S.cur;document.getElementById('delC').disabled=S.classes.length<2}function iconSpan(tag){let sp=document.createElement('span');sp.className='miniicon';sp.dataset.tag=tag;sp.innerHTML=SVG[tag];return sp}function makeLandCell(){let c=document.createElement('div');c.className='landcell';return c}function renderLandslot(c,slot){let lane=document.createElement('div');lane.className='landslot';lane.dataset.slot=slot;let cells=[makeLandCell(),makeLandCell(),makeLandCell()];lane.append(...cells);let count=0;for(let id of ['tableau','bureau']){let o=c.landmarks[id];if(!o.visible||o.slot!==slot)continue;count++;let el=document.createElement('div');el.className='land '+(id==='tableau'?'board':'bureau');el.dataset.land=id;el.innerHTML=`<span>${id==='tableau'?'Tableau':'Bureau'}</span><button class="landx" aria-label="Supprimer">×</button>`;el.querySelector('.landx').onclick=e=>{e.stopPropagation();snap();o.visible=false;save();render()};el.onpointerdown=e=>landDown(e,id);let ci=o.align==='left'?0:o.align==='right'?2:1;cells[ci].appendChild(el)}if(count)lane.classList.add('has');return lane}function renderPlan(){let c=C();norm(c);let room=document.getElementById('room');room.innerHTML='';room.classList.remove('lmdrag');let stack=document.createElement('div');stack.className='rowsstack';let k=0;for(let r=0;r<c.rows.length;r++){stack.appendChild(renderLandslot(c,r));let row=document.createElement('div');row.className='row';let rn=document.createElement('div');rn.className='rn';rn.textContent=r+1;let groups=document.createElement('div');groups.className='tablegroups';for(let gi=0;gi<c.rows[r].length;gi++){let gcount=c.rows[r][gi],g=document.createElement('div');g.className='tgroup';g.style.gridTemplateColumns=`repeat(${gcount},minmax(0,1fr))`;g.style.flex=`${gcount} 1 0`;for(let t=0;t<gcount;t++){let desk=document.createElement('div');desk.className='desk';for(let j=0;j<2;j++){let idx=k++,sid=c.seats[idx],st=sid?studentById(sid,c):null,e=document.createElement('div');e.className='seat'+(!st?' empty':'')+(st?.gender==='boy'?' boy':'')+(st?.gender==='girl'?' girl':'')+(pick===idx?' pick':'');e.dataset.i=idx;if(st){let nm=document.createElement('span');nm.className='seatname';nm.textContent=st.name;e.appendChild(nm);if(st.tags?.length){let icons=document.createElement('span');icons.className='seaticons';st.tags.slice(0,3).forEach(tag=>icons.appendChild(iconSpan(tag)));e.appendChild(icons)}}else e.textContent='Libre';e.title=st?st.name:'Libre';e.onpointerdown=seatDown;e.onclick=seatClick;desk.appendChild(e)}g.appendChild(desk)}groups.appendChild(g)}row.append(rn,groups);stack.appendChild(row)}stack.appendChild(renderLandslot(c,c.rows.length));room.appendChild(stack);document.getElementById('undo').disabled=!H.length;document.getElementById('redo').disabled=!F.length}function seatSwap(a,b){let c=C();[c.seats[a],c.seats[b]]=[c.seats[b],c.seats[a]];pick=null;save();renderPlan()}function seatClick(e){if(seatDrag?.moved)return;let i=+e.currentTarget.dataset.i;if(pick===null){pick=i;renderPlan()}else if(pick===i){pick=null;renderPlan()}else{snap();seatSwap(pick,i)}}function seatDown(e){if(e.button!==undefined&&e.button!==0)return;let el=e.currentTarget;seatDrag={i:+el.dataset.i,p:e.pointerId,x:e.clientX,y:e.clientY,moved:false,target:null};el.setPointerCapture?.(e.pointerId);el.addEventListener('pointermove',seatMove);el.addEventListener('pointerup',seatUp,{once:true});el.addEventListener('pointercancel',seatUp,{once:true})}function seatMove(e){if(!seatDrag||e.pointerId!==seatDrag.p)return;if(!seatDrag.moved&&Math.hypot(e.clientX-seatDrag.x,e.clientY-seatDrag.y)<7)return;seatDrag.moved=true;e.preventDefault();document.querySelector(`.seat[data-i="${seatDrag.i}"]`)?.classList.add('src');let gh=document.getElementById('ghost'),st=studentById(C().seats[seatDrag.i]);gh.style.display='block';gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';gh.textContent=st?.name||'Libre';document.querySelectorAll('.seat.target').forEach(x=>x.classList.remove('target'));let t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.seat');seatDrag.target=t?+t.dataset.i:null;if(t&&seatDrag.target!==seatDrag.i)t.classList.add('target')}function seatUp(e){let d=seatDrag;if(!d)return;e.currentTarget.removeEventListener('pointermove',seatMove);document.getElementById('ghost').style.display='none';document.querySelectorAll('.seat').forEach(x=>x.classList.remove('src','target'));seatDrag=null;if(d.moved&&d.target!==null&&d.target!==d.i){snap();seatSwap(d.i,d.target)}}function landDown(e,id){if(e.target.closest('.landx'))return;let el=e.currentTarget;landDrag={id,p:e.pointerId,x:e.clientX,y:e.clientY,moved:false,target:null};el.setPointerCapture?.(e.pointerId);el.addEventListener('pointermove',landMove);el.addEventListener('pointerup',landUp,{once:true});el.addEventListener('pointercancel',landUp,{once:true})}function landMove(e){if(!landDrag||e.pointerId!==landDrag.p)return;if(!landDrag.moved&&Math.hypot(e.clientX-landDrag.x,e.clientY-landDrag.y)<6)return;landDrag.moved=true;e.preventDefault();let room=document.getElementById('room');room.classList.add('lmdrag');let gh=document.getElementById('ghost');gh.style.display='block';gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';gh.textContent=landDrag.id==='tableau'?'Tableau':'Bureau';document.querySelectorAll('.landslot.over').forEach(x=>x.classList.remove('over'));let lane=document.elementFromPoint(e.clientX,e.clientY)?.closest('.landslot');if(lane){lane.classList.add('over');landDrag.target=+lane.dataset.slot}else landDrag.target=null}function landUp(e){let d=landDrag;if(!d)return;e.currentTarget.removeEventListener('pointermove',landMove);document.getElementById('ghost').style.display='none';document.getElementById('room').classList.remove('lmdrag');document.querySelectorAll('.landslot.over').forEach(x=>x.classList.remove('over'));landDrag=null;if(d.moved&&d.target!==null){let c=C(),o=c.landmarks[d.id];snap();o.slot=d.target;let room=document.getElementById('room').getBoundingClientRect(),third=room.width/3,x=e.clientX-room.left;o.align=x<third?'left':x>2*third?'right':'center';save();renderPlan()}}function renderStudents(){let c=C();document.getElementById('cname').textContent=c.name;let box=document.getElementById('students');box.innerHTML='';let arr=[...c.students].sort((a,b)=>a.name.localeCompare(b.name,'fr'));arr.forEach(st=>{let d=document.createElement('div');d.className='stu'+(st.gender==='boy'?' boy':'')+(st.gender==='girl'?' girl':'');let h=document.createElement('div');h.className='stuhead';let inp=document.createElement('input');inp.value=st.name;inp.placeholder='Nom';inp.onchange=()=>{let v=inp.value.trim();if(!v){inp.value=st.name;return}snap();st.name=v;save();renderPlan()};let x=document.createElement('button');x.className='x';x.textContent='⌫';x.onclick=()=>delStudent(st.id);h.append(inp,x);let ctrl=document.createElement('div');ctrl.className='stuctrl',genders=document.createElement('div');genders.className='genderdots';[['boy','♂','Garçon'],['girl','♀','Fille']].forEach(([g,sym,title])=>{let b=document.createElement('button');b.className='dot '+g+(st.gender===g?' on':'');b.textContent=sym;b.title=title;b.onclick=()=>{snap();st.gender=st.gender===g?'':g;save();renderStudents();renderPlan()};genders.appendChild(b)});let tags=document.createElement('div');tags.className='tagset';TAGS.forEach(([tag,label])=>{let b=document.createElement('button');b.className='tagb'+(st.tags?.includes(tag)?' on':'');b.dataset.tag=tag;b.title=label;b.innerHTML=SVG[tag];b.onclick=()=>{snap();st.tags=st.tags||[];let i=st.tags.indexOf(tag);if(i>=0)st.tags.splice(i,1);else st.tags.push(tag);save();renderStudents();renderPlan()};tags.appendChild(b)});ctrl.append(genders,tags);d.append(h,ctrl);box.appendChild(d)});let u=unseated(c).length;if(u){let p=document.createElement('div');p.className='small';p.textContent=u+' élève'+(u>1?'s':'')+' sans place dans le plan.';box.prepend(p)}}function delStudent(id){let c=C(),st=studentById(id,c);if(!st)return;if(!confirm('Supprimer '+st.name+' ?'))return;snap();c.students=c.students.filter(s=>s.id!==id);c.seats=c.seats.map(x=>x===id?null:x);save();render()}function setNewGender(g){newGender=newGender===g?'':g;document.getElementById('newBoy').classList.toggle('on',newGender==='boy');document.getElementById('newGirl').classList.toggle('on',newGender==='girl')}function addStudent(){let c=C(),inp=document.getElementById('newS'),name=inp.value.trim();if(!name)return;let st=mkStudent(name,newGender);snap();c.students.push(st);let i=c.seats.indexOf(null);if(i>=0)c.seats[i]=st.id;else toast('Élève ajouté sans place');inp.value='';setNewGender('');save();render()}function renderCfg(){let c=C();document.getElementById('rowN').textContent=c.rows.length;let box=document.getElementById('rowCfg');box.innerHTML='';c.rows.forEach((groups,r)=>{let total=rowTables(groups),d=document.createElement('div');d.className='rowcfg';let top=document.createElement('div');top.className='rowcfgtop';let label=document.createElement('b');label.textContent='Rang '+(r+1);let step=document.createElement('div');step.className='step';let minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>changeTables(r,-1);let span=document.createElement('span');span.textContent=total+' table'+(total>1?'s':'');span.style.minWidth='58px';let plus=document.createElement('button');plus.textContent='＋';plus.onclick=()=>changeTables(r,1);step.append(minus,span,plus);top.append(label,step);let dr=document.createElement('div');dr.className='distrow';let dl=document.createElement('span');dl.textContent='Répartition';let input=document.createElement('input');input.className='dist';input.value=groups.join('-');input.placeholder='ex. 3-2-3';input.onchange=()=>applyDistribution(r,input.value,input);dr.append(dl,input);d.append(top,dr);box.appendChild(d)});let ob=document.getElementById('objButtons');ob.innerHTML='';[['tableau','Tableau'],['bureau','Bureau']].forEach(([id,label])=>{let o=c.landmarks[id],b=document.createElement('button');b.className=o.visible?'ob':'pb';b.textContent=o.visible?label+' présent':'＋ Ajouter '+label;b.onclick=()=>{snap();o.visible=!o.visible;if(o.visible){o.slot=0;o.align=id==='tableau'?'center':'right'}save();render()};ob.appendChild(b)});let leg=document.getElementById('statusLegend');leg.innerHTML='';TAGS.forEach(([tag,label])=>{let item=document.createElement('div');item.className='legenditem';let b=document.createElement('span');b.className='tagb on';b.dataset.tag=tag;b.innerHTML=SVG[tag];let t=document.createElement('span');t.textContent=label;item.append(b,t);leg.appendChild(item)})}function applyDistribution(r,val,input){let parts=val.trim().split(/[-–—,\s]+/).filter(Boolean).map(Number);if(!parts.length||parts.some(x=>!Number.isInteger(x)||x<1||x>12)||parts.reduce((a,b)=>a+b,0)>16){input.value=C().rows[r].join('-');toast('Répartition invalide');return}snap();C().rows[r]=parts;norm();save();render()}function changeTables(r,delta){let row=C().rows[r];snap();if(delta>0)row[row.length-1]++;else{let total=rowTables(row);if(total<=1){H.pop();return}if(row[row.length-1]>1)row[row.length-1]--;else row.pop()}norm();save();render()}function changeRows(delta){let c=C(),n=c.rows.length+delta;if(n<1||n>12)return;snap();if(delta>0)c.rows.push([2]);else c.rows.pop();norm();save();render()}function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='plan')renderPlan();if(v==='students')renderStudents();if(v==='config')renderCfg()}function ask(title,value=''){return new Promise(res=>{resolver=res;document.getElementById('mt').textContent=title;let i=document.getElementById('mi');i.value=value;document.getElementById('modalbg').classList.add('on');setTimeout(()=>{i.focus();i.select()},120)})}function closeAsk(v){document.getElementById('modalbg').classList.remove('on');let r=resolver;resolver=null;if(r)r(v)}async function newClass(){let n=(await ask('Nom de la classe','Nouvelle classe'))?.trim();if(!n)return;let c={id:uid(),name:n,rows:INIT_ROWS.map(x=>[...x]),students:[],seats:new Array(INIT_ROWS.flat().reduce((a,b)=>a+b,0)*2).fill(null),landmarks:{tableau:{visible:true,slot:0,align:'center'},bureau:{visible:true,slot:0,align:'right'}}};snap();S.classes.push(c);S.cur=c.id;save();render()}async function renameClass(){let c=C(),n=(await ask('Renommer la classe',c.name))?.trim();if(!n)return;snap();c.name=n;save();render()}function duplicateClass(){let src=C(),c=JSON.parse(JSON.stringify(src));c.id=uid();c.name=src.name+' copie';c.students.forEach(s=>{let old=s.id;s.id=uid();c.seats=c.seats.map(x=>x===old?s.id:x)});snap();S.classes.push(c);S.cur=c.id;save();render()}function deleteClass(){if(S.classes.length<2)return;let c=C();if(!confirm('Supprimer la classe '+c.name+' ?'))return;snap();S.classes=S.classes.filter(x=>x.id!==c.id);S.cur=S.classes[0].id;save();render()}function mix(){let c=C();snap();let ids=c.students.map(s=>s.id);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}c.seats=c.seats.map((_,i)=>ids[i]||null);save();renderPlan()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showView(b.dataset.v));document.getElementById('classSel').onchange=e=>{S.cur=e.target.value;pick=null;save();render()};document.getElementById('newC').onclick=newClass;document.getElementById('dupC').onclick=duplicateClass;document.getElementById('renC').onclick=renameClass;document.getElementById('delC').onclick=deleteClass;document.getElementById('newBoy').onclick=()=>setNewGender('boy');document.getElementById('newGirl').onclick=()=>setNewGender('girl');document.getElementById('addS').onclick=addStudent;document.getElementById('newS').onkeydown=e=>{if(e.key==='Enter')addStudent()};document.getElementById('rmRow').onclick=()=>changeRows(-1);document.getElementById('addRow').onclick=()=>changeRows(1);document.getElementById('mix').onclick=mix;document.getElementById('undo').onclick=()=>{if(!H.length)return;F.push(JSON.stringify(S));restore(H.pop())};document.getElementById('redo').onclick=()=>{if(!F.length)return;H.push(JSON.stringify(S));restore(F.pop())};document.getElementById('mc').onclick=()=>closeAsk(null);document.getElementById('mo').onclick=()=>closeAsk(document.getElementById('mi').value);document.getElementById('mi').onkeydown=e=>{if(e.key==='Enter')closeAsk(e.target.value)};document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeAsk(null)};render();
