<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Plan de classe</title><style>
:root{--g:#0b8977;--gd:#087163;--bg:#f5f7f8;--ink:#17212b;--mut:#6f7882;--line:#d8dfe3;--table:#eee8da;--tl:#c9b991}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}#app{height:100%;display:flex;flex-direction:column;min-height:0}.top{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:7px 9px}.brand{display:flex;align-items:center;gap:8px}.brand img{width:38px;height:38px;border-radius:11px}.bt{font-size:20px;font-weight:850;line-height:1}.bs{font-size:10px;color:var(--mut);margin-top:3px}.classbar{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,41px);gap:5px;margin-top:6px}.selwrap{position:relative}.selwrap small{position:absolute;left:9px;top:4px;color:var(--mut);font-size:8px}.sel{width:100%;height:41px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 7px 2px;font-weight:800}.ib{height:41px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:20px;font-weight:800}.del{color:#b3261e}.tabs{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:5px;margin-top:6px}.tab{height:31px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:10px;font-weight:750}.tab.on{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:var(--g)}.main{flex:1;min-height:0;overflow:hidden;padding:5px 6px}.view{display:none;height:100%;min-height:0}.view.on{display:flex;flex-direction:column}.card{background:#fff;border:1px solid var(--line);border-radius:14px}.plan{height:100%;padding:4px;display:flex;flex-direction:column;min-height:0}.room{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.board{align-self:center;width:51%;height:22px;min-height:22px;border-radius:4px;background:linear-gradient(90deg,#2c6f62,#3c8a77);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}.teacher{align-self:center;margin:3px 0 2px;padding:1px 12px;border:1px solid #cbbb98;border-radius:6px;background:#f2ecdf;font-size:9px;text-align:center}.rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:2px}.row{flex:1;min-height:0;display:grid;grid-template-columns:17px minmax(0,1fr);gap:3px;align-items:center}.rn{width:16px;height:16px;border-radius:50%;background:#e6ecef;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center}.tables{display:grid;gap:3px;min-width:0;height:86%;align-items:stretch}.desk{min-width:0;background:var(--table);border:1px solid var(--tl);border-radius:6px;padding:2px;display:grid;gap:2px;height:100%}.seat{min-width:0;min-height:18px;border:1px solid #bcc7cc;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;padding:1px;font-size:clamp(7px,2.4vw,10px);font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;user-select:none}.seat.empty{color:#a4abb0;font-weight:500}.seat.pick{outline:2px solid #d7a106;background:#fff6d8}.seat.src{opacity:.35}.seat.target{outline:2px solid var(--g);background:#e2f7f2}.tools{display:flex;justify-content:space-between;gap:4px;margin-top:3px}.grp{display:flex;gap:4px}.b{height:27px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 7px;font-size:9px;font-weight:750}.b.pri{background:var(--g);color:#fff;border-color:var(--g)}.b:disabled{opacity:.4}.hint{margin-top:3px;padding:3px 5px;border-radius:8px;background:#e6f8f4;color:#35665e;text-align:center;font-size:8px}.scroll{overflow:auto;padding-bottom:6px}.section{padding:9px;margin-bottom:6px}.section h2{font-size:14px;margin:0 0 6px}.section p{font-size:10px;color:var(--mut);margin:3px 0 7px}.form{display:flex;gap:5px;margin:5px 0}.inp{flex:1;min-width:0;height:35px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 9px}.pb,.ob{height:35px;border-radius:9px;font-weight:750;padding:0 10px}.pb{border:0;background:var(--g);color:#fff}.ob{border:1px solid var(--line);background:#fff}.students{display:grid;grid-template-columns:1fr 1fr;gap:4px}.stu{display:flex;gap:2px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px}.stu input{flex:1;min-width:0;border:0;outline:0;font-size:11px;font-weight:700}.x{border:0;background:transparent;color:#b3261e;font-size:14px}.cfg{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid #edf0f2;font-size:11px}.step{display:flex;align-items:center;gap:5px}.step button{width:27px;height:27px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:900}.step span{min-width:25px;text-align:center;font-weight:850}.rowcfg{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:center;padding:5px 0;border-top:1px solid #edf0f2;font-size:11px}.foot{flex:0 0 42px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}.nav{border:0;background:transparent;font-size:9px;color:#55616a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.nav span:first-child{font-size:17px;line-height:16px}.nav.on{color:#064239;font-weight:800;background:linear-gradient(180deg,transparent 0 62%,#dcf5ef 62%)}.modalbg{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:1000}.modalbg.on{display:flex}.modal{width:100%;background:#fff;border-radius:17px 17px 0 0;padding:13px 13px 17px}.modal h3{font-size:15px;margin:0 0 8px}.mb{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.ghost{position:fixed;z-index:2000;display:none;pointer-events:none;transform:translate(-50%,-50%);padding:5px 8px;border:2px solid var(--g);border-radius:7px;background:#fff;font-size:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:49px;transform:translateX(-50%);background:#17212b;color:#fff;border-radius:15px;padding:6px 10px;font-size:10px;opacity:0;z-index:3000}.toast.on{opacity:1}@media(max-height:680px){.top{padding:4px 7px}.brand img{width:31px;height:31px}.bt{font-size:17px}.bs{display:none}.classbar{margin-top:4px}.sel,.ib{height:36px}.tabs{margin-top:4px}.tab{height:27px}.teacher,.hint{display:none}.foot{height:36px;flex-basis:36px}.main{padding-top:3px}.b{height:24px}.board{height:19px;min-height:19px}.seat{min-height:15px}}
</style></head><body><div id="app"><header class="top"><div class="brand"><img src="app_icon.png"><div><div class="bt">Plan de classe</div><div class="bs">Simple • Flexible • Plusieurs classes</div></div></div><div class="classbar"><div class="selwrap"><small>Classe</small><select id="classSel" class="sel"></select></div><button id="newC" class="ib">＋</button><button id="dupC" class="ib">⧉</button><button id="renC" class="ib">✎</button><button id="delC" class="ib del">⌫</button></div><div class="tabs"><button class="tab on" data-v="plan">▰ Plan</button><button class="tab" data-v="students">👥 Élèves</button><button class="tab" data-v="config">⚙ Disposition</button></div></header><main class="main"><section id="v-plan" class="view on"><div class="card plan"><div class="room"><div class="board">Tableau</div><div class="teacher">Bureau<br>Prof</div><div id="rows" class="rows"></div></div><div class="tools"><div class="grp"><button id="addSeat" class="b pri">＋ Place</button><button id="subSeat" class="b">− Place</button></div><div class="grp"><button id="undo" class="b">↶</button><button id="redo" class="b">↷</button><button id="mix" class="b">Mélanger</button></div></div><div class="hint">Glisse un élève ou touche deux places pour les échanger.</div></div></section><section id="v-students" class="view scroll"><div class="card section"><h2>Élèves — <span id="cname"></span></h2><div class="form"><input id="newS" class="inp" placeholder="Prénom"><button id="addS" class="pb">Ajouter</button></div><div id="students" class="students"></div></div></section><section id="v-config" class="view scroll"><div class="card section"><h2>Disposition</h2><p>Choisis le nombre de rangées et le nombre de places de chaque rangée. Les places sont regroupées deux par deux en tables.</p><div class="cfg"><b>Rangées</b><div class="step"><button id="rmRow">−</button><span id="rowN"></span><button id="addRow">＋</button></div></div><div id="rowCfg"></div><div class="form"><button class="ob" data-u="4">4 partout</button><button class="ob" data-u="6">6 partout</button><button class="ob" data-u="8">8 partout</button></div></div><div class="card section"><h2>Places</h2><div class="form"><button id="cfgAdd" class="pb">＋ Ajouter une place</button><button id="cfgSub" class="ob">− Retirer</button></div></div></section></main><footer class="foot"><button class="nav on" data-v="plan"><span>⌂</span>Plan</button><button class="nav" data-v="students"><span>👥</span>Classes</button><button class="nav" data-v="config"><span>⚙</span>Disposition</button></footer></div><div id="ghost" class="ghost"></div><div id="toast" class="toast"></div><div id="modalbg" class="modalbg"><div class="modal"><h3 id="mt"></h3><input id="mi" class="inp" style="width:100%"><div class="mb"><button id="mc" class="ob">Annuler</button><button id="mo" class="pb">Valider</button></div></div></div><script>
const N=["Seynabou","Victoire","Tristan","Victor","Ermin","Manuela","Théo","Naim","Léon","Louay","Aurélian","Lina","Arthur","","Adam","Lamine","Zoé","Azra","Roufaida","Mathilde","Anaïs","Hidaya","Matias","","Elynna","Evan","","Timéo","Mila","Janna","","Maëlys","Nina","Rosie","Abigail","Redouane"],R=[4,4,4,4,4,8,8],KEY='plan-classe-v2';let S=load(),pick=null,drag=null,H=[],F=[],resolver=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.classes?.length)return x}catch(e){}return{cur:'a',classes:[{id:'a',name:'3G34 ALL',shape:[...R],seats:[...N]}]}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function C(){return S.classes.find(x=>x.id===S.cur)||S.classes[0]}function cap(c=C()){return c.shape.reduce((a,b)=>a+b,0)}function norm(c=C()){while(c.seats.length<cap(c))c.seats.push('');if(c.seats.length>cap(c)){let z=c.seats.splice(cap(c)).filter(Boolean);z.forEach(n=>{let i=c.seats.indexOf('');if(i<0){c.shape[c.shape.length-1]++;c.seats.push(n)}else c.seats[i]=n})}}function snap(){H.push(JSON.stringify(S));if(H.length>40)H.shift();F=[]}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1200)}
function renderClasses(){let s=document.getElementById('classSel');s.innerHTML='';S.classes.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;s.appendChild(o)});s.value=S.cur;document.getElementById('delC').disabled=S.classes.length<2}function renderPlan(){let c=C();norm(c);let box=document.getElementById('rows');box.innerHTML='';let k=0;c.shape.forEach((n,r)=>{let row=document.createElement('div');row.className='row';let rn=document.createElement('div');rn.className='rn';rn.textContent=r+1;let tables=document.createElement('div');tables.className='tables';let tn=Math.ceil(n/2);tables.style.gridTemplateColumns=`repeat(${tn},minmax(0,1fr))`;for(let t=0;t<tn;t++){let d=document.createElement('div');d.className='desk';let q=Math.min(2,n-t*2);d.style.gridTemplateColumns=`repeat(${q},minmax(0,1fr))`;for(let j=0;j<q;j++){let i=k++,e=document.createElement('div');e.className='seat'+(c.seats[i]?'':' empty')+(pick===i?' pick':'');e.dataset.i=i;e.textContent=c.seats[i]||'Libre';e.title=e.textContent;e.onpointerdown=pd;e.onclick=clickSeat;d.appendChild(e)}tables.appendChild(d)}row.append(rn,tables);box.appendChild(row)});document.getElementById('undo').disabled=!H.length;document.getElementById('redo').disabled=!F.length}function renderStudents(){let c=C();document.getElementById('cname').textContent=c.name;let box=document.getElementById('students');box.innerHTML='';[...new Set(c.seats.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(n=>{let d=document.createElement('div');d.className='stu';let i=document.createElement('input');i.value=n;i.onchange=()=>{let v=i.value.trim();if(!v)return delStudent(n);snap();c.seats=c.seats.map(x=>x===n?v:x);save();render()};let x=document.createElement('button');x.className='x';x.textContent='⌫';x.onclick=()=>delStudent(n);d.append(i,x);box.appendChild(d)})}function renderCfg(){let c=C();document.getElementById('rowN').textContent=c.shape.length;let box=document.getElementById('rowCfg');box.innerHTML='';c.shape.forEach((n,r)=>{let d=document.createElement('div');d.className='rowcfg';d.innerHTML=`<b>Rang ${r+1}</b><span>${n} place${n>1?'s':''}</span>`;let s=document.createElement('div');s.className='step';let m=document.createElement('button');m.textContent='−';m.onclick=()=>rowSeats(r,-1);let v=document.createElement('span');v.textContent=n;let p=document.createElement('button');p.textContent='＋';p.onclick=()=>rowSeats(r,1);s.append(m,v,p);d.appendChild(s);box.appendChild(d)})}function render(){renderClasses();renderPlan();renderStudents();renderCfg();save()}
function swap(a,b){snap();let c=C();[c.seats[a],c.seats[b]]=[c.seats[b],c.seats[a]];pick=null;render()}function clickSeat(e){if(drag?.moved)return;let i=+e.currentTarget.dataset.i;if(pick==null){pick=i;renderPlan()}else if(pick===i){pick=null;renderPlan()}else swap(pick,i)}function pd(e){drag={i:+e.currentTarget.dataset.i,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,to:null};e.currentTarget.setPointerCapture?.(e.pointerId);e.currentTarget.onpointermove=pm;e.currentTarget.onpointerup=pu;e.currentTarget.onpointercancel=pu}function pm(e){if(!drag||e.pointerId!==drag.id)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;drag.moved=true;e.preventDefault();document.querySelector(`[data-i="${drag.i}"]`)?.classList.add('src');let g=document.getElementById('ghost');g.style.display='block';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.textContent=C().seats[drag.i]||'Libre';document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));let z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.seat');drag.to=z?+z.dataset.i:null;if(z&&drag.to!==drag.i)z.classList.add('target')}function pu(e){let d=drag;if(!d)return;document.getElementById('ghost').style.display='none';document.querySelectorAll('.seat').forEach(x=>x.classList.remove('src','target'));drag=null;if(d.moved&&d.to!=null&&d.to!==d.i)swap(d.i,d.to)}
function addStudent(){let i=document.getElementById('newS'),n=i.value.trim(),c=C();if(!n)return;if(c.seats.includes(n))return toast('Ce prénom existe déjà');snap();let p=c.seats.indexOf('');if(p<0){c.shape[c.shape.length-1]++;c.seats.push('');p=c.seats.length-1}c.seats[p]=n;i.value='';render()}function delStudent(n){snap();let c=C();c.seats=c.seats.map(x=>x===n?'':x);render()}function rowSeats(r,d){let c=C(),n=c.shape[r]+d;if(n<1||n>12)return;let start=c.shape.slice(0,r).reduce((a,b)=>a+b,0),end=start+c.shape[r];if(d<0){let ix=end-1;if(c.seats[ix]){let e=c.seats.findIndex((x,k)=>!x&&k!==ix);if(e<0)return toast('Déplace cet élève avant');snap();c.seats[e]=c.seats[ix]}else snap();c.seats.splice(ix,1);c.shape[r]--}else{snap();c.seats.splice(end,0,'');c.shape[r]++}render()}function rows(d){let c=C();if(d>0){snap();let n=c.shape.at(-1)||4;c.shape.push(n);for(let i=0;i<n;i++)c.seats.push('')}else{if(c.shape.length<2)return;let n=c.shape.at(-1),p=c.seats.length-n;if(c.seats.slice(p).some(Boolean))return toast('Dernière rangée occupée');snap();c.shape.pop();c.seats.splice(p,n)}render()}function addSeat(){snap();let c=C();c.shape[c.shape.length-1]++;c.seats.push('');render()}function subSeat(){let c=C();if(c.seats.at(-1))return toast('Dernière place occupée');if(c.shape.at(-1)<=1){if(c.shape.length<2)return;snap();c.shape.pop();c.seats.pop()}else{snap();c.shape[c.shape.length-1]--;c.seats.pop()}render()}function uniform(n){let c=C(),names=c.seats.filter(Boolean),total=c.shape.length*n;if(names.length>total)return toast('Pas assez de places');snap();c.shape=c.shape.map(()=>n);c.seats=[...names];while(c.seats.length<total)c.seats.push('');render()}function mix(){snap();let c=C(),a=c.seats.filter(Boolean);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}c.seats=new Array(cap(c)).fill('');a.forEach((n,i)=>c.seats[i]=n);pick=null;render()}function undo(){if(!H.length)return;F.push(JSON.stringify(S));S=JSON.parse(H.pop());render()}function redo(){if(!F.length)return;H.push(JSON.stringify(S));S=JSON.parse(F.pop());render()}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('.tab,.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='plan')renderPlan()}function ask(t,v=''){return new Promise(res=>{resolver=res;document.getElementById('mt').textContent=t;let i=document.getElementById('mi');i.value=v;document.getElementById('modalbg').classList.add('on');setTimeout(()=>{i.focus();i.select()},50)})}function close(v){document.getElementById('modalbg').classList.remove('on');if(resolver){let r=resolver;resolver=null;r(v)}}async function newClass(){let n=(await ask('Nom de la nouvelle classe','Nouvelle classe'))?.trim();if(!n)return;snap();let id='c'+Date.now();S.classes.push({id,name:n,shape:[4,4,4,4,4,4],seats:new Array(24).fill('')});S.cur=id;render();show('plan')}function dup(){snap();let c=C(),id='c'+Date.now();S.classes.push({id,name:c.name+' copie',shape:[...c.shape],seats:[...c.seats]});S.cur=id;render()}async function ren(){let c=C(),n=(await ask('Renommer la classe',c.name))?.trim();if(n){snap();c.name=n;render()}}async function del(){if(S.classes.length<2)return;let c=C(),v=(await ask('Tape SUPPRIMER pour confirmer',''))?.trim().toUpperCase();if(v!=='SUPPRIMER')return;snap();S.classes=S.classes.filter(x=>x.id!==c.id);S.cur=S.classes[0].id;render()}
classSel.onchange=e=>{S.cur=e.target.value;pick=null;render()};newC.onclick=newClass;dupC.onclick=dup;renC.onclick=ren;delC.onclick=del;document.querySelectorAll('.tab,.nav').forEach(b=>b.onclick=()=>show(b.dataset.v));addSeat.onclick=cfgAdd.onclick=addSeat;subSeat.onclick=cfgSub.onclick=subSeat;undo.onclick=undo;redo.onclick=redo;mix.onclick=mix;addS.onclick=addStudent;newS.onkeydown=e=>{if(e.key==='Enter')addStudent()};rmRow.onclick=()=>rows(-1);addRow.onclick=()=>rows(1);document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>uniform(+b.dataset.u));mc.onclick=()=>close(null);mo.onclick=()=>close(mi.value);mi.onkeydown=e=>{if(e.key==='Enter')close(e.target.value)};render();
</script></body></html>
