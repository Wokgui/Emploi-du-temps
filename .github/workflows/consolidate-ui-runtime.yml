name: Consolidate UI runtime modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-ui-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-ui-runtime
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1

      - name: Consolidate UI source
        run: python3 .github/scripts/consolidate_ui_runtime.py

      - name: Validate clean semantic source
        working-directory: android-widget
        run: gradle clean :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Remove one-shot migration files
        run: rm -f .github/workflows/consolidate-ui-runtime.yml .github/scripts/consolidate_ui_runtime.py

      - name: Commit semantic runtime consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate UI runtime into semantic modules 6.30 [skip ci]"
          git push

      - name: Rename validated APK
        run: cp android-widget/app/build/outputs/apk/debug/app-debug.apk android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk --clobber
