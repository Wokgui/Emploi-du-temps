name: Consolidate Android timetable architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-widget-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1

      - name: Materialize all build-time patches
        working-directory: android-widget
        run: gradle :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Consolidate generated source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('android-widget')
          app = root / 'app'
          main_path = app / 'src/main/java/com/wokgui/schedulewidget/MainActivity.java'
          main = main_path.read_text(encoding='utf-8')

          pat = re.compile(r"    private void injectPersonalizationUi\(\) \{.*?\n    \}\n\n(?=    private )", re.S)
          match = pat.search(main)
          if not match:
              raise SystemExit('injectPersonalizationUi block not found after patch materialization')
          block = match.group(0)
          names = []
          for name in re.findall(r'([A-Za-z0-9_]+Ui)\.script\(\)', block):
              if name not in names and name != 'UiRuntimeBundle':
                  names.append(name)
          if not names:
              raise SystemExit('No UI scripts found in final injection chain')

          bundle_path = app / 'src/main/java/com/wokgui/schedulewidget/UiRuntimeBundle.java'
          bundle_lines = [
              'package com.wokgui.schedulewidget;',
              '',
              '/** Single ordered bundle for all WebView UI layers. Generated from the last verified',
              ' * runtime order so Android performs one JS bridge call instead of a callback chain. */',
              'final class UiRuntimeBundle {',
              '    private UiRuntimeBundle() {}',
              '',
              '    static String script() {',
              '        StringBuilder out = new StringBuilder(384 * 1024);',
          ]
          for name in names:
              bundle_lines.append(f"        out.append({name}.script()).append('\\n');")
          bundle_lines += [
              '        return out.toString();',
              '    }',
              '}',
              ''
          ]
          bundle_path.write_text('\n'.join(bundle_lines), encoding='utf-8')

          has_reveal = 'revealWebViewStable(' in main
          callback = '''                    primeWeekBadge();\n                    if (forceWeekOpening) settleWeekAndReveal();'''
          if has_reveal:
              callback += '''\n                    else revealWebViewStable();'''
          new_block = '''    private void injectPersonalizationUi() {
              if (webView == null) return;
              webView.evaluateJavascript(
                      "(function(){if(window.__settingsV3&&!document.getElementById('settingsBtn')){var m=document.getElementById('settingsModal');if(m)m.remove();window.__settingsV3=false;}})();",
                      ignored -> webView.evaluateJavascript(UiRuntimeBundle.script(), value -> {
          ''' + callback + '''
                      })
              );
          }

          '''
          main = main[:match.start()] + new_block + main[match.end():]

          main = re.sub(r"\n    private void injectBulkUi\(\) \{.*?\n    \}\n\n(?=    private void injectPersonalizationUi)", "\n", main, flags=re.S)
          main_path.write_text(main, encoding='utf-8')

          for p in app.joinpath('src').rglob('*'):
              if p.suffix not in {'.java', '.html', '.xml'} or not p.is_file():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r"const APP_VERSION='6\.[0-9]+';", "const APP_VERSION='6.26';", s)
              s = re.sub(r"Version 6\.[0-9]+", "Version 6.26", s)
              p.write_text(s, encoding='utf-8')

          (app / 'build.gradle').write_text('''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wokgui.schedulewidget'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.wokgui.schedulewidget'
                  minSdk 26
                  targetSdk 35
                  versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 101
                  versionName '6.26'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          ''', encoding='utf-8')

          for p in app.glob('fixes*.gradle'):
              p.unlink()
          patch = app / 'patches.gradle'
          if patch.exists():
              patch.unlink()

          one_shot = Path('.github/workflows/consolidate-android.yml')
          if one_shot.exists():
              one_shot.unlink()

          print('Bundled UI layers:', ', '.join(names))
          PY

      - name: Validate clean source without patches
        working-directory: android-widget
        run: gradle clean :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Commit consolidated architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Android timetable architecture 6.26 [skip ci]"
          git push

      - name: Rename clean APK
        working-directory: android-widget
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/emploi-du-temps-widget.apk

      - name: Upload clean APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

      - name: Publish clean stable APK
        working-directory: android-widget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest app/build/outputs/apk/debug/emploi-du-temps-widget.apk --clobber
