name: Build and validate Android timetable

on:
  push:
    branches: [refactor/ui-single-owner-679]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
concurrency:
  group: android-widget-${{ github.ref_name }}-v19
  cancel-in-progress: true
permissions: {contents: read}

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: bash android-widget/ci/run_browser_679.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: android-widget}}
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android command-line tools
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify 7.71 debug build
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='771001' versionName='7.71'" app/build/outputs/apk/debug/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-debug-apk-not-for-updates
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
