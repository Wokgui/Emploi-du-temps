name: Build and validate Android timetable

on:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

concurrency:
  group: android-widget-main-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1
      - name: Clean build
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify install version and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='634001' versionName='6.34'" app/build/outputs/apk/debug/badging.txt
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/emploi-du-temps-widget.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: smoke-apk
      - name: Exercise app and production widget rows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r smoke-apk/emploi-du-temps-widget.apk
            adb shell wm size 1080x1920
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb logcat -c

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode edit > smoke/launch-edit.txt
            sleep 5
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode edit >/dev/null
            sleep 1
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-edit.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-edit.txt
            adb exec-out screencap -p > smoke/01-edit.png
            adb logcat -d > smoke/logcat-edit-full.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget|Uncaught (SyntaxError|ReferenceError)" smoke/logcat-edit-full.txt

            adb shell input tap 1010 145
            sleep 2
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb exec-out screencap -p > smoke/02-settings.png
            adb logcat -d > smoke/logcat-settings.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget|Uncaught (SyntaxError|ReferenceError)" smoke/logcat-settings.txt

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today > smoke/launch-today.txt
            sleep 5
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today >/dev/null
            sleep 1
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-today.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-today.txt
            adb exec-out screencap -p > smoke/03-today.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode week > smoke/launch-week.txt
            sleep 5
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode week >/dev/null
            sleep 1
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-week.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-week.txt
            adb exec-out screencap -p > smoke/04-week.png

            # Render the exact production row RemoteViews through the debug preview.
            # Compact = two course rows only. Expanded = all course/break rows, scrollable.
            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 108 --ei width_dp 350 > smoke/launch-widget-small.txt
            sleep 5
            adb shell uiautomator dump /sdcard/widget-small.xml >/dev/null
            adb pull /sdcard/widget-small.xml smoke/widget-small.xml >/dev/null
            grep -Fq "3G1 ALL" smoke/widget-small.xml
            grep -Fq "3G3 ALL" smoke/widget-small.xml
            ! grep -Fq "Midi" smoke/widget-small.xml
            ! grep -Fq "Trou" smoke/widget-small.xml
            ! grep -Fq "Widget preview error" smoke/widget-small.xml
            adb exec-out screencap -p > smoke/05-widget-small.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 486 --ei width_dp 350 > smoke/launch-widget-expanded.txt
            sleep 5
            adb shell uiautomator dump /sdcard/widget-expanded.xml >/dev/null
            adb pull /sdcard/widget-expanded.xml smoke/widget-expanded.xml >/dev/null
            grep -Fq "Midi" smoke/widget-expanded.xml
            grep -Fq "Trou" smoke/widget-expanded.xml
            ! grep -Fq "Widget preview error" smoke/widget-expanded.xml
            adb exec-out screencap -p > smoke/06-widget-expanded.png

            adb logcat -d > smoke/logcat-full.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget|Uncaught (SyntaxError|ReferenceError)" smoke/logcat-full.txt
      - name: Upload smoke-test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshots
          path: smoke/
          if-no-files-found: ignore

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: release-apk
      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest release-apk/emploi-du-temps-widget.apk --clobber
