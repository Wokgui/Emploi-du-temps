          if not effects or any(x.get('transition') not in ('0s','0ms') or x.get('animation') not in ('none','') or x.get('opacity')!='1' for x in effects): raise SystemExit(f'accordion title press effects still active: {effects}')
          # 7.43: the holiday-row gap is validated below together with the other three
          # vacation spacings; the previous <=8px rule is obsolete.
          if int(report.get('_settingsSlotRows',-1)) != int(report.get('_settingsSlotExpected',-2)) or int(report.get('_settingsSlotRows',0))<1: raise SystemExit(f'class-time rows are missing in settings: rows={report.get("_settingsSlotRows")} expected={report.get("_settingsSlotExpected")}')
          def centered_select(name,obj,require_arrow=True):
              if not obj: raise SystemExit(f'{name} missing')
              if abs(float(obj.get('paddingLeft',999))-float(obj.get('paddingRight',0)))>0.5: raise SystemExit(f'{name} padding is asymmetric: {obj}')
              if obj.get('textAlign')!='center': raise SystemExit(f'{name} text is not centered: {obj}')
              if require_arrow and obj.get('backgroundImage') in ('none',''): raise SystemExit(f'{name} has no visible dropdown arrow: {obj}')
          s745=report.get('_settings745') or {}
          if s745.get('error'): raise SystemExit(f'7.47 settings measurement error: {s745}')
          if s745.get('attached')!='1': raise SystemExit(f'7.47 final settings owner is not active: {s745}')
          if s745.get('rangeFrom')!='Du' or s745.get('rangeTo')!='Au': raise SystemExit(f'Du/Au labels are missing: {s745}')
          if s745.get('profileText')!='Principal' or abs(float(s745.get('profileCenterDelta',999)))>0.5 or not s745.get('profileFits') or float(s745.get('profileShellWidth',0))<170: raise SystemExit(f'Principal is not stably centered/untruncated: {s745}')
          if int(s745.get('profileVisualCount',0))!=1 or int(s745.get('profileArrowCount',0))!=1 or not s745.get('profileArrowVisible'): raise SystemExit(f'profile custom control is duplicated or its arrow is missing: {s745}')
          if abs(float(s745.get('profileUnderTitleDelta',999)))>0.5: raise SystemExit(f'profile selector is not centered under Profils: {s745}')
          if s745.get('version')!='Version 7.47' or not s745.get('versionBelowClose'): raise SystemExit(f'app version is not below Fermer: {s745}')
          if float(s745.get('appFontBorderBottom',999))>0.1 or float(s745.get('widgetFontBorderTop',999))>0.1: raise SystemExit(f'text-size separator still visible: {s745}')
          if abs(float(s745.get('appFontGap',999))-float(s745.get('widgetFontGap',-999)))>0.5: raise SystemExit(f'app/widget text-size title-to-slider spacing differs: {s745}')
          if float(s745.get('schoolRightOverflow',999))>0.5 or float(s745.get('schoolLeftOverflow',999))>0.5: raise SystemExit(f'vacation auto row overflows advanced settings: {s745}')
          if float(s745.get('midiTitleGap',-999)) + 1 < float(s745.get('breakTitleGap',999)): raise SystemExit(f'Midi par jour title gap is still smaller than break-name reference: {s745}')
          if float(s745.get('widgetDensityGap',-999)) < 20: raise SystemExit(f'Affichage du widget / Condensation gap is still too small: {s745}')
          if int(s745.get('zoneShellCount',0))!=1 or int(s745.get('zoneArrowCount',0))!=1 or int(s745.get('holidayArrowCount',0))!=1: raise SystemExit(f'vacation/holiday custom selector structure is invalid: {s745}')
          if abs(float(s745.get('zoneVisualCenterDelta',999)))>0.5 or abs(float(s745.get('holidayVisualCenterDelta',999)))>0.5: raise SystemExit(f'vacation/holiday selector text is not independently centered from the arrow: {s745}')

          ia745=(report.get('_instantAdvanced') or {})
          if ia745.get('final745')!='1': raise SystemExit(f'advanced panel was not finalized by 7.47 before open: {ia745}')
          before745=ia745.get('afterLegacy745') or {}
          after745=ia745.get('afterFinal745') or {}
          for k in ('profileLeft','profileWidth','rangeLeft','rangeWidth'):
              if abs(float(before745.get(k,999))-float(after745.get(k,-999)))>0.5: raise SystemExit(f'advanced 7.47 geometry still changes after final refresh: {k} {before745} -> {after745}')
          for k in ('profileText','from','to'):
              if before745.get(k)!=after745.get(k): raise SystemExit(f'advanced 7.47 content still changes after final refresh: {k} {before745} -> {after745}')

          gaps=report.get('_displayGaps') or {}
          if abs(float(gaps.get('base',999))-float(gaps.get('interruptions',-999)))>1.0:
              raise SystemExit(f'Affichage de base gap does not match interruptions: {gaps}')
          gear=report.get('_gear742') or {}
          if not gear.get('svg') or not gear.get('gradient') or not gear.get('shadow') or float(gear.get('width',0))<19 or gear.get('background') not in ('none',''):
              raise SystemExit(f'realistic first-frame settings gear invalid: {gear}')
          centered_select('language',report.get('_languageSelect') or {})
          if float((report.get('_languageSelect') or {}).get('width',999))>150: raise SystemExit(f'language selector is too wide for Français: {report.get("_languageSelect")}')
          cat=report.get('_languageCatalog')
          if cat:
              centered_select('download-language selector',cat)
          centered_select('reminder minutes',report.get('_reminderSelect') or {})
          centered_select('school zone',report.get('_zoneSelect') or {})
          centered_select('widget top mode',report.get('_widgetTopSelect') or {})
          centered_select('widget bottom mode',report.get('_widgetBottomSelect') or {})
          vacation=report.get('_vacationSpacing743') or {}
          if not (2 <= float(vacation.get('autoToHint',999)) <= 10): raise SystemExit(f'vacation hint is not close enough to auto row: {vacation}')
          if not (10 <= float(vacation.get('hintToUpdate',-999)) <= 20): raise SystemExit(f'vacation hint/update spacing is wrong: {vacation}')
          if not (8 <= float(vacation.get('updateToStatus',-999)) <= 18): raise SystemExit(f'update/status spacing is wrong: {vacation}')
          if not (12 <= float(vacation.get('statusToHolidays',999)) <= 32): raise SystemExit(f'status/automatic-holidays gap is not compact enough: {vacation}')
          if abs(float(report.get('_reminderCenterDelta',999)))>1.0: raise SystemExit(f'reminder group is not centered: delta={report.get("_reminderCenterDelta")} width={report.get("_reminderWidth")}')
          midi=report.get('_midiTime') or {}
          if abs(float(midi.get('paddingLeft',999))-float(midi.get('paddingRight',0)))>0.5 or midi.get('textAlign')!='center' or not midi.get('overlay') or abs(float(midi.get('centerDelta',999)))>0.5: raise SystemExit(f'lunch time field is not independently centered: {midi}')
          rf=report.get('_rangeFit') or {}
          if float(rf.get('rightOverflow',999))>0.5 or float(rf.get('leftOverflow',999))>0.5: raise SystemExit(f'day-off date row overflows horizontally: {rf}')
          slot=report.get('_slotDelete') or {}
          if slot.get('after') != slot.get('before',0)-1: raise SystemExit(f'slot delete did not remove exactly one row: {slot}')
          if slot.get('slotLength') != slot.get('after'): raise SystemExit(f'slot array and rendered rows differ after deletion: {slot}')
          if slot.get('uniqueTimes') != slot.get('totalTimes'): raise SystemExit(f'slot delete produced duplicated time rows: {slot}')
          # The deleted slot may still appear as a custom-time row when a preserved course uses its former hours.
          # That is intentional: deleting an hour must not delete or hide its courses.
          if not slot.get('courseExistsBefore'): raise SystemExit(f'slot-preservation test did not start with a course: {slot}')
          if not slot.get('courseStillExists'): raise SystemExit(f'course from deleted slot was incorrectly deleted: {slot}')
          h=float(report.get('_rangeDateHeight',999))
          if h>28.5: raise SystemExit(f'date fields are not compact enough: height={h}px')
          if report.get('_rangeDateBackground') not in ('rgb(255, 255, 255)','rgba(255, 255, 255, 1)'): raise SystemExit(f'date fields are not white: {report.get("_rangeDateBackground")}')
          pads=report.get('_rangeDatePadding') or [999,0]
          if abs(float(pads[0])-float(pads[1]))>0.5 or not report.get('_dateArrow'): raise SystemExit(f'date content is not symmetrically centered: padding={pads}, arrow={report.get("_dateArrow")}')
          if report.get('_widgetColorLabel')!='Couleur': raise SystemExit(f'widget color option label is wrong: {report.get("_widgetColorLabel")}')
          break_names=report.get('_breakNames') or []
          if not break_names or any(x.get('justify')!='center' or x.get('align')!='center' or x.get('textAlign')!='center' for x in break_names): raise SystemExit(f'break labels are not centered: {break_names}')
          required=['settingsLanguage698','settingsTypeWeek692','settingsText692','settingsColors692','settingsDisplay692']
          missing=[k for k in required if k not in report]
          if missing: raise SystemExit('missing visual sections: '+','.join(missing))
          heights=[float(report[k]['summaryHeight']) for k in required]
          top=[float(report[k]['topGap']) for k in required]
          bottom=[float(report[k]['bottomGap']) for k in required]
          closed=[float(report[k]['closedTopGap']) for k in required]
          errors=[float(report[k]['balanceError']) for k in required]
          if not all(abs(x-72.0)<=0.2 for x in heights): raise SystemExit(f'open summary height must remain 72px: {heights}')
          if not all(abs(a-b)<=0.5 for a,b in zip(top,closed)): raise SystemExit(f'title moved on open: open={top} closed={closed}')
          if not all(abs(x)<=3.0 for x in errors): raise SystemExit(f'top/bottom visual spacing not balanced: top={top} bottom={bottom} errors={errors}')
          print('VISUAL_BALANCE_OK',{'top':top,'bottom':bottom,'errors':errors,'heights':heights})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDT-visual-spacing-report
          path: |
            android-widget/build/visual/report.json
            android-widget/build/visual/settings.png
            android-widget/build/visual/advanced.png
            android-widget/build/visual/week.png
            android-widget/build/visual/dom.html
          if-no-files-found: error

      - name: Verify package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='747001' versionName='7.47'" /tmp/badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EDT-7.47-tested-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDT-7.47-tested
          path: android-widget/app/build/outputs/apk/debug/EDT-7.47-tested-debug.apk
          if-no-files-found: error
