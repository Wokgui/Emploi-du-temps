name: Clean Android 7.35 settings-stability-slots build

on:
  push:
    branches: [fix/735-settings-stability-slots]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-widget
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android command-line tools
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle clean :app:assembleDebug --stacktrace
      - name: Build real WebView runtime for visual test
        run: |
          set -euxo pipefail
          mkdir -p build/visual-src/com/wokgui/schedulewidget build/visual-classes build/visual
          cat > build/visual-src/com/wokgui/schedulewidget/BuildConfig.java <<'EOF'
          package com.wokgui.schedulewidget;
          final class BuildConfig { static final boolean DEBUG = false; }
          EOF
          cat > build/visual-src/com/wokgui/schedulewidget/DumpUiRuntime.java <<'EOF'
          package com.wokgui.schedulewidget;
          public final class DumpUiRuntime {
            public static void main(String[] args) { System.out.print(UiRuntimeBundle.script()); }
          }
          EOF
          python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('app/src/main/java/com/wokgui/schedulewidget')
          chunk=(root/'ChunkedUiScripts.java').read_text()
          names=set(re.findall(r'\b([A-Z][A-Za-z0-9]+)(?:\.class|\.script\(|\.prelude\()',chunk))
          names.update(['UiRuntimeBundle','ChunkedUiScripts','RuntimeRepair644','LegacyChainRepair651','ImportParserUi','ImportReviewUi'])
          paths=[]
          for name in sorted(names):
              p=root/(name+'.java')
              if p.exists(): paths.append(str(p))
              else: print('MISSING',name)
          pathlib.Path('build/visual/sources.txt').write_text('\n'.join(paths))
          print('\n'.join(paths))
          PY
          javac -encoding UTF-8 -d build/visual-classes             build/visual-src/com/wokgui/schedulewidget/BuildConfig.java             build/visual-src/com/wokgui/schedulewidget/DumpUiRuntime.java             $(cat build/visual/sources.txt)
          java -cp build/visual-classes com.wokgui.schedulewidget.DumpUiRuntime > build/visual/runtime.js

      - name: Render settings in headless Chrome and measure real visible gaps
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          runtime=Path('build/visual/runtime.js').read_text(encoding='utf-8').replace('</script>','<\\/script>')
          stub=r'''<script>
          window.AndroidSchedule=new Proxy({}, {get(t,p){const n=String(p);return (...a)=>{
            if(n==='loadSchedule')return JSON.stringify({_version:2,_slotConfigV2:true,_slots:[
              {n:1,start:'08:00',end:'09:00'},{n:2,start:'09:00',end:'10:00'},{n:3,start:'10:00',end:'11:00'},
              {n:4,start:'11:00',end:'12:00'},{n:5,start:'13:00',end:'14:00'},{n:6,start:'14:00',end:'15:00'},
              {n:7,start:'16:00',end:'17:00'},{n:8,start:'17:00',end:'18:00'},{n:9,start:'18:00',end:'19:00'}],
              _weeks:{A:{2:{courses:[{start:'10:00',end:'11:00',label:'Test A',room:'101',slot:3}]},3:{courses:[]},4:{courses:[]},5:{courses:[]},6:{courses:[]}},
                      B:{2:{courses:[{start:'10:00',end:'11:00',label:'Test B',room:'102',slot:3}]},3:{courses:[]},4:{courses:[]},5:{courses:[]},6:{courses:[]}}}});
            if(n==='loadAdvancedSettings')return JSON.stringify({singleWeek:false,cycleLength:2});
            if(n==='loadUiSettings')return JSON.stringify({language:'fr'});
            if(n==='listProfiles')return JSON.stringify({current:'main',profiles:[{id:'main',name:'Principal'}]});
            if(n==='loadAdvancedSetting')return '';
            if(n==='getCurrentWeek')return 'B';
            if(n==='getAppVersionName')return '7.35';
            if(n==='loadHolidays'||n==='loadSchoolHolidays')return '[]';
            if(n.startsWith('load'))return '{}';
            if(n.startsWith('get')||n.startsWith('is'))return '';
            return '';
          }}});
          window.alert=()=>{};window.confirm=()=>true;
          </script>'''
          html=html.replace('<head>','<head>'+stub,1)
          measure=r'''<script>
          setTimeout(()=>{
            try{
              const modal=document.getElementById('settingsModal');
              if(modal){modal.classList.add('show','edtForceVisible695');modal.setAttribute('data-edt-open','true');modal.style.display='block'}
              const defs=[
                ['settingsLanguage698','#languageSelect'],
                ['settingsTypeWeek692','#settingsWeekCycle678>.settingTitle'],
                ['settingsText692','#appFontTitle'],
                ['settingsColors692','#themeTitle,.edtThemeTitle696'],
                ['settingsDisplay692','#widgetBaseTitle706,#breakDisplaySetting .feedback663Title,.edtFirstSubTitle696'],
                ['advancedSettings85','#languageExtraTitle85,.edtLanguagesTitle696']
              ];
              const report={};
              /* 7.35 functional/visual checks. */
              const advanced=document.getElementById('advancedSettings85');
              if(advanced){advanced.open=true;try{if(window.refresh735)window.refresh735()}catch(e){}}
              const sheet0=document.getElementById('settingsSheet'),title0=document.getElementById('settingsTitle');
              const titleWord=title0&&title0.querySelector('.settingsText735');
              const langSummary=document.querySelector('#settingsLanguage698>summary .edtSummaryLabel700')||document.querySelector('#settingsLanguage698>summary');
              if(sheet0&&(titleWord||title0)){
                const s0=sheet0.getBoundingClientRect(),t0=(titleWord||title0).getBoundingClientRect();
                const lang0=langSummary&&langSummary.getBoundingClientRect();
                report._settingsWordCenterDelta=+(((t0.left+t0.right)/2)-((s0.left+s0.right)/2)).toFixed(2);
                report._settingsVsLanguageDelta=lang0?+(((t0.left+t0.right)/2)-((lang0.left+lang0.right)/2)).toFixed(2):999;
                report._settingsGroupText=(title0.textContent||'').trim();
              }
              try{
                const slotBox=document.getElementById('slotSettings');
                if(typeof renderSlots==='function')renderSlots();
                const before=slotBox?slotBox.querySelectorAll('.slotRow').length:0;
                const removedStart=typeof slots!=='undefined'&&slots[2]?slots[2].start:'10:00';
                const removedEnd=typeof slots!=='undefined'&&slots[2]?slots[2].end:'11:00';
                try{if(window.removeSlotAt680)window.removeSlotAt680(2)}catch(e){}
                try{if(window.refreshStability78)window.refreshStability78()}catch(e){}
                try{if(window.refreshFinalPolish)window.refreshFinalPolish()}catch(e){}
                try{if(typeof renderSlots==='function')renderSlots()}catch(e){}
                const after=slotBox?slotBox.querySelectorAll('.slotRow').length:0;
                const times=slotBox?[...slotBox.querySelectorAll('.slotRow')].map(r=>[...r.querySelectorAll('input[type=time]')].map(i=>i.value).join('-')):[];
                let weekHasRemoved=false,courseStillExists=false;
                try{
                  activeWeek='A';state=weeks.A;if(typeof renderWeek==='function')renderWeek();
                  const labels=[...document.querySelectorAll('#weekGrid>.wh.timecol')].map(el=>(el.textContent||'').replace(/\s+/g,' '));
                  weekHasRemoved=labels.some(t=>t.includes(removedStart)&&t.includes(removedEnd));
                  courseStillExists=['A','B'].some(w=>weeks[w]&&weeks[w][2]&&weeks[w][2].courses.some(x=>(x.label||'').startsWith('Test ')));
                }catch(e){}
                report._slotDelete={before,after,slotLength:typeof slots!=='undefined'?slots.length:null,uniqueTimes:new Set(times).size,totalTimes:times.length,weekHasRemoved,courseStillExists};
              }catch(e){report._slotDelete={error:String(e)}}
              const dateInput=document.getElementById('advRangeStart');
              if(dateInput){
                const ds=getComputedStyle(dateInput);
                report._rangeDateHeight=+parseFloat(ds.height).toFixed(1);
                report._rangeDateBackground=ds.backgroundColor;
                report._rangeDatePadding=[parseFloat(ds.paddingLeft)||0,parseFloat(ds.paddingRight)||0];
                report._dateArrow=!!dateInput.parentElement?.querySelector('.dateArrow734');
              }
              const profile=document.getElementById('advProfileSelect');
              if(profile){
                const overlay=profile.parentElement?.querySelector('.profileValue735');
                const pr=profile.getBoundingClientRect(),or=overlay&&overlay.getBoundingClientRect();
                report._profile={
                  customArrow734:!!profile.parentElement?.querySelector('.profileArrow734'),
                  overlay:!!overlay,
                  value:profile.options[profile.selectedIndex]?.textContent||'',
                  overlayText:overlay?.textContent||'',
                  centerDelta:or?+(((or.left+or.right)/2)-((pr.left+pr.right)/2)).toFixed(2):999
                };
              }
              const mode=document.getElementById('widgetTopBarMode672');
              if(mode)report._widgetColorLabel=mode.options[1]?.textContent||'';
              const breakNames=[...document.querySelectorAll('#settingsDisplay692 .breakSettings .breakName')].map(el=>{const s=getComputedStyle(el);return {text:(el.textContent||'').trim(),justify:s.justifyContent,align:s.alignItems,textAlign:s.textAlign}});
              report._breakNames=breakNames;
              const status=document.getElementById('schoolAutoStatus725');
              const holidayLabel=document.getElementById('advHolidayLabel');
              const holidayRow=holidayLabel?.closest('.advRow')||holidayLabel?.parentElement;
              if(status&&holidayRow){
                report._holidayGap=+(holidayRow.getBoundingClientRect().top-status.getBoundingClientRect().bottom).toFixed(1);
              }
              report._advancedStable=advanced?!advanced.classList.contains('edtAdvStabilizing735'):false;
              report._summaryEffects=[...document.querySelectorAll('#settingsSheet summary')].map(s=>{
                const cs=getComputedStyle(s);return {transition:cs.transitionDuration,animation:cs.animationName,opacity:cs.opacity}
              });
              for(const [id,sel] of defs){
                document.querySelectorAll('#settingsSheet details').forEach(d=>d.open=false);
                const d=document.getElementById(id); if(!d)continue;
                function glyphRect(el){
                  if(!el)return null;
                  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                  let n;
                  while((n=walker.nextNode())){
                    if((n.nodeValue||'').trim()){
                      const range=document.createRange(); range.selectNodeContents(n);
                      const rect=range.getBoundingClientRect();
                      if(rect.width>0&&rect.height>0)return rect;
                    }
                  }
                  return el.getBoundingClientRect();
                }
                const closedLabel=d.querySelector(':scope>summary .edtSummaryLabel700')||d.querySelector(':scope>summary');
                const closedDetails=d.getBoundingClientRect(), closedGlyph=glyphRect(closedLabel);
                const closedTitleTopGap=closedGlyph.top-closedDetails.top;
                d.open=true;
                const label=d.querySelector(':scope>summary .edtSummaryLabel700')||d.querySelector(':scope>summary');
                const first=d.querySelector(sel);
                if(!label||!first)continue;
                const titleGlyph=glyphRect(label), firstVisual=glyphRect(first);
                const s=d.querySelector(':scope>summary').getBoundingClientRect(), dr=d.getBoundingClientRect();
                report[id]={
                  summaryHeight:+s.height.toFixed(1),
                  topGap:+(titleGlyph.top-dr.top).toFixed(1),
                  bottomGap:+(firstVisual.top-titleGlyph.bottom).toFixed(1),
                  balanceError:+((firstVisual.top-titleGlyph.bottom)-(titleGlyph.top-dr.top)).toFixed(1),
                  closedTopGap:+closedTitleTopGap.toFixed(1),
                  firstText:(first.textContent||'').trim().slice(0,80)
                };
              }
              document.querySelectorAll('#settingsSheet details').forEach(d=>d.open=false);
              const weeks=document.getElementById('settingsTypeWeek692');if(weeks){weeks.open=true;try{if(window.refresh735)window.refresh735()}catch(e){}}
              const slotBoxFinal=document.getElementById('slotSettings');
              report._settingsSlotRows=slotBoxFinal?slotBoxFinal.querySelectorAll(':scope > .slotRow').length:0;
              report._settingsSlotExpected=typeof slots!=='undefined'&&Array.isArray(slots)?slots.length:0;
              const pre=document.createElement('pre');pre.id='visual-report';pre.textContent=JSON.stringify(report);document.body.appendChild(pre);
              document.documentElement.dataset.visualDone='1';
              document.scrollingElement.scrollTop=Math.max(0,(weeks?.getBoundingClientRect().top||0)-100);
            }catch(e){
              const pre=document.createElement('pre');pre.id='visual-report';pre.textContent=JSON.stringify({error:String(e),stack:e.stack});document.body.appendChild(pre);
              document.documentElement.dataset.visualDone='1';
            }
          },3500);
          </script>'''
          html=html.replace('</body>',f'<script>{runtime}</script>'+measure+'</body>')
          Path('build/visual/harness.html').write_text(html,encoding='utf-8')
          advanced=r'''<script>
          setTimeout(()=>{
            const modal=document.getElementById('settingsModal'),sheet=document.getElementById('settingsSheet');
            if(modal){modal.classList.add('show','edtForceVisible695');modal.setAttribute('data-edt-open','true');modal.style.display='block'}
            document.querySelectorAll('#settingsSheet details').forEach(d=>d.open=false);
            const adv=document.getElementById('advancedSettings85');
            if(adv){adv.open=true;try{if(window.refresh735)window.refresh735()}catch(e){}}
            setTimeout(()=>{if(sheet&&adv)sheet.scrollTop=Math.max(0,adv.offsetTop-35)},120);
          },4300);
          </script>'''
          Path('build/visual/harness-advanced.html').write_text(html.replace('</body>',advanced+'</body>'),encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --virtual-time-budget=6000 --window-size=360,780 --force-device-scale-factor=2             --dump-dom "file://$PWD/build/visual/harness.html" > build/visual/dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --virtual-time-budget=6000 --window-size=360,780 --force-device-scale-factor=2             --screenshot="$PWD/build/visual/settings.png" "file://$PWD/build/visual/harness.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --virtual-time-budget=7000 --window-size=360,780 --force-device-scale-factor=2             --screenshot="$PWD/build/visual/advanced.png" "file://$PWD/build/visual/harness-advanced.html"
          python3 - <<'PY'
          import re, html as h, json, pathlib
          dom=pathlib.Path('build/visual/dom.html').read_text(errors='ignore')
          m=re.search(r'<pre id="visual-report">(.*?)</pre>',dom,re.S)
          if not m: raise SystemExit('visual report missing')
          raw=h.unescape(m.group(1))
          report=json.loads(raw)
          pathlib.Path('build/visual/report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          center=float(report.get('_settingsWordCenterDelta',999))
          lang=float(report.get('_settingsVsLanguageDelta',999))
          if abs(center)>1.0 or abs(lang)>1.0: raise SystemExit(f'word Réglages is not centered on Langue: sheet={center}px language={lang}px')
          if 'Réglages' not in str(report.get('_settingsGroupText','')): raise SystemExit(f'settings title invalid: {report.get("_settingsGroupText")}')
          if not report.get('_advancedStable'): raise SystemExit('advanced settings still has a transient first layout')
          effects=report.get('_summaryEffects') or []
          if not effects or any(x.get('transition') not in ('0s','0ms') or x.get('animation') not in ('none','') or x.get('opacity')!='1' for x in effects): raise SystemExit(f'accordion title press effects still active: {effects}')
          holiday=float(report.get('_holidayGap',999))
          if not -1.0 <= holiday <= 8.0: raise SystemExit(f'automatic holidays row is still too far from loaded-period status: gap={holiday}px')
          if int(report.get('_settingsSlotRows',-1)) != int(report.get('_settingsSlotExpected',-2)) or int(report.get('_settingsSlotRows',0))<1: raise SystemExit(f'class-time rows are missing in settings: rows={report.get("_settingsSlotRows")} expected={report.get("_settingsSlotExpected")}')
          prof=report.get('_profile') or {}
          if prof.get('customArrow734') or not prof.get('overlay') or prof.get('overlayText')!=prof.get('value') or abs(float(prof.get('centerDelta',999)))>0.5: raise SystemExit(f'profile text is not centered without the extra arrow: {prof}')
          slot=report.get('_slotDelete') or {}
          if slot.get('after') != slot.get('before',0)-1: raise SystemExit(f'slot delete did not remove exactly one row: {slot}')
          if slot.get('slotLength') != slot.get('after'): raise SystemExit(f'slot array and rendered rows differ after deletion: {slot}')
          if slot.get('uniqueTimes') != slot.get('totalTimes'): raise SystemExit(f'slot delete produced duplicated time rows: {slot}')
          if slot.get('weekHasRemoved'): raise SystemExit(f'deleted slot still appears in week view: {slot}')
          if slot.get('courseStillExists'): raise SystemExit(f'course from deleted slot still exists: {slot}')
          h=float(report.get('_rangeDateHeight',999))
          if h>28.5: raise SystemExit(f'date fields are not compact enough: height={h}px')
          if report.get('_rangeDateBackground') not in ('rgb(255, 255, 255)','rgba(255, 255, 255, 1)'): raise SystemExit(f'date fields are not white: {report.get("_rangeDateBackground")}')
          pads=report.get('_rangeDatePadding') or [999,0]
          if abs(float(pads[0])-float(pads[1]))>0.5 or not report.get('_dateArrow'): raise SystemExit(f'date content is not symmetrically centered: padding={pads}, arrow={report.get("_dateArrow")}')
          if report.get('_widgetColorLabel')!='Couleur': raise SystemExit(f'widget color option label is wrong: {report.get("_widgetColorLabel")}')
          break_names=report.get('_breakNames') or []
          if not break_names or any(x.get('justify')!='center' or x.get('align')!='center' or x.get('textAlign')!='center' for x in break_names): raise SystemExit(f'break labels are not centered: {break_names}')
          required=['settingsLanguage698','settingsTypeWeek692','settingsText692','settingsColors692','settingsDisplay692']
          missing=[k for k in required if k not in report]
          if missing: raise SystemExit('missing visual sections: '+','.join(missing))
          heights=[float(report[k]['summaryHeight']) for k in required]
          top=[float(report[k]['topGap']) for k in required]
          bottom=[float(report[k]['bottomGap']) for k in required]
          closed=[float(report[k]['closedTopGap']) for k in required]
          errors=[float(report[k]['balanceError']) for k in required]
          if not all(abs(x-72.0)<=0.2 for x in heights): raise SystemExit(f'open summary height must remain 72px: {heights}')
          if not all(abs(a-b)<=0.5 for a,b in zip(top,closed)): raise SystemExit(f'title moved on open: open={top} closed={closed}')
          if not all(abs(x)<=3.0 for x in errors): raise SystemExit(f'top/bottom visual spacing not balanced: top={top} bottom={bottom} errors={errors}')
          print('VISUAL_BALANCE_OK',{'top':top,'bottom':bottom,'errors':errors,'heights':heights})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: EDT-visual-spacing-report
          path: |
            android-widget/build/visual/report.json
            android-widget/build/visual/settings.png
            android-widget/build/visual/advanced.png
            android-widget/build/visual/dom.html
          if-no-files-found: error

      - name: Verify package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='735001' versionName='7.35'" /tmp/badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EDT-7.35-tested-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDT-7.35-tested
          path: android-widget/app/build/outputs/apk/debug/EDT-7.35-tested-debug.apk
          if-no-files-found: error
