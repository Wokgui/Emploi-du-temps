name: Build and validate Android timetable

on:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

concurrency:
  group: android-widget-main-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-widget

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1
      - name: Clean build
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify install version and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='635001' versionName='6.35'" app/build/outputs/apk/debug/badging.txt
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/emploi-du-temps-widget.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Install screenshot validator
        run: python3 -m pip install --quiet pillow
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: smoke-apk
      - name: Exercise app, temporal states and production widget rows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r smoke-apk/emploi-du-temps-widget.apk
            adb shell wm size 1080x1920
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb logcat -c

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode edit > smoke/launch-edit.txt
            sleep 5
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode edit >/dev/null
            sleep 1
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-edit.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-edit.txt
            adb exec-out screencap -p > smoke/01-edit.png
            adb logcat -d > smoke/logcat-edit-full.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget|Uncaught (SyntaxError|ReferenceError|NotFoundError)" smoke/logcat-edit-full.txt

            adb shell input tap 1010 145
            sleep 2
            adb shell uiautomator dump /sdcard/anr-guard.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/anr-guard.xml 2>/dev/null | grep -Fq "isn't responding"; then adb shell input tap 540 1085 || true; sleep 2; fi
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb exec-out screencap -p > smoke/02-settings.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode week > smoke/launch-week.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-week.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-week.txt
            adb exec-out screencap -p > smoke/03-week.png

            # Temporal scenarios are intentionally validated without UIAutomator.
            # Repeated UIAutomator dumps are unstable on the hosted Android 35 emulator
            # and can be killed with exit 137 even while the app remains healthy.
            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today --es test_now 2026-09-10T07:45:00 > smoke/launch-before.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-before.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-before.txt
            adb exec-out screencap -p > smoke/04-before.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today --es test_now 2026-09-10T08:30:00 > smoke/launch-active.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-active.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-active.txt
            adb exec-out screencap -p > smoke/05-active.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today --es test_now 2026-09-10T12:30:00 > smoke/launch-lunch.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-lunch.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-lunch.txt
            adb exec-out screencap -p > smoke/06-lunch.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today --es test_now 2026-09-10T15:30:00 > smoke/launch-gap.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-gap.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-gap.txt
            adb exec-out screencap -p > smoke/07-gap.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity --es open_mode today --es test_now 2026-09-10T17:30:00 > smoke/launch-after.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-after.txt || true
            grep -Fq "com.wokgui.schedulewidget/.MainActivity" smoke/activity-after.txt
            adb exec-out screencap -p > smoke/08-after.png

            # A process can be alive while the WebView is still blank. Reject the
            # nearly uniform screenshots that exposed the cold-start regression.
            python3 - <<'PY'
            from PIL import Image
            from pathlib import Path
            checks = [
                '03-week.png','04-before.png','05-active.png',
                '06-lunch.png','07-gap.png','08-after.png'
            ]
            for name in checks:
                im = Image.open(Path('smoke') / name).convert('RGB').resize((270, 480))
                px = list(im.getdata())
                dark = sum(1 for r,g,b in px if r+g+b < 600) / len(px)
                chroma = sum(1 for r,g,b in px if max(r,g,b)-min(r,g,b) > 20) / len(px)
                print(name, 'dark=', round(dark,4), 'chroma=', round(chroma,4))
                if dark < 0.01 and chroma < 0.01:
                    raise SystemExit(f'Blank timetable screen detected: {name}')
            PY

            # Exact production RemoteViews, deterministic compact/expanded scenarios.
            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 108 --ei width_dp 350 --es scenario active > smoke/launch-widget-active.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-widget-active.txt || true
            grep -Fq "com.wokgui.schedulewidget/.WidgetPreviewActivity" smoke/activity-widget-active.txt
            adb exec-out screencap -p > smoke/09-widget-active.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 216 --ei width_dp 350 --es scenario lunch > smoke/launch-widget-lunch.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-widget-lunch.txt || true
            grep -Fq "com.wokgui.schedulewidget/.WidgetPreviewActivity" smoke/activity-widget-lunch.txt
            adb exec-out screencap -p > smoke/10-widget-lunch.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 216 --ei width_dp 350 --es scenario gap > smoke/launch-widget-gap.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-widget-gap.txt || true
            grep -Fq "com.wokgui.schedulewidget/.WidgetPreviewActivity" smoke/activity-widget-gap.txt
            adb exec-out screencap -p > smoke/11-widget-gap.png

            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.WidgetPreviewActivity --ei height_dp 108 --ei width_dp 350 --es scenario after > smoke/launch-widget-after.txt
            sleep 4
            test -n "$(adb shell pidof com.wokgui.schedulewidget | tr -d '\r')"
            adb shell dumpsys activity activities > smoke/activity-widget-after.txt || true
            grep -Fq "com.wokgui.schedulewidget/.WidgetPreviewActivity" smoke/activity-widget-after.txt
            adb exec-out screencap -p > smoke/12-widget-after.png

            adb logcat -d > smoke/logcat-full.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget|Uncaught (SyntaxError|ReferenceError|NotFoundError)" smoke/logcat-full.txt
      - name: Upload smoke-test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshots
          path: smoke/
          if-no-files-found: ignore

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: release-apk
      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest release-apk/emploi-du-temps-widget.apk --clobber
