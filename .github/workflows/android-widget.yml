name: Build and validate Android timetable

on:
  push:
    branches: [main, feature/widget-layout-picker-655, feature/widget-selectable-formats-656, feature/widget-polish-657, feature/widget-week-polish-658, perf/instant-views-647, perf/heavy-panels-648, perf/heavy-panels-649, perf/render-pipeline-650, perf/action-chains-651, perf/rare-actions-652]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
concurrency:
  group: android-widget-${{ github.ref_name }}-v15
  cancel-in-progress: true
permissions: {contents: write}

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: bash android-widget/ci/run_browser_651.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: android-widget}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Use runner Android SDK directly
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: emploi-du-temps-debug-keystore-v1}
      - run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify 6.58 package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='658001' versionName='6.58'" app/build/outputs/apk/debug/badging.txt
      - run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/emploi-du-temps-widget.apk
      - uses: actions/upload-artifact@v4
        with: {name: emploi-du-temps-widget-apk, path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk, if-no-files-found: error}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Use runner Android SDK directly
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
      - run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - run: python3 -m pip install --quiet pillow
      - uses: actions/download-artifact@v4
        with: {name: emploi-du-temps-widget-apk, path: smoke-apk}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: bash android-widget/ci/run_smoke_646.sh && bash android-widget/ci/run_widget_formats_655.sh && bash android-widget/ci/run_latency_647.sh

  heavy-panels:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Use runner Android SDK directly
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
      - run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: actions/download-artifact@v4
        with: {name: emploi-du-temps-widget-apk, path: smoke-apk}
      - uses: reactivecircus/android-emulator-runner@v2
        env: {EDT_HEAVY_REQUIRE_FAST: '1'}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: bash android-widget/ci/run_heavy_panels_648.sh
