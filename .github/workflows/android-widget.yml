name: Clean Android 7.13 build

on:
  push:
    branches: [fix/713-visual-category-spacing]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-widget
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android command-line tools
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='713001' versionName='7.13'" /tmp/badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EDT-7.13-clean-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDT-7.13-clean
          path: android-widget/app/build/outputs/apk/debug/EDT-7.13-clean-debug.apk
          if-no-files-found: error
