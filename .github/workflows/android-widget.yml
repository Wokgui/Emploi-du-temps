name: Build and validate Android timetable

on:
  push:
    branches: [refactor/ui-single-owner-679, codex/pause-midi-7-79]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
concurrency:
  group: android-widget-${{ github.ref_name }}-v19
  cancel-in-progress: true
permissions: {contents: write}

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: bash android-widget/ci/run_browser_679.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: android-widget}}
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android command-line tools
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Restore the existing Android signing key
        env:
          EDT_RELEASE_KEYSTORE_B64: ${{ secrets.EDT_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$EDT_RELEASE_KEYSTORE_B64" || { echo '::error::Clé de signature EDT indisponible.'; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/edt-signing.keystore"
          printf '%s' "$EDT_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          digest="$(LC_ALL=C keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          if [ "$digest" != "581c970557509c9a0d3e9ffba431a2683d75715b7be8356042fbf39c8330c589" ]; then
            echo "::error::La clé du secret ne correspond pas au certificat public EDT 7.79."
            exit 1
          fi
          echo "EDT_SIGNING_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify 7.80 debug build
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='780001' versionName='7.80'" app/build/outputs/apk/debug/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emploi-du-temps-7.80
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify the signer and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Emploi-du-temps-7.80.apk
          gh release download 'v7.79' --pattern 'Emploi-du-temps-7.79.apk' --output "$RUNNER_TEMP/previous-release.apk"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          signer_digest() {
            "$APKSIGNER" verify --print-certs "$1" | sed -nE 's/^(Signer|V[0-9.]+ Signer)[^:]*:?[[:space:]]+certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]{64})[[:space:]]*$/\2/p' | tr '[:upper:]' '[:lower:]' | sort -u
          }
          OLD_SIGNER="$(signer_digest "$RUNNER_TEMP/previous-release.apk")"
          NEW_SIGNER="$(signer_digest "Emploi-du-temps-7.80.apk")"
          test -n "$OLD_SIGNER"
          if [ "$OLD_SIGNER" != "$NEW_SIGNER" ]; then
            echo "::error::La signature diffère de celle de l’APK déjà publié."
            exit 1
          fi
          gh release create v7.80 Emploi-du-temps-7.80.apk --target "$GITHUB_SHA" --title 'Emploi du temps 7.80' --notes 'Corrige la pause de midi lorsqu’un cours occupe ce créneau.' --latest
