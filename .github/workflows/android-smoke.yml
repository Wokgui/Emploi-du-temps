name: Android emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-widget
        run: gradle :app:assembleDebug --stacktrace
      - name: Boot emulator and exercise main views
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            mkdir -p smoke
            adb install -r android-widget/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x1920
            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity | tee smoke/launch.txt
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml smoke/start.xml >/dev/null
            grep -Eq "Emploi du temps|Timetable|Stundenplan" smoke/start.xml
            adb exec-out screencap -p > smoke/01-edit.png

            # Bottom bar: Today / Week / Edit.
            adb shell input tap 180 1850; sleep 0.5; adb exec-out screencap -p > smoke/02-today.png
            adb shell input tap 540 1850; sleep 0.5; adb exec-out screencap -p > smoke/03-week.png
            adb shell input tap 900 1850; sleep 0.5; adb exec-out screencap -p > smoke/04-edit-return.png

            # Settings button near top-right of the WebView header.
            adb shell input tap 1010 145; sleep 0.5; adb exec-out screencap -p > smoke/05-settings.png
            adb shell uiautomator dump /sdcard/settings.xml >/dev/null
            adb pull /sdcard/settings.xml smoke/settings.xml >/dev/null || true

            adb logcat -d '*:E' > smoke/logcat-errors.txt || true
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget" smoke/logcat-errors.txt; then
              echo "App crash detected"
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshots
          path: smoke/
          if-no-files-found: error
