name: Finalize Android 6.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-631.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-android-631
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1
      - name: Apply 6.31 stabilization
        run: python3 .github/scripts/stabilize_631.py
      - name: Clean build
        working-directory: android-widget
        run: gradle clean :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace
      - name: Remove migration files
        run: rm -f .github/workflows/finalize-631.yml .github/workflows/stabilize-631.yml .github/scripts/stabilize_631.py
      - name: Commit 6.31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize runtime responsiveness and regression behavior 6.31 [skip ci]"
          git push
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-widget/app/build/outputs/apk/debug/app-debug.apk android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error
