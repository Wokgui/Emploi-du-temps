name: Stabilize Android 6.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-631.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stabilize-android-631
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: emploi-du-temps-debug-keystore-v1

      - name: Apply stabilization changes
        run: python3 .github/scripts/stabilize_631.py

      - name: Build clean APK
        working-directory: android-widget
        run: gradle clean :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Emulator smoke test and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            mkdir -p smoke
            adb install -r android-widget/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell am force-stop com.wokgui.schedulewidget
            adb shell am start -W -n com.wokgui.schedulewidget/.MainActivity | tee smoke/launch.txt
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml smoke/start.xml >/dev/null
            grep -Eq "Emploi du temps|Timetable|Stundenplan" smoke/start.xml
            adb exec-out screencap -p > smoke/01-start-edit.png

            # Today, Week and Edit bottom-navigation smoke passes.
            adb shell input tap 180 2325
            sleep 1
            adb exec-out screencap -p > smoke/02-today.png
            adb shell input tap 540 2325
            sleep 1
            adb exec-out screencap -p > smoke/03-week.png
            adb shell input tap 900 2325
            sleep 1
            adb exec-out screencap -p > smoke/04-edit.png

            # Settings gear.
            adb shell input tap 1015 170
            sleep 1
            adb exec-out screencap -p > smoke/05-settings.png

            adb logcat -d '*:E' > smoke/logcat-errors.txt || true
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com.wokgui.schedulewidget" smoke/logcat-errors.txt; then
              echo "App crash detected during smoke test"
              exit 1
            fi

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-6.31-smoke
          path: smoke/
          if-no-files-found: error

      - name: Remove one-shot stabilization files
        run: rm -f .github/workflows/stabilize-631.yml .github/scripts/stabilize_631.py

      - name: Commit validated 6.31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize runtime responsiveness and regression behavior 6.31 [skip ci]"
          git push

      - name: Rename APK
        run: cp android-widget/app/build/outputs/apk/debug/app-debug.apk android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emploi-du-temps-widget-apk
          path: android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk
          if-no-files-found: error

      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-latest >/dev/null 2>&1; then
            gh release create widget-latest --title "Emploi du temps widget" --notes "APK Android installable du widget d’emploi du temps."
          fi
          gh release upload widget-latest android-widget/app/build/outputs/apk/debug/emploi-du-temps-widget.apk --clobber
