name: Build Plan de classe v14
on:
  push:
    branches: ["plan-de-classe-v12"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install stable debug key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d plan-de-classe-v12/fixed-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Restore source and apply v14
        shell: bash
        run: |
          set -euo pipefail
          cat plan-de-classe-src/chunk_* > /tmp/plan.b64
          base64 -d /tmp/plan.b64 > /tmp/plan.zip
          rm -rf plan-de-classe
          mkdir -p plan-de-classe
          unzip -q /tmp/plan.zip -d plan-de-classe
          sed -i 's/android:layout_width="55%"/android:layout_width="180dp"/; s/android:layout_width="30%"/android:layout_width="100dp"/' plan-de-classe/app/src/main/res/layout/widget_preview_layout.xml
          cp plan-de-classe-v12/v14.css plan-de-classe/app/src/main/assets/v14.css
          cp plan-de-classe-v12/v14.js plan-de-classe/app/src/main/assets/v14.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('plan-de-classe/app/src/main/assets/index.html')
          s=p.read_text()
          s=re.sub(r'<link[^>]+href=["\']v(?:12|13|14)[^"\']*\.css["\'][^>]*>','',s)
          s=re.sub(r'<script[^>]+src=["\']v(?:12|13|14)[^"\']*\.js["\'][^>]*></script>','',s)
          s=s.replace('</head>','<link rel="stylesheet" href="v14.css"></head>')
          s=s.replace('</body>','<script src="v14.js"></script></body>')
          s=s.replace("function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.classes?.length)return x}catch(e){}return{cur:null,classes:[defaultClass()]}}",
          "function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.classes?.length)return x}catch(e){}try{if(window.AndroidBridge&&AndroidBridge.loadState){let n=AndroidBridge.loadState();if(n){let x=JSON.parse(n);if(x&&x.classes?.length){localStorage.setItem(KEY,n);return x}}}}catch(e){}return{cur:null,classes:[defaultClass()]}}")
          p.write_text(s)
          g=Path('plan-de-classe/app/build.gradle')
          b=g.read_text()
          b=re.sub(r'versionCode\s+\d+','versionCode 20',b)
          b=re.sub(r"versionName\s+'[^']+'","versionName '14.0'",b)
          g.write_text(b)
          PY
          mkdir -p plan-de-classe/app/src/main/java/fr/wokgui/planclasse
          cp plan-de-classe-v12/MainActivity.java plan-de-classe/app/src/main/java/fr/wokgui/planclasse/MainActivity.java
          cp plan-de-classe-v12/PlanWidgetProvider.java plan-de-classe/app/src/main/java/fr/wokgui/planclasse/PlanWidgetProvider.java
          cp plan-de-classe-v12/AndroidManifest.xml plan-de-classe/app/src/main/AndroidManifest.xml
          mkdir -p plan-de-classe/app/src/main/res/layout plan-de-classe/app/src/main/res/xml plan-de-classe/app/src/main/res/drawable plan-de-classe/app/src/main/res/drawable-nodpi plan-de-classe/app/src/main/res/mipmap-anydpi-v26 plan-de-classe/app/src/main/res/values
          cp plan-de-classe-v12/widget_plan.xml plan-de-classe/app/src/main/res/layout/widget_plan.xml
          cp plan-de-classe-v12/widget_info.xml plan-de-classe/app/src/main/res/xml/widget_info.xml
          cp plan-de-classe-v12/ic_launcher_foreground.xml plan-de-classe/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp plan-de-classe-v12/ic_launcher.xml plan-de-classe/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp plan-de-classe-v12/ic_launcher.xml plan-de-classe/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          ICON_SRC=plan-de-classe/app/src/main/res/drawable-nodpi/app_icon.webp
          ICON_DST=plan-de-classe/app/src/main/res/drawable-nodpi/launcher_full.png
          if command -v magick >/dev/null 2>&1; then
            magick "$ICON_SRC" -fuzz 8% -trim +repage -resize '118x118^' -gravity center -extent 108x108 "$ICON_DST"
          elif command -v convert >/dev/null 2>&1; then
            convert "$ICON_SRC" -fuzz 8% -trim +repage -resize '118x118^' -gravity center -extent 108x108 "$ICON_DST"
          else
            cp "$ICON_SRC" plan-de-classe/app/src/main/res/drawable-nodpi/launcher_full.webp
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('plan-de-classe/app/src/main/res/values/colors.xml')
          if p.exists():
              s=p.read_text()
              if 'name="icon_bg"' not in s:s=s.replace('</resources>','    <color name="icon_bg">#087163</color>\n</resources>')
          else:s='<resources>\n    <color name="icon_bg">#087163</color>\n</resources>\n'
          p.write_text(s)
          p=Path('plan-de-classe/app/src/main/res/values/strings.xml')
          s=p.read_text() if p.exists() else '<resources></resources>'
          if 'name="widget_name"' not in s:s=s.replace('</resources>','    <string name="widget_name">Plan de classe</string>\n</resources>')
          if 'name="app_name"' not in s:s=s.replace('</resources>','    <string name="app_name">Plan de classe</string>\n</resources>')
          p.write_text(s)
          PY
          node --check plan-de-classe/app/src/main/assets/v14.js
      - name: Deep regression checks
        shell: bash
        run: |
          set -euo pipefail
          INDEX=plan-de-classe/app/src/main/assets/index.html
          grep -q 'v14.css' "$INDEX"
          grep -q 'v14.js' "$INDEX"
          ! grep -Eq 'v(12|13)[a-z0-9]*\.(js|css)' "$INDEX"
          grep -q "for(let slot=c.rows.length;slot>=0;slot--)" plan-de-classe/app/src/main/assets/v14.js
          grep -q "seat.onclick=onSeatClick" plan-de-classe/app/src/main/assets/v14.js
          grep -q "document.getElementById('mix').onclick=mix" plan-de-classe/app/src/main/assets/v14.js
          grep -q "Disposition rapide" plan-de-classe/app/src/main/assets/v14.js
          grep -q "Appliquer à tous les rangs" plan-de-classe/app/src/main/assets/v14.js
          grep -q "flex-direction:column!important" plan-de-classe/app/src/main/assets/v14.css
          grep -q "text-align:center!important" plan-de-classe/app/src/main/assets/v14.css
          grep -q "v14-plan-icon" plan-de-classe/app/src/main/assets/v14.css
          python3 - <<'PY'
          from pathlib import Path
          import re,collections
          s=Path('plan-de-classe/app/src/main/assets/index.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',s)
          dup=[k for k,v in collections.Counter(ids).items() if v>1]
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          PY
      - name: Build APK
        run: gradle -p plan-de-classe clean :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=plan-de-classe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='fr.wokgui.planclasse' versionCode='20' versionName='14.0'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/v14.js'
          unzip -l "$APK" | grep -q 'assets/v14.css'
          unzip -p "$APK" assets/index.html | grep -q 'v14.js'
          ! unzip -p "$APK" assets/index.html | grep -Eq 'v(12|13)[a-z0-9]*\.(js|css)'
          cp "$APK" Plan-de-classe-v14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Plan-de-classe-v14
          path: Plan-de-classe-v14.apk
          if-no-files-found: error
