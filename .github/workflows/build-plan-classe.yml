name: Build Plan de classe widget
on:
  push:
    branches: ["plan-de-classe-widget-v11"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android source
        shell: bash
        run: |
          cat plan-de-classe-src/chunk_* > /tmp/plan.b64
          base64 -d /tmp/plan.b64 > /tmp/plan.zip
          mkdir -p plan-de-classe
          unzip -q /tmp/plan.zip -d plan-de-classe
      - name: Build APK
        run: gradle -p plan-de-classe assembleDebug --stacktrace
      - name: Copy APK
        run: cp plan-de-classe/app/build/outputs/apk/debug/app-debug.apk Plan-de-classe-v11-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Plan-de-classe-v11-widget
          path: Plan-de-classe-v11-widget.apk
          if-no-files-found: error
