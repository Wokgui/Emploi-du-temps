name: Finalize Android 6.31 stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-631-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-631-stable
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply final stabilization
        run: python3 .github/scripts/finalize_631_final.py
      - name: Validate clean build
        working-directory: android-widget
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify fixed Android version code
        working-directory: android-widget
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.wokgui.schedulewidget' versionCode='631001' versionName='6.31'" /tmp/badging.txt
      - name: Commit app-source stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-widget/app/src/main/java/com/wokgui/schedulewidget/MainActivity.java android-widget/app/build.gradle
          git commit -m "Finalize 6.31 lifecycle stability"
          git push
